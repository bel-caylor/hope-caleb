name = "hope-caleb-wedding-planner-proxy"
main = "src/index.ts"
compatibility_date = "2026-06-03"
workers_dev = true

[[kv_namespaces]]
binding = "PLANNER_SESSIONS"
id = "7de2ae61852e489d98503d614b87977d"

[[kv_namespaces]]
binding = "PUBLIC_RSVP_LOOKUPS"
id = "07777229b98c49389b63a214d45c538f"

[triggers]
crons = ["*/5 * * * *"]

[vars]
PLANNER_ORIGIN = "https://hope-caleb.site"
# Optional comma-separated production origins, in addition to the built-in
# local development addresses (localhost and 127.0.0.1 on port 5173).
PLANNER_ORIGINS = "https://my-plan-5bi.pages.dev"
GOOGLE_CLIENT_ID = "1013045170295-uqapcrbk5aie1megfqa8jk62t87b2kha.apps.googleusercontent.com"
