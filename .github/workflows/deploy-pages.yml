name: Deploy GitHub Pages

on:
  push:
    branches:
      - wedding
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_RSVP_FEED_URL: ${{ vars.PUBLIC_RSVP_FEED_URL }}
      PLANNER_PROXY_URL: ${{ vars.PLANNER_PROXY_URL }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate required Pages variables
        shell: bash
        run: |
          missing=0
          for key in PUBLIC_RSVP_FEED_URL PLANNER_PROXY_URL GOOGLE_CLIENT_ID; do
            if [ -z "${!key}" ]; then
              echo "::error title=Missing Pages variable::$key is not set in GitHub repository variables."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build standalone site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-standalone

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
