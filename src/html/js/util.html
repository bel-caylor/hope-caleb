<script>
  const plannerMeta = (name) => document.querySelector(`meta[name="${name}"]`)?.getAttribute("content") || "";

  window.PLANNER_CTX = {
    googleClientId: plannerMeta("planner-google-client-id"),
    frontendVersion: plannerMeta("planner-build-version"),
    rsvpFeedUrl: plannerMeta("planner-rsvp-feed-url"),
    scriptBaseUrl: plannerMeta("planner-script-base-url")
  };

  function setStatus(element, message, tone) {
    if (!element) return;
    const nextMessage = String(message || "").trim();
    const contactMessage = tone === "error" && nextMessage && !/please contact hope, caleb, or belinda/i.test(nextMessage)
      ? " Please contact Hope, Caleb, or Belinda."
      : "";
    const placeholder = element.__statusPlaceholder || null;

    if (!nextMessage) {
      element.textContent = "";
      element.className = "status";
      delete element.dataset.tone;

      if (element.isConnected && element.parentNode) {
        const nextPlaceholder = placeholder || document.createComment(`status:${element.id || "anonymous"}`);
        element.__statusPlaceholder = nextPlaceholder;
        element.parentNode.insertBefore(nextPlaceholder, element);
        element.remove();
      }
      return;
    }

    if (!element.isConnected) {
      const parentNode = placeholder?.parentNode || element.__statusParent || null;
      if (parentNode) {
        parentNode.insertBefore(element, placeholder || null);
      }
      if (placeholder?.parentNode) {
        placeholder.remove();
      }
    }

    element.__statusParent = element.parentNode || element.__statusParent || null;
    element.textContent = `${nextMessage}${contactMessage}`;
    element.className = `status ${tone || ""}`.trim();
    if (tone) {
      element.dataset.tone = tone;
    } else {
      delete element.dataset.tone;
    }
  }

  function escapeHtml(value) {
    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }
  function renderTaskNotes(value) {
    const text = String(value || "");
    const linkPattern = /\[([^\]\r\n]+)\]\((https?:\/\/[^\s)]+)\)|https?:\/\/[^\s<>"']+/gi;
    let lastIndex = 0;
    let output = "";

    text.replace(linkPattern, (...matchParts) => {
      const [candidate, label, markdownUrl] = matchParts;
      const offset = matchParts[matchParts.length - 2];
      output += escapeHtml(text.slice(lastIndex, offset));
      const url = String(markdownUrl || candidate).replace(/[.,;:!?]+$/, "");
      const trailingText = markdownUrl ? "" : candidate.slice(url.length);
      const linkText = String(label || url);

      try {
        const parsed = new URL(url);
        output += (parsed.protocol === "http:" || parsed.protocol === "https:")
          ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(linkText)}</a>${escapeHtml(trailingText)}`
          : escapeHtml(candidate);
      } catch (_) {
        output += escapeHtml(candidate);
      }

      lastIndex = offset + candidate.length;
      return candidate;
    });

    return output + escapeHtml(text.slice(lastIndex));
  }
</script>
