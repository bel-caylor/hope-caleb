  function createClientId(prefix) {
    return `${String(prefix || "item").trim()}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
  }

  function sortBeds(items) {
    return [...items].sort((left, right) => {
      const orderDelta = Number(left.sortOrder || 0) - Number(right.sortOrder || 0);
      if (orderDelta !== 0) {
        return orderDelta;
      }
      return `${left.lodging || ""} ${left.room || ""} ${left.bedLabel || ""}`.localeCompare(
        `${right.lodging || ""} ${right.room || ""} ${right.bedLabel || ""}`
      );
    });
  }

  function upsertItemById(items, nextItem) {
    const nextId = String(nextItem?.id || "").trim();
    if (!nextId) {
      return [...items];
    }

    const nextItems = [...items];
    const existingIndex = nextItems.findIndex((item) => String(item?.id || "").trim() === nextId);
    if (existingIndex >= 0) {
      nextItems[existingIndex] = nextItem;
      return nextItems;
    }

    nextItems.unshift(nextItem);
    return nextItems;
  }

  function getRequestedView() {
    const pathname = String(window.location.pathname || "").toLowerCase();
    if (pathname.endsWith("/dashboard.html") || pathname.endsWith("dashboard.html")) {
      return "planner";
    }

    const requested = new URLSearchParams(window.location.search).get("view");
    return requested === "planner" ? "planner" : "home";
  }

  function navigateTo(view) {
    const url = new URL(window.location.href);
    const pathname = String(url.pathname || "").toLowerCase();

    if (pathname.endsWith("/dashboard.html") || pathname.endsWith("dashboard.html")) {
      currentView = "planner";
      renderRoute();
      maybeLoadPlannerData();
      return;
    }

    if (view === "planner") {
      url.searchParams.set("view", "planner");
    } else {
      url.searchParams.delete("view");
    }
    window.history.pushState({}, "", url);
    currentView = view;
    renderRoute();
    maybeLoadPlannerData();
  }

  function renderRoute() {
    routedViews.forEach((section) => {
      section.hidden = section.dataset.view !== currentView;
    });

    routeLinks.forEach((link) => {
      link.classList.toggle("is-active", link.dataset.routeLink === currentView);
    });

    const showPlanner = currentView === "planner";
    plannerMenuToggleButton.hidden = !showPlanner || !viewerProfile.isAdmin;
    plannerLockedEl.hidden = !showPlanner || viewerProfile.isAdmin;
    plannerUnlockedEl.hidden = !showPlanner || !viewerProfile.isAdmin;
    plannerContentEl.hidden = !showPlanner || !viewerProfile.isAdmin;
    setActivePlannerPanel(activePlannerPanel);
    syncPlannerSidebar();
    updateViewerState();
  }

  function setActivePlannerPanel(panelName) {
    const availablePanels = plannerPanels.map((panel) => panel.dataset.plannerPanel);
    const nextPanel = availablePanels.includes(panelName) ? panelName : availablePanels[0];
    if (!nextPanel) {
      return;
    }

    activePlannerPanel = nextPanel;
    const navPanel = nextPanel === "event-detail" ? "events" : nextPanel;

    plannerSectionButtons.forEach((button) => {
      const isActive = button.dataset.plannerSection === navPanel;
      button.classList.toggle("is-active", isActive);
      button.setAttribute("aria-pressed", isActive ? "true" : "false");
    });

    plannerPanels.forEach((panel) => {
      panel.hidden = panel.dataset.plannerPanel !== nextPanel;
    });
  }

  function toLocalInputValue(isoString) {
    if (!isoString) return "";
    const date = new Date(isoString);
    if (Number.isNaN(date.getTime())) return "";
    const pad = (value) => String(value).padStart(2, "0");
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
  }

  function formatEventDate(dateValue) {
    const raw = String(dateValue || "").trim();
    if (!raw) return "";

    const directMatch = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (directMatch) {
      const localDate = new Date(Number(directMatch[1]), Number(directMatch[2]) - 1, Number(directMatch[3]));
      return localDate.toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" });
    }

    const parsed = new Date(raw);
    return Number.isNaN(parsed.getTime())
      ? raw
      : parsed.toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" });
  }

  function formatEventTime(timeValue) {
    const raw = String(timeValue || "").trim();
    if (!raw) return "";

    const twentyFourHourMatch = raw.match(/^(\d{1,2}):(\d{2})$/);
    if (twentyFourHourMatch) {
      const hours = Number(twentyFourHourMatch[1]);
      const minutes = twentyFourHourMatch[2];
      const suffix = hours >= 12 ? "PM" : "AM";
      const normalizedHour = hours % 12 || 12;
      return `${normalizedHour}:${minutes} ${suffix}`;
    }

    const parsed = new Date(raw);
    return Number.isNaN(parsed.getTime())
      ? raw
      : parsed.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }

  function formatEventSchedule(event) {
    return [formatEventDate(event.date), formatEventTime(event.startsAt)].filter(Boolean).join(" at ");
  }

  function formatEventDateShort(dateValue) {
    const raw = String(dateValue || "").trim();
    if (!raw) return "";

    const directMatch = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (directMatch) {
      const localDate = new Date(Number(directMatch[1]), Number(directMatch[2]) - 1, Number(directMatch[3]));
      return localDate.toLocaleDateString([], { month: "short", day: "numeric" });
    }

    const parsed = new Date(raw);
    return Number.isNaN(parsed.getTime())
      ? raw
      : parsed.toLocaleDateString([], { month: "short", day: "numeric" });
  }

  function getEventDateFilterValue(event) {

  function getEventAssignedToFilterValue(event) {

  function getEventAssignedToTokens(event) {

  }

  function parseEventDateTime(event) {
    const rawDate = String(event?.date || "").trim();
    if (!rawDate) {
      return null;
    }

    let parsedDate;
    const dateMatch = rawDate.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (dateMatch) {
      parsedDate = new Date(Number(dateMatch[1]), Number(dateMatch[2]) - 1, Number(dateMatch[3]));
    } else {
      parsedDate = new Date(rawDate);
    }

    if (Number.isNaN(parsedDate.getTime())) {
      return null;
    }

    const rawTime = String(event?.startsAt || "").trim();
    if (!rawTime) {
      parsedDate.setHours(0, 0, 0, 0);
      return parsedDate;
    }

    const twentyFourHourMatch = rawTime.match(/^(\d{1,2}):(\d{2})$/);
    if (twentyFourHourMatch) {
      parsedDate.setHours(Number(twentyFourHourMatch[1]), Number(twentyFourHourMatch[2]), 0, 0);
      return parsedDate;
    }

    const twelveHourMatch = rawTime.match(/^(\d{1,2}):(\d{2})\s*([AP]M)$/i);
    if (twelveHourMatch) {
      let hours = Number(twelveHourMatch[1]) % 12;
      if (twelveHourMatch[3].toUpperCase() === "PM") {
        hours += 12;
      }
      parsedDate.setHours(hours, Number(twelveHourMatch[2]), 0, 0);
      return parsedDate;
    }

    return parsedDate;
  }

  function isTrueLike(value) {
    const normalized = String(value == null ? "" : value).trim().toLowerCase();
    return normalized === "true" || normalized === "yes" || normalized === "1";
  }

  function isFalseLike(value) {
    const normalized = String(value == null ? "" : value).trim().toLowerCase();
    return normalized === "false" || normalized === "no" || normalized === "0";
  }

  function getNextMainEvent() {
    const now = Date.now();
    const activeEvents = cachedEvents.filter((event) => !isFalseLike(event.active));
    const futureMainEvents = activeEvents.filter((event) => isTrueLike(event.main) && parseEventDateTime(event)?.getTime() >= now);
    if (futureMainEvents.length) {
      return futureMainEvents[0];
    }

    const futureEvents = activeEvents.filter((event) => parseEventDateTime(event)?.getTime() >= now);
    if (futureEvents.length) {
      return futureEvents[0];
    }

    const mainEvents = activeEvents.filter((event) => isTrueLike(event.main));
    return mainEvents[0] || null;
  }

  function getCountdownParts(targetDate) {
    if (!(targetDate instanceof Date) || Number.isNaN(targetDate.getTime())) {
      return null;
    }

    const diffMs = targetDate.getTime() - Date.now();
    if (diffMs <= 0) {
      return { days: "0", hours: "00", minutes: "00", seconds: "00", isPast: true };
    }

    const totalSeconds = Math.floor(diffMs / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    return {
      days: String(days),
      hours: String(hours).padStart(2, "0"),
      minutes: String(minutes).padStart(2, "0"),
      seconds: String(seconds).padStart(2, "0"),
      isPast: false
    };
  }

  function updatePlannerCountdown(targetDate, eventTitle) {
    const countdownRoot = plannerSummaryEl.querySelector("[data-planner-countdown]");
    if (!countdownRoot) {
      return;
    }

    const dayEl = countdownRoot.querySelector("[data-countdown-days]");
    const hourEl = countdownRoot.querySelector("[data-countdown-hours]");
    const minuteEl = countdownRoot.querySelector("[data-countdown-minutes]");
    const secondEl = countdownRoot.querySelector("[data-countdown-seconds]");
    const summaryEl = countdownRoot.querySelector("[data-countdown-summary]");
    const parts = getCountdownParts(targetDate);

    if (!dayEl || !hourEl || !minuteEl || !secondEl || !summaryEl || !parts) {
      return;
    }

    dayEl.textContent = parts.days;
    hourEl.textContent = parts.hours;
    minuteEl.textContent = parts.minutes;
    secondEl.textContent = parts.seconds;
    summaryEl.textContent = parts.isPast
      ? `${eventTitle} is happening now or has already started.`
      : `${parts.days} days until ${eventTitle.toLowerCase()}.`;
  }

  function startPlannerCountdown(targetDate, eventTitle) {
    if (plannerCountdownTimer) {
      window.clearInterval(plannerCountdownTimer);
      plannerCountdownTimer = null;
    }

    if (!(targetDate instanceof Date) || Number.isNaN(targetDate.getTime())) {
      return;
    }

    updatePlannerCountdown(targetDate, eventTitle);
    plannerCountdownTimer = window.setInterval(() => {
      updatePlannerCountdown(targetDate, eventTitle);
    }, 1000);
  }

  function renderShotEventOptions(selectedEventId = "") {
    const eventField = shotForm?.elements?.namedItem("eventId");

    const mainEvents = cachedEvents.filter((event) => event.main);
    eventField.innerHTML = `
      <option value="">${mainEvents.length ? "Select event" : "No main events yet"}</option>
      ${mainEvents.map((event) => `
        <option value="${escapeHtml(String(event.id || "").trim())}">
          ${escapeHtml([event.title || "Untitled event", formatEventSchedule(event)].filter(Boolean).join(" | "))}
        </option>
      `).join("")}
    `;
    const normalizedSelectedEventId = String(selectedEventId || "").trim();
    eventField.value = mainEvents.some((event) => String(event.id || "").trim() === normalizedSelectedEventId)
      ? normalizedSelectedEventId
      : "";
    eventField.disabled = mainEvents.length === 0;
  }

  function buildEventAiPrompt(eventItem, options = {}) {
    if (!eventItem) {
      return "";
    }

    const planningNotes = String(options.planningNotes || "").trim();
    const goals = Array.isArray(options.goals) ? options.goals : [];
    const relatedShots = getShotsForEvent(eventItem.id);
    const goalSentence = goals.length
      ? goals.join(", ")
      : "todo items, shopping or packing lists, and photo shot ideas";
    const existingShotsText = relatedShots.length
      ? relatedShots.map((shot, index) => `${index + 1}. ${shot.title || "Untitled shot"}${shot.description ? ` - ${shot.description}` : ""}`).join("\n")
      : "None yet.";

    return [
      `Help me plan this event and turn my notes into ${goalSentence}.`,
      "",
      "Event context:",
      `- Event: ${eventItem.title || "Untitled event"}`,
      `- Schedule: ${formatEventSchedule(eventItem) || "Not scheduled yet"}`,
      `- Location: ${eventItem.location || "No location yet"}`,
      `- Assigned to: ${eventItem.assignedTo || "No assignee yet"}`,
      `- Reminder: ${eventItem.reminderMinutes || 15} minutes before`,
      `- Event notes: ${eventItem.notes || "None yet"}`,
      "",
      "What I'm thinking:",
      planningNotes || "I will add my planning notes here before sending this to AI.",
      "",
      "Existing photo shots already in the planner:",
      existingShotsText,
      "",
      "Please respond with these sections in Markdown:",
      "1. A short event summary and assumptions you made.",
      goals.includes("todo items")
        ? "2. A todo list with owner suggestions, due timing, and any prep dependencies."
        : "2. Skip todo items unless they are truly needed.",
      goals.includes("shopping or packing lists")
        ? "3. A shopping or packing checklist grouped by section with suggested quantities when obvious."
        : "3. Skip shopping or packing lists unless they are truly needed.",
      goals.includes("photo shot ideas")
        ? "4. Optional photo shot ideas that would fit this event."
        : "4. Skip photo shot ideas unless they are truly needed.",
      "5. Questions I should answer before finalizing the plan.",
      "",
      "Keep the output practical and easy to copy into my planner."
    ].join("\n");
  }

    const goals = Array.from(eventDetailShellEl.querySelectorAll("[data-event-workspace-goal]:checked"))

      .filter(Boolean);

    if (!planningNotesField || !promptOutputField) {
      return;
    }

    setEventAiDraft(eventItem.id, {
      planningNotes: planningNotesField.value,
      goals
    });

    promptOutputField.value = buildEventAiPrompt(eventItem, {

  async function copyEventPromptToClipboard() {
    if (!eventDetailShellEl) {
      return;
    }

    const promptOutputField = eventDetailShellEl.querySelector("[data-event-workspace-output]");
    if (!promptOutputField || !String(promptOutputField.value || "").trim()) {
      setStatus(eventDetailStatusEl, "There is no AI prompt to copy yet.", "error");
      return;
    }

    try {
      await navigator.clipboard.writeText(promptOutputField.value);
      setStatus(eventDetailStatusEl, "AI prompt copied. Paste it into ChatGPT when you're ready.", "success");
    } catch (error) {
      promptOutputField.focus();
      promptOutputField.select();
      setStatus(eventDetailStatusEl, "Clipboard access was blocked. The prompt has been selected so you can copy it manually.", "pending");
    }
  }

  async function generateEventPlanInApp() {
    const eventItem = getEventById(selectedEventDetailId);
    if (!eventItem || !eventDetailShellEl) {
      return;
    }

    const planningNotesField = eventDetailShellEl.querySelector("[data-event-workspace-note]");
    const generateButton = eventDetailShellEl.querySelector("[data-event-workspace-generate]");
    const goals = Array.from(eventDetailShellEl.querySelectorAll("[data-event-workspace-goal]:checked"))
      .map((input) => String(input.value || "").trim())
      .filter(Boolean);
    const planningNotes = String(planningNotesField?.value || "").trim();

    setEventAiDraft(eventItem.id, {
      planningNotes,
      goals
    });

    try {
      requirePlannerAccess();
      if (generateButton) {
        generateButton.disabled = true;
      }
      setStatus(eventDetailStatusEl, "Generating event plan...", "pending");
      const plan = await rpcRequest("generateEventPlan", {
        eventId: String(eventItem.id || "").trim(),
        title: String(eventItem.title || "").trim(),
        date: String(eventItem.date || "").trim(),
        startsAt: String(eventItem.startsAt || "").trim(),
        location: String(eventItem.location || "").trim(),
        assignedTo: String(eventItem.assignedTo || "").trim(),
        reminderMinutes: Number(eventItem.reminderMinutes || 15),
        notes: String(eventItem.notes || "").trim(),
        planningNotes,
        goals,
        existingShots: getShotsForEvent(eventItem.id).map((shot) => ({
          title: String(shot.title || "").trim(),
          description: String(shot.description || "").trim(),
          notes: String(shot.notes || "").trim()
        }))
      });
      eventAiPlans.set(String(eventItem.id || "").trim(), plan);
      renderEventDetail();
      setStatus(eventDetailStatusEl, plan?.error ? `Plan generated with fallback content. ${plan.error}` : "Event plan generated in the app.", plan?.error ? "pending" : "success");
    } catch (error) {
      setStatus(eventDetailStatusEl, error.message || "Unable to generate event plan.", "error");
    } finally {
      if (generateButton) {
        generateButton.disabled = false;
      }
    }
  }

  async function saveBedInlineAssignment(bedId, field, value) {
    const bed = cachedBeds.find((item) => item.id === bedId);
    if (!bed || (field !== "thursday" && field !== "friday")) {
      return;
    }

    setStatus(bedsInlineStatusEl, "Saving bed assignment...", "pending");
    return rpcRequest("saveBed", {
      id: String(bed.id || "").trim(),
      lodging: String(bed.lodging || "").trim(),
      room: String(bed.room || "").trim(),
      bedLabel: String(bed.bedLabel || "").trim(),
      bedType: String(bed.bedType || "").trim(),
      capacity: Number(bed.capacity || 0),
      thursday: field === "thursday" ? String(value || "").trim() : String(bed.thursday || "").trim(),
      friday: field === "friday" ? String(value || "").trim() : String(bed.friday || "").trim(),
      notes: String(bed.notes || "").trim()
    });
  }

  function getBedCellInputClass(value) {
    const normalized = String(value || "").trim();
    if (!normalized) {
      return "bed-table__cell-input bed-table__cell-input--unassigned";
    }
    if (normalized.startsWith("??")) {
      return "bed-table__cell-input bed-table__cell-input--question";
    }
    return "bed-table__cell-input";
  }

  function getBedCellKey(bedId, field) {
    return `${String(bedId || "").trim()}:${String(field || "").trim()}`;
  }

  function applyBedInputAppearance(input) {
    if (!input) return;
    input.className = getBedCellInputClass(input.value);
  }

  function setCachedBedField(bedId, field, value) {
    const bed = cachedBeds.find((item) => item.id === bedId);
    if (!bed || (field !== "thursday" && field !== "friday")) {
      return;
    }
    bed[field] = String(value || "").trim();
  }

  function clearBedSaveTimer(key) {
    const timer = bedSaveTimers.get(key);
    if (timer) {
      window.clearTimeout(timer);
      bedSaveTimers.delete(key);
    }
  }

  async function commitBedInputValue(input, value) {
    if (!input) return;

    const bedId = String(input.dataset.bedId || "").trim();
    const field = String(input.dataset.bedField || "").trim();
    const key = getBedCellKey(bedId, field);
    const nextValue = String(value || "").trim();
    const previousValue = String(input.dataset.bedValue || "").trim();

    if (!bedId || (field !== "thursday" && field !== "friday") || nextValue === previousValue) {
      applyBedInputAppearance(input);
      return;
    }

    const previousChain = bedSaveChains.get(key) || Promise.resolve();
    const nextChain = previousChain.finally(async () => {
      setStatus(bedsInlineStatusEl, "Saving bed assignment...", "");
      setCachedBedField(bedId, field, nextValue);
      applyBedInputAppearance(input);
      const savedBed = await saveBedInlineAssignment(bedId, field, nextValue);
      upsertCachedBed(savedBed, { render: false });
      input.dataset.bedValue = String(savedBed?.[field] || "").trim();
      input.value = String(savedBed?.[field] || "").trim();
      applyBedInputAppearance(input);
      setStatus(bedsInlineStatusEl, "Bed assignments saved.", "success");
    }).catch((error) => {
      setCachedBedField(bedId, field, previousValue);
      input.value = previousValue;
      applyBedInputAppearance(input);
      throw error;
    });

    bedSaveChains.set(key, nextChain.catch(() => {}));
    return nextChain;
  }

  function scheduleBedInputSave(input) {
    if (!input) return;
    applyBedInputAppearance(input);

    const key = getBedCellKey(input.dataset.bedId, input.dataset.bedField);
    clearBedSaveTimer(key);

    const pendingValue = String(input.value || "");
    const timer = window.setTimeout(async () => {
      bedSaveTimers.delete(key);
      try {
        await commitBedInputValue(input, pendingValue);
      } catch (error) {
        setStatus(bedsInlineStatusEl, error.message || "Unable to save bed assignment.", "error");
      }
    }, BED_SAVE_DEBOUNCE_MS);

    bedSaveTimers.set(key, timer);
  }

  async function flushBedInputSave(input) {
    if (!input) return;
    const key = getBedCellKey(input.dataset.bedId, input.dataset.bedField);
    clearBedSaveTimer(key);
    applyBedInputAppearance(input);
    return commitBedInputValue(input, input.value);
  }

  function shouldHideGuestColumn(column) {
    const normalized = String(column || "").trim().toLowerCase();
    return !normalized || normalized === "table number" || normalized === "table order" || normalized === "__rownumber";
  }

  function sanitizeGuestRow(row, columns) {
    const titleColumn = findGuestTitleColumn(columns);
    const title = String(row[titleColumn] || "").trim();

    if (!title || /^total:?$/i.test(title) || /^\d+$/.test(title)) {
      return null;
    }

    const fields = columns
      .filter((column) => column !== titleColumn)
      .filter((column) => !/^description$/i.test(String(column || "").trim()))
      .map((column) => ({
        label: column,
        value: String(row[column] || "").trim()
      }))
      .filter((field) => field.value && field.value !== "-");

    if (!fields.length) {
      const rsvp = getGuestRsvpLabel(row);
      return {
        title,
        type: getGuestType(row),
        rsvp,
        statusTone: getGuestStatusTone(rsvp),
        fields: []
      };
    }

    const rsvp = getGuestRsvpLabel(row);
    return {
      title,
      type: getGuestType(row),
      rsvp,
      statusTone: getGuestStatusTone(rsvp),
      fields
    };
  }

  function getGuestType(row) {
    const match = Object.entries(row).find(([key]) => String(key || "").trim().toLowerCase() === "type");
    return String(match?.[1] || "").trim();
  }

  function getGuestStatusTone(rsvp) {
    return getRsvpGroup(rsvp) === "yes" ? "attending" : "pending";
  }

  function getTypeTokens(value) {
    return String(value || "")
      .split(",")
      .map((token) => token.trim())
      .filter(Boolean);
  }

  function dedupeTokens(tokens) {
    const seen = new Set();
    return (Array.isArray(tokens) ? tokens : [])
      .map((token) => String(token || "").trim())
      .filter(Boolean)
      .filter((token) => {
        const key = token.toLowerCase();
        if (seen.has(key)) {
          return false;
        }
        seen.add(key);
        return true;
      });
  }

  function collectGuestTypes(guests) {
    return Array.from(new Set(
      guests
        .flatMap((guest) => getTypeTokens(guest.type))
    )).sort((a, b) => a.localeCompare(b));
  }

  function renderGuestTypeFilter(types) {
    if (!guestTypeFilterEl) {
      return;
    }

    const normalizedTypes = Array.isArray(types) ? types : [];
    if (selectedGuestType && !normalizedTypes.includes(selectedGuestType)) {
      selectedGuestType = "";
    }

    guestTypeFilterEl.innerHTML = `
      <option value="">All types</option>
      ${normalizedTypes.map((type) => `<option value="${escapeHtml(type)}">${escapeHtml(type)}</option>`).join("")}
    `;
    guestTypeFilterEl.value = selectedGuestType;
    guestTypeFilterEl.disabled = normalizedTypes.length === 0;
  }

  function collectEventDateOptions(events) {
    const normalizedEvents = Array.isArray(events) ? events : [];
    const parsedDates = normalizedEvents
      .filter((event) => !isFalseLike(event?.active))
      .map((event) => ({
        event,
        value: getEventDateFilterValue(event),
        parsed: parseEventDateTime({ date: getEventDateFilterValue(event), startsAt: "00:00" })
      }))
      .filter((item) => item.value && item.parsed);

    if (!parsedDates.length) {
      return [];
    }

    const ceremonyDateValue = parsedDates.find((item) => /ceremony/i.test(String(item.event?.title || "")))?.value || "";
    const mainDateCounts = parsedDates.reduce((counts, item) => {
      if (!isTrueLike(item.event?.main)) {
        return counts;
      }

      counts.set(item.value, (counts.get(item.value) || 0) + 1);
      return counts;
    }, new Map());

    const fallbackDateValue = parsedDates
      .map((item) => item.value)
      .sort((left, right) => right.localeCompare(left))[0];

    const primaryDateValue = ceremonyDateValue
      || [...mainDateCounts.entries()]
        .sort((left, right) => {
          const countDelta = right[1] - left[1];
          if (countDelta !== 0) {
            return countDelta;
          }
          return right[0].localeCompare(left[0]);
        })[0]?.[0]
      || fallbackDateValue;

    const primaryDate = parseEventDateTime({ date: primaryDateValue, startsAt: "00:00" });
    if (!primaryDate) {
      return [];
    }

    const priorCutoff = new Date(primaryDate);
    priorCutoff.setDate(priorCutoff.getDate() - 1);
    const priorCutoffValue = `${priorCutoff.getFullYear()}-${String(priorCutoff.getMonth() + 1).padStart(2, "0")}-${String(priorCutoff.getDate()).padStart(2, "0")}`;

    return [
      { value: primaryDateValue, label: formatEventDateShort(primaryDateValue) },
      { value: `before:${primaryDateValue}`, label: `${formatEventDateShort(priorCutoffValue)} or before` }
    ];
  }

  function collectEventAssignedToOptions(events) {
    return Array.from(new Set(
      (Array.isArray(events) ? events : [])
        .flatMap((event) => getEventAssignedToTokens(event))
        .filter(Boolean)
    )).sort((left, right) => left.localeCompare(right, undefined, { sensitivity: "base" }));
  }

  function renderEventDateFilter(dates) {
    if (!eventDateFilterEl) {
      return;
    }

    const normalizedDates = Array.isArray(dates) ? dates : [];
    if (selectedEventDate && !normalizedDates.some((item) => item.value === selectedEventDate)) {
      selectedEventDate = "";
    }

    eventDateFilterEl.innerHTML = `
      <option value="">All dates</option>
      ${normalizedDates.map((item) => `<option value="${escapeHtml(item.value)}">${escapeHtml(item.label)}</option>`).join("")}
    `;
    eventDateFilterEl.value = selectedEventDate;
    eventDateFilterEl.disabled = normalizedDates.length === 0;
  }

  function renderEventAssignedToFilter(assignees) {
    if (!eventAssignedToFilterEl) {
      return;
    }

    const normalizedAssignees = Array.isArray(assignees) ? assignees : [];
    const assigneeLookup = new Set(normalizedAssignees.map((assignee) => assignee.toLowerCase()));
    selectedEventAssignedTo = selectedEventAssignedTo.filter((assignee) => assigneeLookup.has(String(assignee || "").toLowerCase()));
    updateEventAssignedToFilterSummary();

    if (!normalizedAssignees.length) {
      eventAssignedToFilterEl.innerHTML = '<span class="planner-filter-checklist--empty">All assignees</span>';
      return;
    }

    const selectedLookup = new Set(selectedEventAssignedTo.map((assignee) => String(assignee || "").toLowerCase()));
    eventAssignedToFilterEl.innerHTML = normalizedAssignees.map((assignedTo) => `
      <label class="planner-filter-checklist__option">
        <input type="checkbox" value="${escapeHtml(assignedTo)}" data-event-assigned-to-filter ${selectedLookup.has(assignedTo.toLowerCase()) ? "checked" : ""}>
        <span>${escapeHtml(assignedTo)}</span>
      </label>
    `).join("");
  }

  function updateEventAssignedToFilterSummary() {
    if (!eventAssignedToFilterSummaryEl) {
      return;
    }

    if (!selectedEventAssignedTo.length) {
      eventAssignedToFilterSummaryEl.textContent = "All assignees";
      eventAssignedToFilterSummaryEl.title = "All assignees";
      return;
    }

    const summaryText = selectedEventAssignedTo.length <= 2
      ? selectedEventAssignedTo.join(", ")
      : `${selectedEventAssignedTo.length} selected`;
    eventAssignedToFilterSummaryEl.textContent = summaryText;
    eventAssignedToFilterSummaryEl.title = selectedEventAssignedTo.join(", ");
  }

  function getGuestTypeOptions() {
    return collectGuestTypes(
      cachedGuests
        .map((row) => ({ type: getGuestTypeValue(row) }))
        .filter((item) => item.type)
    );
  }

  function collectEventAssignedToFormValue() {
    if (!eventForm) {
      return "";
    }

    const formData = new FormData(eventForm);
    const selectedTypes = formData.getAll("assignedToType");
    const extraTypes = getTypeTokens(formData.get("assignedToExtra"));
    return dedupeTokens([...selectedTypes, ...extraTypes]).join(", ");
  }

  function renderEventAssignedTypeOptions(selectedAssignedTo = "") {
    if (!eventAssignedTypeOptionsEl || !eventForm) {
      return;
    }

    const types = getGuestTypeOptions();
    const selectedTokens = getTypeTokens(selectedAssignedTo);
    const selectedLookup = new Set(selectedTokens.map((token) => token.toLowerCase()));
    const typeLookup = new Set(types.map((type) => type.toLowerCase()));
    const extraField = eventForm.elements.namedItem("assignedToExtra");
    const extraTypes = selectedTokens.filter((token) => !typeLookup.has(token.toLowerCase()));

    if (extraField) {
      extraField.value = extraTypes.join(", ");
    }

    if (!types.length) {
      eventAssignedTypeOptionsEl.innerHTML = '<p class="meta">No guest types loaded yet.</p>';
      return;
    }

    eventAssignedTypeOptionsEl.innerHTML = types.map((type) => `
      <label class="type-option">
        <input type="checkbox" name="assignedToType" value="${escapeHtml(type)}" ${selectedLookup.has(type.toLowerCase()) ? "checked" : ""}>
        <span>${escapeHtml(type)}</span>
      </label>
    `).join("");
  }

  function getFilteredEvents() {
    return cachedEvents.filter((event) => {
      if (selectedEventDate) {
        const eventDateValue = getEventDateFilterValue(event);
        if (selectedEventDate.startsWith("before:")) {
          const cutoff = selectedEventDate.slice("before:".length);
          if (!eventDateValue) {
            return true;
          }
          if (eventDateValue >= cutoff) {
            return false;
          }
        } else if (eventDateValue !== selectedEventDate) {
          return false;
        }
      }

      if (selectedEventAssignedTo.length) {
        const eventAssignees = new Set(getEventAssignedToTokens(event).map((token) => token.toLowerCase()));
        if (!selectedEventAssignedTo.some((assignee) => eventAssignees.has(String(assignee || "").toLowerCase()))) {
          return false;
        }
      }

      return true;
    });
  }

  function renderTableTypeOptions() {
    if (!tableTypeOptionsEl) {
      return;
    }

    const types = getGuestTypeOptions();

    if (!types.length) {
      tableTypeOptionsEl.innerHTML = '<p class="meta">No guest types loaded yet.</p>';
      return;
    }

    tableTypeOptionsEl.innerHTML = types.map((type) => `
      <label class="type-option">
        <input type="checkbox" name="type" value="${escapeHtml(type)}">
        <span>${escapeHtml(type)}</span>
      </label>
    `).join("");
  }

  function findGuestTitleColumn(columns) {
    return columns.find((column) => /name/i.test(column)) || columns[0] || "Guest";
  }

  function findGuestColumn(row, matcher) {
    return Object.keys(row).find((column) => matcher.test(String(column || "").trim()));
  }

  function getGuestDisplayName(row) {
    const nameColumn = findGuestColumn(row, /name/i);
    return String(nameColumn ? row[nameColumn] || "" : "").trim();
  }

  function getGuestRowNumber(row) {
    const raw = row.__rowNumber;
    const parsed = Number(raw || 0);
    return Number.isInteger(parsed) && parsed > 1 ? parsed : 0;
  }

  function getGuestTypeValue(row) {
    const typeColumn = findGuestColumn(row, /^type$/i);
    return String(typeColumn ? row[typeColumn] || "" : "").trim();
  }

  function findTableColumn(table, matcher) {
    return Object.keys(table || {}).find((column) => matcher.test(String(column || "").trim()));
  }

  function getTableColumnValue(table, matcher) {
    const column = findTableColumn(table, matcher);
    return String(column ? table[column] || "" : "").trim();
  }

  function isTableLayoutSideToken(value) {
    const normalized = String(value || "").trim().toLowerCase();
    return normalized.includes("bar")
      || normalized.includes("food")
      || normalized.includes("head")
      || normalized.includes("center");
  }

  function getTableTypes(table) {
    return getTypeTokens(String(table?.type || "").trim());
  }

  function tableAcceptsAnyGuest(table) {
    return getTableTypes(table).length === 0;
  }

  function getTableGuestTypeValue(table) {
    const typeValue = String(table?.type || "").trim();
    return isTableLayoutSideToken(typeValue) ? "" : typeValue;
  }

  function getTableLayoutSideValue(table) {
    const raw = String(
      table?.location
      || getTableColumnValue(table, /^location$/i)
      || (isTableLayoutSideToken(table?.type) ? table?.type : "")
      || ""
    ).trim().toLowerCase();
    if (!raw) {
      return "head";
    }
    if (raw.includes("bar")) {
      return "bar";
    }
    if (raw.includes("food")) {
      return "food";
    }
    if (raw.includes("head") || raw.includes("center")) {
      return "head";
    }
    return "head";
  }

  function getTableLayoutOrder(table) {
    const raw = String(table?.order || getTableColumnValue(table, /^order$/i) || "").trim();
    const parsed = Number(raw);
    return Number.isFinite(parsed) && parsed > 0 ? parsed : Infinity;
  }

  function getTableLayoutLabel(table) {
    return String(
      table?.location
      || getTableColumnValue(table, /^location$/i)
      || (isTableLayoutSideToken(table?.type) ? table?.type : "")
      || "Center"
    ).trim() || "Center";
  }

  function sortTablesForLayout(items) {
    return [...items].sort((left, right) => {
      const orderDelta = getTableLayoutOrder(left) - getTableLayoutOrder(right);
      if (orderDelta !== 0) {
        return orderDelta;
      }
      return compareTableNumbers(String(left.tableName || ""), String(right.tableName || ""));
    });
  }

  function groupTablesForLayout(items) {
    const groups = [
      { key: "head", label: "Head", tables: [] },
      { key: "food", label: "Food Side", tables: [] },
      { key: "bar", label: "Bar Side", tables: [] }
    ];
    const groupMap = new Map(groups.map((group) => [group.key, group]));

    items.forEach((table) => {
      const side = getTableLayoutSideValue(table);
      const targetGroup = groupMap.get(side) || groupMap.get("head");
      targetGroup.tables.push(table);
    });

    groups.forEach((group) => {
      group.tables = sortTablesForLayout(group.tables);
    });

    return groups;
  }

  function getGuestTableNumber(row) {
    const tableColumn = findGuestColumn(row, /^table\s*(number|#)?$/i);
    return String(tableColumn ? row[tableColumn] || "" : "").trim();
  }

  function getGuestTableOrder(row) {
    const orderColumn = findGuestColumn(row, /^table\s*order$/i);
    const raw = String(orderColumn ? row[orderColumn] || "" : "").trim();
    const parsed = Number(raw);
    return Number.isFinite(parsed) && parsed > 0 ? parsed : 0;
  }

  function getGuestRsvpLabel(row) {
    const rsvpColumn = findGuestColumn(row, /^rsvp$/i);
    return String(rsvpColumn ? row[rsvpColumn] || "" : "").trim();
  }

  function getGuestPlusOneRsvp(row) {
    const plusOneColumn = findGuestColumn(row, /plus\s*1.*rsvp|rsvp.*plus\s*1|plus\s*one.*rsvp/i);
    return String(plusOneColumn ? row[plusOneColumn] || "" : "").trim();
  }

  function getDashboardRsvps() {
    if (cachedGuests.length) {
      return cachedGuests
        .map((row) => ({
          name: getGuestDisplayName(row),
          attending: getGuestRsvpLabel(row),
          plusOneRsvp: getGuestPlusOneRsvp(row),
          tableNumber: getGuestTableNumber(row),
          type: getGuestTypeValue(row),
          submittedAt: "",
          email: "",
          guests: "",
          comment: ""
        }))
        .filter((item) => item.name && item.attending);
    }

    return cachedRsvps;
  }

  function compareTableNumbers(left, right) {
    const leftNumber = Number.parseFloat(String(left).replace(/[^\d.]/g, ""));
    const rightNumber = Number.parseFloat(String(right).replace(/[^\d.]/g, ""));

    if (!Number.isNaN(leftNumber) && !Number.isNaN(rightNumber) && leftNumber !== rightNumber) {
      return leftNumber - rightNumber;
    }

    return String(left).localeCompare(String(right), undefined, { numeric: true, sensitivity: "base" });
  }

  function renderSummary() {
    const dashboardRsvps = getDashboardRsvps();
    const yesCount = dashboardRsvps.filter((item) => getRsvpGroup(item.attending) === "yes").length;
    const noCount = dashboardRsvps.filter((item) => getRsvpGroup(item.attending) === "no").length;
    const maybeCount = dashboardRsvps.filter((item) => getRsvpGroup(item.attending) === "maybe").length;
    const completedTodoCount = cachedTodos.filter((item) => item.isComplete).length;
    const nextMainEvent = getNextMainEvent();
    const nextMainEventDate = parseEventDateTime(nextMainEvent);
    const nextMainEventTitle = nextMainEvent?.title ? escapeHtml(nextMainEvent.title) : "No main event scheduled yet";
    const nextMainEventSchedule = nextMainEvent ? escapeHtml(formatEventSchedule(nextMainEvent) || "Date and time still need to be added.") : "Add a timeline item and mark it as the main event.";
    const nextMainEventLocation = nextMainEvent ? escapeHtml(nextMainEvent.location || "No location added yet.") : "Add your ceremony or reception in the Timeline tab to populate this card.";
    const countdownMarkup = nextMainEventDate ? `
      <div class="planner-countdown" data-planner-countdown>
        <div class="planner-countdown__item">
          <strong data-countdown-days>0</strong>
          <span>Days</span>
        </div>
        <div class="planner-countdown__item">
          <strong data-countdown-hours>00</strong>
          <span>Hours</span>
        </div>
        <div class="planner-countdown__item">
          <strong data-countdown-minutes>00</strong>
          <span>Minutes</span>
        </div>
        <div class="planner-countdown__item">
          <strong data-countdown-seconds>00</strong>
          <span>Seconds</span>
        </div>
      </div>
      <p class="planner-home-card__summary" data-countdown-summary>Loading countdown...</p>
    ` : `
      <p class="planner-home-card__summary">No dated main event yet. Add one in Timeline to start the countdown.</p>
    `;

    plannerSummaryEl.innerHTML = `
      <article class="planner-home-card planner-home-card--countdown">
        <span class="planner-home-card__label">Countdown</span>
        <h3>${nextMainEvent ? "Time until the next main event" : "Countdown will appear here"}</h3>
        ${countdownMarkup}
      </article>
      <article class="planner-home-card planner-home-card--next-event">
        <span class="planner-home-card__label">Next Main Event</span>
        <h3>${nextMainEventTitle}</h3>
        <p class="planner-home-card__meta">${nextMainEventSchedule}</p>
        <p class="planner-home-card__summary">${nextMainEventLocation}</p>
      </article>
      <article class="summary-card">
        <span>RSVPs</span>
        <strong>${dashboardRsvps.length}</strong>
      </article>
      <article class="summary-card">
        <span>Attending</span>
        <strong>${yesCount}</strong>
      </article>
      <article class="summary-card">
        <span>People</span>
        <strong>${cachedPeople.length}</strong>
      </article>
      <article class="summary-card">
        <span>Guests Sheet</span>
        <strong>${cachedGuests.length}</strong>
      </article>
      <article class="summary-card">
        <span>Tables</span>
        <strong>${cachedTables.length}</strong>
      </article>
      <article class="summary-card">
        <span>Events</span>
        <strong>${cachedEvents.length}</strong>
      </article>
      <article class="summary-card">
        <span>Shots</span>
        <strong>${cachedShots.length}</strong>
      </article>
      <article class="summary-card">
        <span>Todo</span>
        <strong>${cachedTodos.length}</strong>
      </article>
      <article class="summary-card">
        <span>Beds</span>
        <strong>${cachedBeds.length}</strong>
      </article>
      <article class="summary-card">
        <span>Done Tasks</span>
        <strong>${completedTodoCount}</strong>
      </article>
      <article class="summary-card">
        <span>Captured Shots</span>
        <strong>${cachedShots.filter((item) => item.isComplete).length}</strong>
      </article>
      <article class="summary-card">
        <span>Maybe / No</span>
        <strong>${maybeCount + noCount}</strong>
      </article>
    `;

    startPlannerCountdown(nextMainEventDate, nextMainEvent?.title || "the next main event");
  }

  function sortByUpdated(items, key) {
    return [...items].sort((left, right) => String(right[key] || "").localeCompare(String(left[key] || "")));
  }

  function sortEvents(items) {
    return [...items].sort((left, right) => {
      const leftDate = parseEventDateTime(left);
      const rightDate = parseEventDateTime(right);
      if (leftDate && rightDate) {
        const datedComparison = leftDate.getTime() - rightDate.getTime();
        if (datedComparison !== 0) {
          return datedComparison;
        }
      } else {
        const leftStamp = `${left.date || ""}T${left.startsAt || ""}`;
        const rightStamp = `${right.date || ""}T${right.startsAt || ""}`;
        const datedComparison = leftStamp.localeCompare(rightStamp);
        if (datedComparison !== 0) {
          return datedComparison;
        }
      }
      return String(left.title || "").localeCompare(String(right.title || ""));
    });
  }

  function sortTodos(items) {
    return [...items].sort((left, right) => {
      const completeDelta = Number(Boolean(left.isComplete)) - Number(Boolean(right.isComplete));
      if (completeDelta !== 0) {
        return completeDelta;
      }

      const dueDelta = String(left.dueDate || "").localeCompare(String(right.dueDate || ""));
      if (dueDelta !== 0) {
        return dueDelta;
      }

      return String(left.title || "").localeCompare(String(right.title || ""));
    });
  }

  function sortShots(items) {
    const eventOrder = new Map(cachedEvents.map((event, index) => [String(event.id || "").trim(), index]));
    return [...items].sort((left, right) => {
      const leftComplete = Number(Boolean(left.isComplete));
      const rightComplete = Number(Boolean(right.isComplete));
      if (leftComplete !== rightComplete) {
        return leftComplete - rightComplete;
      }

      const leftEventOrder = eventOrder.has(String(left.eventId || "").trim())
        ? eventOrder.get(String(left.eventId || "").trim())
        : Number.MAX_SAFE_INTEGER;
      const rightEventOrder = eventOrder.has(String(right.eventId || "").trim())
        ? eventOrder.get(String(right.eventId || "").trim())
        : Number.MAX_SAFE_INTEGER;
      if (leftEventOrder !== rightEventOrder) {
        return leftEventOrder - rightEventOrder;
      }

      const orderDelta = Number(left.sortOrder || 0) - Number(right.sortOrder || 0);
      if (orderDelta !== 0) {
        return orderDelta;
      }

      const priorityDelta = getShotPriorityRank(left.priority) - getShotPriorityRank(right.priority);
      if (priorityDelta !== 0) {
        return priorityDelta;
      }

      return String(left.title || "").localeCompare(String(right.title || ""));
    });
  }

  function renderPlannerData() {
    renderPeople();
    renderEvents();
    renderShots();
    renderTodos();
    renderBedsTable();
    renderRsvps();
    renderGuests();
    renderTables();
    renderTableTypeOptions();
    renderEventAssignedTypeOptions(collectEventAssignedToFormValue());
    renderSummary();
  }

  function getRpcUrl() {
    const scriptBaseUrl = String(window.PLANNER_CTX.scriptBaseUrl || "").trim();
    if (scriptBaseUrl && !scriptBaseUrl.startsWith("<?")) {
      return scriptBaseUrl;
    }
    return String(window.PLANNER_CTX.rsvpFeedUrl || "").trim();
  }

  async function rpcRequest(method, payload) {
    const rpcUrl = getRpcUrl();
    const passwordHash = String(window.sessionStorage.getItem(STORAGE_KEYS.authHash) || "").trim();

    if (!rpcUrl) {
      throw new Error("Planner backend URL is not configured yet.");
    }

    const response = await fetch(rpcUrl, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        method,
        payload,
        passwordHash
      })
    });

    const result = await response.json();
    if (!result?.ok) {
      if (passwordHash && /Please sign in first\./i.test(String(result?.error || ""))) {
        throw new Error("Planner backend password mismatch. This dashboard page unlocked, but the Apps Script deployment is using a different DASHBOARD_PASSWORD_HASH.");
      }
      throw new Error(result?.error || "Planner request failed.");
    }

    return result.data;
  }

  async function refreshPlannerCollections() {
    const [people, events, shots, beds, todos, tables] = await Promise.all([
      rpcRequest("listPeople", {}),
      rpcRequest("listEvents", {}),
      rpcRequest("listShots", {}).catch((error) => {
        const message = String(error?.message || "");
        if (/Unknown RPC method:\s*listShots/i.test(message)) {
          setStatus(shotStatusEl, "Shot List is hidden until the latest planner backend is deployed.", "pending");
          return [];
        }
        throw error;
      }),
      rpcRequest("listBeds", {}),
      rpcRequest("listTodos", {}),
      rpcRequest("listTables", {})
    ]);

    cachedPeople = sortByUpdated(Array.isArray(people) ? people : [], "updatedAt");
    cachedEvents = sortEvents(Array.isArray(events) ? events : []);
    cachedShots = sortShots(Array.isArray(shots) ? shots : []);
    cachedBeds = sortBeds(Array.isArray(beds) ? beds : []);
    cachedTodos = sortTodos(Array.isArray(todos) ? todos : []);
    cachedTables = sortTables(Array.isArray(tables) ? tables : []);
    renderPlannerData();
  }

  function refreshViewer() {
    const signedIn = window.sessionStorage.getItem(STORAGE_KEYS.auth) === "true";
    viewerProfile = {
      signedIn,
      email: "Dashboard session",
      isAdmin: signedIn
    };
    renderRoute();
    return viewerProfile.isAdmin;
  }

  async function maybeLoadPlannerData() {
    if (currentView !== "planner" || !viewerProfile.isAdmin) {
      plannerContentEl.hidden = currentView !== "planner" || !viewerProfile.isAdmin;
      return;
    }

    try {

      setStatus(plannerSyncStatusEl, "Planner data synced from Google Sheets.", "success");
    } catch (error) {

      cachedEvents = [];
      cachedShots = [];
      cachedBeds = [];
      cachedTables = [];
      cachedTodos = [];
      renderPlannerData();
      setStatus(plannerSyncStatusEl, error.message || "Unable to load planner data.", "error");
    }
    await refreshRsvps();
    plannerContentEl.hidden = false;
  }

  async function hashPassword(password) {
    const normalized = String(password || "");
    const cryptoApi = window.crypto || window.msCrypto;

    if (cryptoApi && cryptoApi.subtle && typeof cryptoApi.subtle.digest === "function" && typeof TextEncoder !== "undefined") {
      const bytes = new TextEncoder().encode(normalized);
      const digest = await cryptoApi.subtle.digest("SHA-256", bytes);
      return Array.from(new Uint8Array(digest)).map((value) => value.toString(16).padStart(2, "0")).join("");
    }

    return sha256Fallback(normalized);
  }

  function sha256Fallback(input) {
    const words = [];
    const ascii = unescape(encodeURIComponent(String(input || "")));
    const bitLength = ascii.length * 8;
    const hash = [
      0x6a09e667,
      0xbb67ae85,
      0x3c6ef372,
      0xa54ff53a,
      0x510e527f,
      0x9b05688c,
      0x1f83d9ab,
      0x5be0cd19
    ];
    const roundConstants = [
      0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5,
      0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
      0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3,
      0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
      0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc,
      0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
      0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7,
      0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
      0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13,
      0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
      0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3,
      0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
      0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5,
      0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
      0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208,
      0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
    ];

    for (let index = 0; index < ascii.length; index += 1) {
      words[index >> 2] |= ascii.charCodeAt(index) << (24 - (index % 4) * 8);
    }

    words[bitLength >> 5] |= 0x80 << (24 - bitLength % 32);
    words[(((bitLength + 64) >> 9) << 4) + 15] = bitLength;

    for (let offset = 0; offset < words.length; offset += 16) {
      const schedule = new Array(64);

      for (let index = 0; index < 16; index += 1) {
        schedule[index] = words[offset + index] | 0;
      }

      for (let index = 16; index < 64; index += 1) {
        const gamma0x = schedule[index - 15];
        const gamma1x = schedule[index - 2];
        const gamma0 = rightRotate(gamma0x, 7) ^ rightRotate(gamma0x, 18) ^ (gamma0x >>> 3);
        const gamma1 = rightRotate(gamma1x, 17) ^ rightRotate(gamma1x, 19) ^ (gamma1x >>> 10);
        schedule[index] = add32(schedule[index - 16], gamma0, schedule[index - 7], gamma1);
      }

      let a = hash[0];
      let b = hash[1];
      let c = hash[2];
      let d = hash[3];
      let e = hash[4];
      let f = hash[5];
      let g = hash[6];
      let h = hash[7];

      for (let index = 0; index < 64; index += 1) {
        const sigma1 = rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25);
        const choice = (e & f) ^ (~e & g);
        const temp1 = add32(h, sigma1, choice, roundConstants[index], schedule[index]);
        const sigma0 = rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22);
        const majority = (a & b) ^ (a & c) ^ (b & c);
        const temp2 = add32(sigma0, majority);

        h = g;
        g = f;
        f = e;
        e = add32(d, temp1);
        d = c;
        c = b;
        b = a;
        a = add32(temp1, temp2);
      }

      hash[0] = add32(hash[0], a);
      hash[1] = add32(hash[1], b);
      hash[2] = add32(hash[2], c);
      hash[3] = add32(hash[3], d);
      hash[4] = add32(hash[4], e);
      hash[5] = add32(hash[5], f);
      hash[6] = add32(hash[6], g);
      hash[7] = add32(hash[7], h);
    }

    return hash.map((value) => (value >>> 0).toString(16).padStart(8, "0")).join("");
  }

  function rightRotate(value, amount) {
    return (value >>> amount) | (value << (32 - amount));
  }

  function add32() {
    let total = 0;
    for (let index = 0; index < arguments.length; index += 1) {
      total = (total + (arguments[index] | 0)) | 0;
    }
    return total;
  }

  async function unlockDashboard(password) {
    const expectedHash = String(window.PLANNER_CTX.dashboardPasswordHash || "").trim().toLowerCase();
    if (!expectedHash) {
      throw new Error("Dashboard password is not configured yet.");
    }

    const actualHash = await hashPassword(password.trim());
    if (actualHash !== expectedHash) {
      throw new Error("That password did not match.");
    }

    window.sessionStorage.setItem(STORAGE_KEYS.auth, "true");
    window.sessionStorage.setItem(STORAGE_KEYS.authHash, actualHash);
    refreshViewer();
    await maybeLoadPlannerData();
  }

  function requirePlannerAccess() {
    if (!viewerProfile.isAdmin) {
      throw new Error("Unlock the dashboard first.");
    }
  }

  async function fetchJsonp(url) {
    return new Promise((resolve, reject) => {
      const callbackName = `plannerFeed${Date.now()}${Math.random().toString(36).slice(2, 8)}`;
      const script = document.createElement("script");
      const separator = url.includes("?") ? "&" : "?";

      const cleanup = () => {
        delete window[callbackName];
        script.remove();
      };

      window[callbackName] = (payload) => {
        cleanup();
        resolve(payload);
      };

      script.onerror = () => {
        cleanup();
        reject(new Error("Unable to load the RSVP feed."));
      };

      script.src = `${url}${separator}callback=${callbackName}`;
      document.body.appendChild(script);
    });
  }

  function normalizeRsvps(payload) {
    const items = Array.isArray(payload?.responses) ? payload.responses : [];
    return items.map((item) => ({
      submittedAt: String(item.submittedAt || ""),
      name: String(item.name || ""),
      email: String(item.email || ""),
      attending: String(item.attending || ""),
      guests: String(item.guests || ""),
      comment: String(item.comment || "")
    }));
  }

  function normalizeGuests(payload) {
    const items = Array.isArray(payload?.guests) ? payload.guests : [];
    return items
      .map((item) => {
        if (!item || typeof item !== "object" || Array.isArray(item)) {
          return null;
        }

        return Object.fromEntries(
          Object.entries(item).map(([key, value]) => [String(key || "").trim(), String(value || "")])
        );
      })
      .filter((item) => item && Object.keys(item).length);
  }

function sortTables(items) {
  return [...items].sort((left, right) => {
    const locationDelta = String(left.location || "").localeCompare(String(right.location || ""), undefined, { sensitivity: "base" });
    if (locationDelta !== 0) {
      return locationDelta;
    }

    const orderDelta = Number(left.order || 0) - Number(right.order || 0);
    if (orderDelta !== 0) {
      return orderDelta;
    }

    const nameDelta = String(left.tableName || "").localeCompare(String(right.tableName || ""), undefined, { numeric: true, sensitivity: "base" });
    if (nameDelta !== 0) {
      return nameDelta;
    }

      return String(left.type || "").localeCompare(String(right.type || ""), undefined, { sensitivity: "base" });
    });
  }

  function getAssignedGuestByTableName(tableName) {
    return cachedGuests
      .filter((row) => getGuestTableNumber(row) === tableName)
      .map((row) => ({
        rowNumber: getGuestRowNumber(row),
        name: getGuestDisplayName(row),
        type: getGuestTypeValue(row),
        attending: getGuestRsvpLabel(row),
        plusOneRsvp: getGuestPlusOneRsvp(row),
        tableNumber: getGuestTableNumber(row),
        tableOrder: getGuestTableOrder(row)
      }))
      .filter((guest) => guest.rowNumber && guest.name)
      .sort((left, right) => {
        const orderDelta = Number(left.tableOrder || 0) - Number(right.tableOrder || 0);
        if (orderDelta !== 0) {
          return orderDelta;
        }
        return left.name.localeCompare(right.name);
      });
  }

  function getTableByName(tableName) {
    const targetName = String(tableName || "").trim();
    return cachedTables.find((table) => String(table.tableName || "").trim() === targetName) || null;
  }

  function updateCachedTableReservedOpenSeats(tableId, reservedSeats) {
    const table = getTableById(tableId);
    if (!table) {
      return null;
    }

    const normalizedReservedSeats = [...new Set((Array.isArray(reservedSeats) ? reservedSeats : [])
      .map((seatNumber) => Number(seatNumber || 0))
      .filter((seatNumber) => Number.isInteger(seatNumber) && seatNumber > 0))]
      .sort((left, right) => left - right);

    const updatedTable = {
      ...table,
      reservedOpenSeatPositions: normalizedReservedSeats.join(", "),
      updatedAt: new Date().toISOString()
    };
    upsertCachedTable(updatedTable);
    return updatedTable;
  }

  async function toggleReservedOpenSeat(tableId, seatNumber) {
    const table = getTableById(tableId);
    if (!table) {
      throw new Error("Table not found.");
    }

    const numericSeatNumber = Number(seatNumber || 0);
    if (!Number.isInteger(numericSeatNumber) || numericSeatNumber < 1 || numericSeatNumber > Number(table.count || 0)) {
      throw new Error("That seat cannot be reserved.");
    }

    const currentReservedSeats = getReservedOpenSeatPositions(table);
    const nextReservedSeats = currentReservedSeats.includes(numericSeatNumber)
      ? currentReservedSeats.filter((item) => item !== numericSeatNumber)
      : [...currentReservedSeats, numericSeatNumber].sort((left, right) => left - right);

    const previousTables = cachedTables;
    updateCachedTableReservedOpenSeats(tableId, nextReservedSeats);

    try {
      const savedTable = await rpcRequest("saveTableReservedOpenSeats", {
        id: tableId,
        reservedOpenSeatPositions: nextReservedSeats
      });
      upsertCachedTable(savedTable);
      setStatus(tableStatusEl, currentReservedSeats.includes(numericSeatNumber) ? "Reserved open spot removed." : "Reserved open spot saved.", "success");
    } catch (error) {
      cachedTables = previousTables;
      rerenderTableData();
      throw error;
    }
  }

  async function clearReservedOpenSeatIfNeeded(tableId, seatNumber) {
    const table = getTableById(tableId);
    const numericSeatNumber = Number(seatNumber || 0);
    if (!table || !numericSeatNumber) {
      return;
    }

    const currentReservedSeats = getReservedOpenSeatPositions(table);
    if (!currentReservedSeats.includes(numericSeatNumber)) {
      return;
    }

    const nextReservedSeats = currentReservedSeats.filter((item) => item !== numericSeatNumber);
    const savedTable = await rpcRequest("saveTableReservedOpenSeats", {
      id: tableId,
      reservedOpenSeatPositions: nextReservedSeats
    });
    upsertCachedTable(savedTable);
  }

  function canGuestSitAtTable(guest, table) {
    if (!guest || !table) {
      return false;
    }

    if (getRsvpGroup(guest.attending) !== "yes") {
      return false;
    }

    if (tableAcceptsAnyGuest(table)) {
      return true;
    }

    const guestTypes = getTypeTokens(guest.type);
    const tableTypes = getTableTypes(table);
    return guestTypes.some((type) => tableTypes.includes(type));
  }

  function getAvailableSeatCount(tableName, ignoreRowNumber = 0) {
    const table = getTableByName(tableName);
    if (!table) {
      return 0;
    }

    const assignedCount = getAssignedGuestByTableName(tableName)
      .filter((guest) => Number(guest.rowNumber || 0) !== Number(ignoreRowNumber || 0))
      .length;
    return Math.max(0, Number(table.count || 0) - assignedCount);
  }

  function getRenderableSeatCountForTable(table, assignedGuests = []) {
    const configuredSeatCount = Math.max(0, Number(table?.count || 0));
    const maxAssignedSeat = assignedGuests.reduce((maxSeat, guest) => Math.max(maxSeat, Number(guest.tableOrder || 0)), 0);
    return Math.max(configuredSeatCount, maxAssignedSeat);
  }

  function getReservedOpenSeatPositions(table) {
    const seen = new Set();
    return String(table?.reservedOpenSeatPositions || "")
      .split(",")
      .map((token) => Number(String(token || "").trim()))
      .filter((seatNumber) => Number.isInteger(seatNumber) && seatNumber > 0)
      .filter((seatNumber) => {
        if (seen.has(seatNumber)) {
          return false;
        }
        seen.add(seatNumber);
        return true;
      })
      .sort((left, right) => left - right);
  }

  function isReservedOpenSeat(table, seatNumber) {
    return getReservedOpenSeatPositions(table).includes(Number(seatNumber || 0));
  }

  function findFirstOpenSeat(tableName) {
    const table = getTableByName(tableName);
    const seatCount = Math.max(0, Number(table?.count || 0));
    const reservedSeats = new Set(getReservedOpenSeatPositions(table));
    const usedSeats = new Set(
      getAssignedGuestByTableName(tableName)
        .map((guest) => Number(guest.tableOrder || 0))
        .filter((seatNumber) => seatNumber > 0)
    );
    for (let seatNumber = 1; seatNumber <= seatCount; seatNumber += 1) {
      if (!usedSeats.has(seatNumber) && !reservedSeats.has(seatNumber)) {
        return seatNumber;
      }
    }
    return 0;
  }

  function renderTableSeatGrid(table, assignedGuests, seatCount) {
    const tableName = String(table.tableName || "").trim();
    if (!seatCount) {
      return '<p class="meta">Set a seat count to start placing guests.</p>';
    }

    const assignedBySeat = new Map(
      assignedGuests
        .map((guest) => [Number(guest.tableOrder || 0), guest])
        .filter(([seatNumber]) => seatNumber > 0)
    );

    return Array.from({ length: seatCount }, (_, index) => {
      const seatNumber = index + 1;
      return renderTableSeat(table, seatNumber, assignedBySeat.get(seatNumber) || null);
    }).join("");
  }

  function renderTableSeat(table, seatNumber, guest = null) {
    const tableName = String(table?.tableName || "").trim();
    const tableId = String(table?.id || "").trim();
    const reserved = !guest && isReservedOpenSeat(table, seatNumber);
    const dropLabel = guest
      ? `Move guest to seat ${seatNumber} at ${tableName}`
      : `Place guest in open seat ${seatNumber} at ${tableName}`;
    const isDragSource = guest && activeTableDrag && Number(activeTableDrag.rowNumber || 0) === Number(guest.rowNumber || 0);
    return `
      <div class="table-seat ${guest ? "table-seat--occupied" : "table-seat--empty"} ${reserved ? "table-seat--reserved" : ""} ${isDragSource ? "is-drag-source" : ""}" data-table-dropzone data-table-id="${escapeHtml(tableId)}" data-table-name="${escapeHtml(tableName)}" data-drop-seat="${escapeHtml(String(seatNumber))}" data-drop-enabled="false" role="button" tabindex="0" aria-label="${escapeHtml(dropLabel)}" aria-disabled="true">
        ${guest ? activeTableDrag ? `<span class="table-seat__hint" aria-hidden="true">Drop here</span>` : "" : `<span class="table-seat__hint" aria-hidden="true">${reserved ? "Reserved spot" : "Open spot"}</span>`}
        ${guest ? `
          <div class="dashboard-entry" data-assigned-guest data-row-number="${escapeHtml(String(guest.rowNumber || ""))}" data-table-name="${escapeHtml(tableName)}">
            <div class="table-assignment-row">
              <div class="table-assignment-row__meta">
                <button class="button button--light table-drag-handle" type="button" draggable="true" data-table-guest-handle data-row-number="${escapeHtml(String(guest.rowNumber || ""))}" aria-label="Move ${escapeHtml(guest.name)}">
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M9 6h.01"></path>
                    <path d="M9 12h.01"></path>
                    <path d="M9 18h.01"></path>
                    <path d="M15 6h.01"></path>
                    <path d="M15 12h.01"></path>
                    <path d="M15 18h.01"></path>
                  </svg>
                </button>
                <strong>${escapeHtml(guest.name)}</strong>
              </div>
              <div class="table-assignment-row__actions">
                <button class="button button--light table-remove-button" type="button" data-remove-table-guest data-row-number="${escapeHtml(String(guest.rowNumber || ""))}" data-table-name="${escapeHtml(tableName)}" aria-label="Remove ${escapeHtml(guest.name)} from ${escapeHtml(tableName || "table")}">
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M3 6h18"></path>
                    <path d="M8 6V4h8v2"></path>
                    <path d="M19 6l-1 14H6L5 6"></path>
                    <path d="M10 11v6"></path>
                    <path d="M14 11v6"></path>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        ` : `
          <div class="table-seat__empty">
            <strong>${reserved ? "Reserved open spot" : "Open spot"}</strong>
            <span>${reserved ? "This seat is intentionally being kept open." : "Keep this seat available for a couple or late assignment."}</span>
            <button class="button button--light table-seat__toggle" type="button" data-toggle-reserved-seat data-table-id="${escapeHtml(tableId)}" data-seat-number="${escapeHtml(String(seatNumber))}">
              ${reserved ? "Unreserve" : "Reserve"}
            </button>
          </div>
        `}
      </div>
    `;
  }

  function getEligibleGuestsForTable(table) {
    return cachedGuests
      .map((row) => ({
        rowNumber: getGuestRowNumber(row),
        name: getGuestDisplayName(row),
        type: getGuestTypeValue(row),
        attending: getGuestRsvpLabel(row),
        plusOneRsvp: getGuestPlusOneRsvp(row),
        tableNumber: getGuestTableNumber(row)
      }))
      .filter((guest) => guest.rowNumber && guest.name)
      .filter((guest) => canGuestSitAtTable(guest, table))
      .filter((guest) => getRsvpGroup(guest.attending) === "yes")
      .filter((guest) => !guest.tableNumber)
      .sort((left, right) => left.name.localeCompare(right.name));
  }

  async function addGuestToTable(table, guestRowNumber) {
    const tableName = String(table.tableName || "").trim();
    const tableId = String(table.id || "").trim();
    const nextRowNumber = Number(guestRowNumber || 0);
    if (!tableName || !nextRowNumber) {
      return;
    }

    const nextOrder = findFirstOpenSeat(tableName);
    if (!nextOrder) {
      throw new Error("That table is already full.");
    }

    await rpcRequest("saveGuestTableAssignment", {
      rowNumber: nextRowNumber,
      tableName,
      tableOrder: nextOrder
    });

    const nextGuest = cachedGuests.find((row) => getGuestRowNumber(row) === nextRowNumber);
    if (nextGuest) {
      const nextGuestTableColumn = findGuestColumn(nextGuest, /^table\s*(number|#)?$/i);
      const nextGuestOrderColumn = findGuestColumn(nextGuest, /^table\s*order$/i);
      if (nextGuestTableColumn) {
        nextGuest[nextGuestTableColumn] = tableName;
      }
      if (nextGuestOrderColumn) {
        nextGuest[nextGuestOrderColumn] = String(nextOrder);
      }
    }

    await clearReservedOpenSeatIfNeeded(tableId, nextOrder);

  }

  function updateCachedGuestTableAssignment(rowNumber, tableName, tableOrder) {
    const numericRowNumber = Number(rowNumber || 0);
    if (!numericRowNumber) {
      return;
    }

    const guest = cachedGuests.find((row) => getGuestRowNumber(row) === numericRowNumber);
    if (!guest) {
      return;
    }

    const guestTableColumn = findGuestColumn(guest, /^table\s*(number|#)?$/i);
    const guestOrderColumn = findGuestColumn(guest, /^table\s*order$/i);
    if (guestTableColumn) {
      guest[guestTableColumn] = String(tableName || "").trim();
    }
    if (guestOrderColumn) {
      guest[guestOrderColumn] = tableOrder ? String(tableOrder) : "";
    }
  }

  async function syncTableAssignments(tableName, orderedRowNumbers) {
    const normalizedTableName = String(tableName || "").trim();
    if (!normalizedTableName) {
      return;
    }

    const pendingAssignments = [];
    for (let index = 0; index < orderedRowNumbers.length; index += 1) {
      const rowNumber = Number(orderedRowNumbers[index] || 0);
      if (!rowNumber) {
        continue;
      }

      const guestRow = cachedGuests.find((row) => getGuestRowNumber(row) === rowNumber);
      if (guestRow && getGuestTableNumber(guestRow) === normalizedTableName && getGuestTableOrder(guestRow) === index + 1) {
        continue;
      }

      pendingAssignments.push({
        rowNumber,
        tableName: normalizedTableName,
        tableOrder: index + 1
      });
    }

    if (!pendingAssignments.length) {
      return;
    }

    const savedAssignments = await rpcRequest("saveGuestTableAssignments", {
      assignments: pendingAssignments
    });

    (Array.isArray(savedAssignments) ? savedAssignments : []).forEach((assignment) => {
      updateCachedGuestTableAssignment(assignment.rowNumber, assignment.tableName, assignment.tableOrder);
    });
  }

  function buildSeatRowNumbers(tableName) {
    const table = getTableByName(tableName);
    const seatCount = getRenderableSeatCountForTable(table, getAssignedGuestByTableName(tableName));
    const seats = Array.from({ length: seatCount }, () => 0);
    getAssignedGuestByTableName(tableName).forEach((guest) => {
      const seatIndex = Number(guest.tableOrder || 0) - 1;
      if (seatIndex >= 0 && seatIndex < seats.length) {
        seats[seatIndex] = Number(guest.rowNumber || 0);
      }
    });
    return seats;
  }

  async function moveGuestToTablePosition(rowNumber, targetTableName, targetIndex) {
    const numericRowNumber = Number(rowNumber || 0);
    const normalizedTargetTableName = String(targetTableName || "").trim();
    const targetSeatNumber = Math.max(1, Number(targetIndex || 0));
    const guestRow = cachedGuests.find((row) => getGuestRowNumber(row) === numericRowNumber);
    if (!numericRowNumber || !normalizedTargetTableName || !guestRow) {
      return;
    }

    const sourceTableName = getGuestTableNumber(guestRow);
    const guest = {
      rowNumber: numericRowNumber,
      name: getGuestDisplayName(guestRow),
      type: getGuestTypeValue(guestRow),
      attending: getGuestRsvpLabel(guestRow),
      tableNumber: sourceTableName,
      tableOrder: getGuestTableOrder(guestRow)
    };
    const targetTable = getTableByName(normalizedTargetTableName);
    if (!targetTable || !canGuestSitAtTable(guest, targetTable)) {
      throw new Error("That guest cannot be assigned to the selected table.");
    }

    if (targetSeatNumber > Math.max(0, Number(targetTable.count || 0))) {
      throw new Error("That seat is outside the selected table.");
    }

    if (sourceTableName !== normalizedTargetTableName && getAvailableSeatCount(normalizedTargetTableName, numericRowNumber) < 1) {
      throw new Error("That table is already full.");
    }

    const currentSeatNumber = Math.max(1, Number(getGuestTableOrder(guestRow) || 0));
    const currentIndex = currentSeatNumber - 1;
    if (currentIndex < 0) {
      return;
    }

    if (sourceTableName === normalizedTargetTableName) {
      if (currentSeatNumber === targetSeatNumber) {
        return;
      }

      const nextSeats = buildSeatRowNumbers(sourceTableName);
      const targetSeatIndex = targetSeatNumber - 1;
      nextSeats[currentIndex] = 0;
      if (!nextSeats[targetSeatIndex]) {
        nextSeats[targetSeatIndex] = numericRowNumber;
      } else if (targetSeatIndex < currentIndex) {
        for (let index = currentIndex - 1; index >= targetSeatIndex; index -= 1) {
          nextSeats[index + 1] = nextSeats[index];
        }
        nextSeats[targetSeatIndex] = numericRowNumber;
      } else {
        for (let index = currentIndex + 1; index <= targetSeatIndex; index += 1) {
          nextSeats[index - 1] = nextSeats[index];
        }
        nextSeats[targetSeatIndex] = numericRowNumber;
      }
      await syncTableAssignments(sourceTableName, nextSeats);
      await clearReservedOpenSeatIfNeeded(String(targetTable.id || "").trim(), targetSeatNumber);
      return;
    }

    const nextSourceSeats = buildSeatRowNumbers(sourceTableName);
    const nextTargetSeats = buildSeatRowNumbers(normalizedTargetTableName);
    const targetSeatIndex = targetSeatNumber - 1;
    nextSourceSeats[currentIndex] = 0;

    if (nextTargetSeats[targetSeatIndex]) {
      const openSeatIndex = nextTargetSeats.findIndex((seatRowNumber) => !seatRowNumber);
      if (openSeatIndex < 0) {
        throw new Error("That table is already full.");
      }
      for (let index = openSeatIndex - 1; index >= targetSeatIndex; index -= 1) {
        nextTargetSeats[index + 1] = nextTargetSeats[index];
      }
    }
    nextTargetSeats[targetSeatIndex] = numericRowNumber;

    await syncTableAssignments(sourceTableName, nextSourceSeats);
    await syncTableAssignments(normalizedTargetTableName, nextTargetSeats);
    await clearReservedOpenSeatIfNeeded(String(targetTable.id || "").trim(), targetSeatNumber);
  }

    };
  }

  function canDropActiveGuestOnTable(tableName) {
    const guest = getActiveTableDragGuest();
    if (!guest) {
      return false;
    }

    const normalizedTableName = String(tableName || "").trim();
    if (guest.tableNumber === normalizedTableName) {
      return true;
    }

    const table = getTableByName(normalizedTableName);
    return Boolean(table) && canGuestSitAtTable(guest, table) && getAvailableSeatCount(normalizedTableName, guest.rowNumber) > 0;
  }

  function syncTableDragUi() {

    tablesListEl.classList.toggle("is-table-drag-active", Boolean(dragGuest));
    tablesListEl.querySelectorAll("[data-assigned-guest]").forEach((entry) => {
      entry.classList.toggle("is-drag-source", Boolean(dragGuest) && Number(entry.dataset.rowNumber || 0) === Number(dragGuest?.rowNumber || 0));
    });
    tablesListEl.querySelectorAll("[data-table-dropzone]").forEach((dropzone) => {
      const canDrop = dragGuest
        ? canDropActiveGuestOnTable(dropzone.dataset.tableName) && Number(dropzone.dataset.dropSeat || 0) > 0
        : false;
      dropzone.dataset.dropEnabled = canDrop ? "true" : "false";
      dropzone.setAttribute("aria-disabled", canDrop ? "false" : "true");
      dropzone.classList.toggle("is-drop-available", Boolean(dragGuest) && canDrop);
      dropzone.classList.toggle("is-active-dropzone", false);
    });
  }

  function getRsvpGroup(attending) {
    const normalized = String(attending || "").trim().toLowerCase();
    if (normalized === "yes" || normalized === "attending") return "yes";
    if (normalized === "no" || normalized === "not attending" || normalized === "declined") return "no";
    return "maybe";
  }

  function getRsvpLabel(group) {
    if (group === "yes") return "Attending";
    if (group === "no") return "Not Attending";
    return "Maybe";
  }

  function formatRsvpMeta(rsvp) {
    return [
      getRsvpLabel(getRsvpGroup(rsvp.attending)),
      rsvp.plusOneRsvp ? `Plus 1: ${rsvp.plusOneRsvp}` : "",
      rsvp.tableNumber ? `Table ${rsvp.tableNumber}` : "",
      rsvp.guests ? `${rsvp.guests} guest${String(rsvp.guests) === "1" ? "" : "s"}` : "",
      rsvp.email || "",
      rsvp.submittedAt ? new Date(rsvp.submittedAt).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : ""
    ].filter(Boolean).join(" | ");
  }

      rsvpFeedConnected = false;
      cachedRsvps = [];
      cachedGuests = [];

      renderGuests();
      renderTables();
      renderTableTypeOptions();
      renderSummary();

      setStatus(guestsStatusEl, error.message || "Unable to load Guests.", "error");
      setStatus(plannerSyncStatusEl, "Dashboard unlocked, but the spreadsheet feed could not be reached.", "error");
    }
  }
