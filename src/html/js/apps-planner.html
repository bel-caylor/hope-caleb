  function getRsvpEditMembers(rsvp) {
    return String(rsvp?.groupMembers || "").split("|")
      .map((entry) => entry.trim()).filter(Boolean)
      .map((entry) => {
        const separator = entry.lastIndexOf(":");
        return {
          name: (separator >= 0 ? entry.slice(0, separator) : entry).trim(),
          response: separator >= 0 ? entry.slice(separator + 1).trim() : ""
        };
      }).filter((member) => member.name);
  }

  function getRsvpEditAnswer(value) {
    const group = getRsvpGroup(value);
    return group === "yes" ? "attending" : group === "no" ? "not-attending" : "";
  }

  function openRsvpEditModal(group) {
    requirePlannerAccess();
    const modal = rsvpListEl?.querySelector("#rsvpEditModal");
    const form = modal?.querySelector("#rsvpEditForm");
    if (!modal || !form) return;
    const rsvp = getRsvpSubmissions()
      .filter((item) => String(item.group || item.name || "").trim() === group)
      .sort((left, right) => new Date(right.submittedAt || 0).getTime() - new Date(left.submittedAt || 0).getTime())[0];
    if (!rsvp) return;
    addRsvpContactEditorFields(form);
    form.querySelector("[data-rsvp-edit-members]")?.closest("fieldset")?.classList.add("rsvp-edit-section");
    setRsvpVolunteerHelpVisibility(form, rsvp);

    fillForm(form, {
      group: rsvp.group || group,
      contactName: rsvp.name || group,
      email: rsvp.email,
      mobile: rsvp.mobile,
      rehearsalRsvp: getRsvpEditAnswer(rsvp.rehearsalRsvp),
      openHouseRsvp: getRsvpEditAnswer(rsvp.openHouseRsvp),
      plusOneCount: rsvp.plusOneCount || "0",
      plusOneName: rsvp.plusOneName,
      childrenCount: rsvp.childrenCount || "0",
      childrenNote: rsvp.childrenNote,
      comment: rsvp.comment
    });
    const smsOptInField = form.elements.namedItem("smsOptIn");
    if (smsOptInField) smsOptInField.checked = /^(true|yes)$/i.test(String(rsvp.smsOptedIn || ""));
    const selectedVolunteerRoles = new Set(getVolunteerRoles(rsvp));
    form.querySelectorAll("[data-rsvp-edit-volunteer]").forEach((input) => {
      input.checked = selectedVolunteerRoles.has(String(input.value || ""));
    });
    const membersEl = form.querySelector("[data-rsvp-edit-members]");
    membersEl.innerHTML = getRsvpEditMembers(rsvp).map((member) => `
      <label>${escapeHtml(member.name)}
        <select data-rsvp-edit-member="${escapeHtml(member.name)}">
          <option value="attending"${getRsvpEditAnswer(member.response) === "attending" ? " selected" : ""}>Attending</option>
          <option value="not-attending"${getRsvpEditAnswer(member.response) === "not-attending" ? " selected" : ""}>Not attending</option>
        </select>
      </label>
    `).join("");
    setStatus(form.querySelector("#rsvpEditStatus"), "", "");
    modal.hidden = false;
    modal.setAttribute("aria-hidden", "false");
    form.elements.namedItem("email")?.focus();
  }

    if (!EventWorkspaceSpeechRecognition) {
      setStatus(workspaceStatusEl, "Voice input works in supported browsers such as Chrome. You can type the event instead.", "pending");
      return;
    }

    if (workspaceCaptureRecognition) {
      workspaceCaptureRecognition.__stoppedManually = true;
      workspaceCaptureRecognition.stop();
      return;
    }

    const recognition = new EventWorkspaceSpeechRecognition();
    recognition.lang = "en-US";
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;
    recognition.__stoppedManually = false;
    recognition.__baseValue = String(workspaceCapturePromptEl?.value || "").trim();
    recognition.__transcript = "";
    recognition.__finalResultValues = new Map();
    workspaceCaptureRecognition = recognition;
    recognition.onstart = () => {
      stopVoiceInputAfterListeningWindow(recognition);
      recognition.__baseValue = String(workspaceCapturePromptEl?.value || "").trim();
      recognition.__transcript = "";
      recognition.__finalResultValues = new Map();
      setWorkspaceMicButton(workspaceCaptureMicButton, true);
      setStatus(workspaceStatusEl, "", "");
    };
    recognition.onresult = (resultEvent) => {
      let interimTranscript = "";
      for (let index = resultEvent.resultIndex || 0; index < resultEvent.results.length; index += 1) {
        const result = resultEvent.results[index];
        const transcript = String(result?.[0]?.transcript || "").trim();
        if (result.isFinal) {
          if (isNewFinalSpeechResult(recognition, index, transcript)) recognition.__transcript = mergeVoiceTranscriptIntoNotes(recognition.__transcript, transcript);
        } else {
          interimTranscript = mergeVoiceTranscriptIntoNotes(interimTranscript, transcript);
        }
      }
      if (workspaceCapturePromptEl) {
        workspaceCapturePromptEl.value = mergeVoiceTranscriptIntoNotes(
          recognition.__baseValue,
          mergeVoiceTranscriptIntoNotes(recognition.__transcript, interimTranscript)
        );
      }
    };
    recognition.onerror = (errorEvent) => {
      clearVoiceInputListeningWindow(recognition);
      const error = String(errorEvent.error || "");
      if (["not-allowed", "service-not-allowed", "audio-capture"].includes(error)) {
        recognition.__stoppedManually = true;
        setStatus(workspaceStatusEl, "Microphone access was not available. You can type the event instead.", "error");
      }
    };
    recognition.onend = () => {
      clearVoiceInputListeningWindow(recognition);
      if (!recognition.__stoppedManually) {
        try {
          recognition.start();
          return;
        } catch (_) {
          recognition.__stoppedManually = true;
        }
      }
      if (workspaceCaptureRecognition === recognition) workspaceCaptureRecognition = null;
      setWorkspaceMicButton(workspaceCaptureMicButton, false);
    };
    recognition.start();

  });

  if ("scrollRestoration" in window.history) {
    window.history.scrollRestoration = "manual";
  }

  window.addEventListener("scroll", () => {
    if (currentView !== "planner" || !canUsePlanner()) return;
    window.clearTimeout(plannerScrollSaveTimer);
    plannerScrollSaveTimer = window.setTimeout(savePlannerScrollPosition, 150);
  }, { passive: true });

  window.addEventListener("pagehide", () => {
    if (currentView === "planner" && canUsePlanner()) savePlannerScrollPosition();
  });

  window.addEventListener("popstate", () => {
    currentView = getRequestedView();
    if (currentView === "planner") {
      restorePlannerRoute();
    }
    renderRoute();
    if (currentView === "planner" && activePlannerPanel === "workspace") {
      renderWorkspaceEventPage();
    }
    maybeLoadPlannerData();
  });

  window.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && plannerSidebarMediaQuery.matches && plannerSidebarOpen && viewerProfile.isAdmin) {
      closePlannerSidebar();
      return;
    }

    if (event.key === "Escape" && !personModal.hidden) {
      closePersonModal();
      return;
    }

    if (event.key === "Escape" && !eventModal.hidden) {
      closeEventModal();
      return;
    }

    if (event.key === "Escape" && eventIncludedPeopleModal && !eventIncludedPeopleModal.hidden) {
      closeEventIncludedPeopleModal();
      return;
    }

    if (event.key === "Escape" && eventPromptModal && !eventPromptModal.hidden) {
      closeEventPromptModal();
      return;
    }

    if (event.key === "Escape" && !shotModal.hidden) {
      closeShotModal();
      return;
    }

    if (event.key === "Escape" && !bedModal.hidden) {
      closeBedModal();
      return;
    }

    if (event.key === "Escape" && !todoModal.hidden) {
      closeTodoModal();
      return;
    }

    if (event.key === "Escape" && eventListModal && !eventListModal.hidden) {
      closeEventListModal();
      return;
    }

    if (event.key === "Escape" && !tableModal.hidden) {
      closeTableModal();
      return;
    }

    if (event.key === "Escape" && !addGuestModal.hidden) {
      closeAddGuestModal();
      return;
    }

    if (event.key === "Escape" && guestTextContactModal && !guestTextContactModal.hidden) {
      closeGuestTextContactModal();
    }
  });

  window.addEventListener("load", async () => {
    renderGoogleSignIn();
    const hasStoredToken = hasStoredPlannerSession();
    const cacheShown = hasStoredToken && showCachedPlannerWhileVerifying();
    try {
      await refreshViewer();
    } catch (error) {
      if (cacheShown) {
        setStatus(plannerLoginStatusEl, "Showing your saved planner while account verification retries.", "pending");
        setStatus(plannerSyncStatusEl, error.message || "The planner connection is still waking up. Saved data is available.", "pending");
        return;
      }
      setStatus(plannerLoginStatusEl, error.message || "Unable to verify your Google sign-in.", "error");
      return;
    }
    renderRoute();
    renderPlannerVersionInfo();
    await maybeLoadPlannerData();
    await refreshPlannerVersionInfo();
  });
</script>
