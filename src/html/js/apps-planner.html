  function getRequestedView() {
    const pathname = String(window.location.pathname || "").toLowerCase();
    if (pathname.endsWith("/dashboard.html") || pathname.endsWith("dashboard.html")) {
      return "planner";
    }

    const requested = new URLSearchParams(window.location.search).get("view");
    return requested === "planner" ? "planner" : "home";
  }

  function navigateTo(view) {
    const url = new URL(window.location.href);
    const pathname = String(url.pathname || "").toLowerCase();

    if (pathname.endsWith("/dashboard.html") || pathname.endsWith("dashboard.html")) {
      currentView = "planner";
      renderRoute();
      maybeLoadPlannerData();
      return;
    }

    if (view === "planner") {
      url.searchParams.set("view", "planner");
    } else {
      url.searchParams.delete("view");
    }
    window.history.pushState({}, "", url);
    currentView = view;
    renderRoute();
    maybeLoadPlannerData();
  }

  function renderRoute() {
    routedViews.forEach((section) => {
      section.hidden = section.dataset.view !== currentView;
    });

    routeLinks.forEach((link) => {
      link.classList.toggle("is-active", link.dataset.routeLink === currentView);
    });

    const showPlanner = currentView === "planner";
    plannerLockedEl.hidden = !showPlanner || viewerProfile.isAdmin;
    plannerUnlockedEl.hidden = !showPlanner || !viewerProfile.isAdmin;
    plannerContentEl.hidden = !showPlanner || !viewerProfile.isAdmin;
    setActivePlannerPanel(activePlannerPanel);
    updateViewerState();
  }

  function setActivePlannerPanel(panelName) {
    const availablePanels = plannerPanels.map((panel) => panel.dataset.plannerPanel);
    const nextPanel = availablePanels.includes(panelName) ? panelName : availablePanels[0];
    if (!nextPanel) {
      return;
    }

    activePlannerPanel = nextPanel;

    plannerSectionButtons.forEach((button) => {
      const isActive = button.dataset.plannerSection === nextPanel;
      button.classList.toggle("is-active", isActive);
      button.setAttribute("aria-pressed", isActive ? "true" : "false");
    });

    plannerPanels.forEach((panel) => {
      panel.hidden = panel.dataset.plannerPanel !== nextPanel;
    });
  }

  function updateViewerState() {
    plannerSignOutButton.hidden = !viewerProfile.isAdmin;

    if (!viewerProfile.signedIn) {
      viewerStateEl.textContent = "The dashboard is password protected.";
      plannerGateMessageEl.textContent = "Enter the dashboard password to unlock planning tools.";
      return;
    }

    viewerStateEl.textContent = "Dashboard unlocked on this device.";
    plannerGateMessageEl.textContent = "Planner unlocked. Use the nav to move between Home, RSVPs, Guests, Tables, P & V, Timeline, Todo, and Beds.";
  }

  function toLocalInputValue(isoString) {
    if (!isoString) return "";
    const date = new Date(isoString);
    if (Number.isNaN(date.getTime())) return "";
    const pad = (value) => String(value).padStart(2, "0");
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
  }

  function formatEventDate(dateValue) {
    const raw = String(dateValue || "").trim();
    if (!raw) return "";

    const directMatch = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (directMatch) {
      const localDate = new Date(Number(directMatch[1]), Number(directMatch[2]) - 1, Number(directMatch[3]));
      return localDate.toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" });
    }

    const parsed = new Date(raw);
    return Number.isNaN(parsed.getTime())
      ? raw
      : parsed.toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" });
  }

  function formatEventTime(timeValue) {
    const raw = String(timeValue || "").trim();
    if (!raw) return "";

    const twentyFourHourMatch = raw.match(/^(\d{1,2}):(\d{2})$/);
    if (twentyFourHourMatch) {
      const hours = Number(twentyFourHourMatch[1]);
      const minutes = twentyFourHourMatch[2];
      const suffix = hours >= 12 ? "PM" : "AM";
      const normalizedHour = hours % 12 || 12;
      return `${normalizedHour}:${minutes} ${suffix}`;
    }

    const parsed = new Date(raw);
    return Number.isNaN(parsed.getTime())
      ? raw
      : parsed.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }

  function formatEventSchedule(event) {
    return [formatEventDate(event.date), formatEventTime(event.startsAt)].filter(Boolean).join(" at ");
  }

  function formatEventDateShort(dateValue) {
    const raw = String(dateValue || "").trim();
    if (!raw) return "";

    const directMatch = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (directMatch) {
      const localDate = new Date(Number(directMatch[1]), Number(directMatch[2]) - 1, Number(directMatch[3]));
      return localDate.toLocaleDateString([], { month: "short", day: "numeric" });
    }

    const parsed = new Date(raw);
    return Number.isNaN(parsed.getTime())
      ? raw
      : parsed.toLocaleDateString([], { month: "short", day: "numeric" });
  }

  function getEventDateFilterValue(event) {
    return String(event?.date || "").trim();
  }

  function getEventAssignedToFilterValue(event) {
    return String(event?.assignedTo || "").trim();
  }

  function parseEventDateTime(event) {
    const rawDate = String(event?.date || "").trim();
    if (!rawDate) {
      return null;
    }

    let parsedDate;
    const dateMatch = rawDate.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (dateMatch) {
      parsedDate = new Date(Number(dateMatch[1]), Number(dateMatch[2]) - 1, Number(dateMatch[3]));
    } else {
      parsedDate = new Date(rawDate);
    }

    if (Number.isNaN(parsedDate.getTime())) {
      return null;
    }

    const rawTime = String(event?.startsAt || "").trim();
    if (!rawTime) {
      parsedDate.setHours(0, 0, 0, 0);
      return parsedDate;
    }

    const twentyFourHourMatch = rawTime.match(/^(\d{1,2}):(\d{2})$/);
    if (twentyFourHourMatch) {
      parsedDate.setHours(Number(twentyFourHourMatch[1]), Number(twentyFourHourMatch[2]), 0, 0);
      return parsedDate;
    }

    const twelveHourMatch = rawTime.match(/^(\d{1,2}):(\d{2})\s*([AP]M)$/i);
    if (twelveHourMatch) {
      let hours = Number(twelveHourMatch[1]) % 12;
      if (twelveHourMatch[3].toUpperCase() === "PM") {
        hours += 12;
      }
      parsedDate.setHours(hours, Number(twelveHourMatch[2]), 0, 0);
      return parsedDate;
    }

    return parsedDate;
  }

  function isTrueLike(value) {
    const normalized = String(value == null ? "" : value).trim().toLowerCase();
    return normalized === "true" || normalized === "yes" || normalized === "1";
  }

  function isFalseLike(value) {
    const normalized = String(value == null ? "" : value).trim().toLowerCase();
    return normalized === "false" || normalized === "no" || normalized === "0";
  }

  function getNextMainEvent() {
    const now = Date.now();
    const activeEvents = cachedEvents.filter((event) => !isFalseLike(event.active));
    const futureMainEvents = activeEvents.filter((event) => isTrueLike(event.main) && parseEventDateTime(event)?.getTime() >= now);
    if (futureMainEvents.length) {
      return futureMainEvents[0];
    }

    const futureEvents = activeEvents.filter((event) => parseEventDateTime(event)?.getTime() >= now);
    if (futureEvents.length) {
      return futureEvents[0];
    }

    const mainEvents = activeEvents.filter((event) => isTrueLike(event.main));
    return mainEvents[0] || null;
  }

  function getCountdownParts(targetDate) {
    if (!(targetDate instanceof Date) || Number.isNaN(targetDate.getTime())) {
      return null;
    }

    const diffMs = targetDate.getTime() - Date.now();
    if (diffMs <= 0) {
      return { days: "0", hours: "00", minutes: "00", seconds: "00", isPast: true };
    }

    const totalSeconds = Math.floor(diffMs / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    return {
      days: String(days),
      hours: String(hours).padStart(2, "0"),
      minutes: String(minutes).padStart(2, "0"),
      seconds: String(seconds).padStart(2, "0"),
      isPast: false
    };
  }

  function updatePlannerCountdown(targetDate, eventTitle) {
    const countdownRoot = plannerSummaryEl.querySelector("[data-planner-countdown]");
    if (!countdownRoot) {
      return;
    }

    const dayEl = countdownRoot.querySelector("[data-countdown-days]");
    const hourEl = countdownRoot.querySelector("[data-countdown-hours]");
    const minuteEl = countdownRoot.querySelector("[data-countdown-minutes]");
    const secondEl = countdownRoot.querySelector("[data-countdown-seconds]");
    const summaryEl = countdownRoot.querySelector("[data-countdown-summary]");
    const parts = getCountdownParts(targetDate);

    if (!dayEl || !hourEl || !minuteEl || !secondEl || !summaryEl || !parts) {
      return;
    }

    dayEl.textContent = parts.days;
    hourEl.textContent = parts.hours;
    minuteEl.textContent = parts.minutes;
    secondEl.textContent = parts.seconds;
    summaryEl.textContent = parts.isPast
      ? `${eventTitle} is happening now or has already started.`
      : `${parts.days} days until ${eventTitle.toLowerCase()}.`;
  }

  function startPlannerCountdown(targetDate, eventTitle) {
    if (plannerCountdownTimer) {
      window.clearInterval(plannerCountdownTimer);
      plannerCountdownTimer = null;
    }

    if (!(targetDate instanceof Date) || Number.isNaN(targetDate.getTime())) {
      return;
    }

    updatePlannerCountdown(targetDate, eventTitle);
    plannerCountdownTimer = window.setInterval(() => {
      updatePlannerCountdown(targetDate, eventTitle);
    }, 1000);
  }

  function fillForm(form, values) {
    Object.entries(values).forEach(([key, value]) => {
      const field = form.elements.namedItem(key);
      if (field) {
        field.value = value == null ? "" : String(value);
      }
    });
  }

  function renderAddGuestOptions(table) {
    const guestField = addGuestForm.elements.namedItem("guestRowNumber");
    if (!guestField) {
      return;
    }

    const eligibleGuests = getEligibleGuestsForTable(table);
    guestField.innerHTML = `
      <option value="">Select a ${escapeHtml(table.type || "guest")}</option>
      ${eligibleGuests.map((guest) => `
        <option value="${escapeHtml(String(guest.rowNumber || ""))}">
          ${escapeHtml(guest.name)}
        </option>
      `).join("")}
    `;
    guestField.disabled = eligibleGuests.length === 0;
  }

    clearAddGuestForm();
    activeTableForGuestModal = table;
    addGuestForm.elements.namedItem("tableId").value = String(table.id || "").trim();
    addGuestForm.elements.namedItem("tableName").value = String(table.tableName || "").trim();
    addGuestModal.querySelector("#addGuestModalTitle").textContent = `Add Guest to ${table.tableName || "Table"}`;

  function renderPeople() {
    if (!cachedPeople.length) {
      peopleListEl.innerHTML = '<p class="meta">No people yet. Add your wedding party, family, vendors, or helpers here.</p>';
      return;
    }

    peopleListEl.innerHTML = cachedPeople.map((person) => `
      <article class="card">
        <h3>${escapeHtml(person.name || "Unnamed person")}</h3>
        <p>${escapeHtml([person.role, person.groupName].filter(Boolean).join(" | ") || "No role or group yet")}</p>
        <p class="meta">${escapeHtml(person.phone || "No phone")} | ${escapeHtml(person.consentStatus || "consent unknown")}</p>
        <div class="toolbar">
          <button type="button" data-edit-person="${escapeHtml(person.id)}">Edit</button>
        </div>
      </article>
    `).join("");
  }

  function renderEvents() {
    if (!cachedEvents.length) {
      renderEventDateFilter([]);
      renderEventAssignedToFilter([]);
      eventsListEl.innerHTML = '<p class="meta">No events yet. Add wedding-day timeline items, planning milestones, or reminder dates to get started.</p>';
      return;
    }

    const dateOptions = collectEventDateOptions(cachedEvents);
    const assignedToOptions = collectEventAssignedToOptions(cachedEvents);
    renderEventDateFilter(dateOptions);
    renderEventAssignedToFilter(assignedToOptions);

    const filteredEvents = getFilteredEvents();
    if (!filteredEvents.length) {
      const activeFilters = [selectedEventDate ? "date" : "", selectedEventAssignedTo ? "Assigned To" : ""].filter(Boolean).join(" + ");
      eventsListEl.innerHTML = `<p class="meta">No events match the current ${escapeHtml(activeFilters || "filters")}.</p>`;
      return;
    }

    eventsListEl.innerHTML = `
      <div class="event-accordion">
        ${filteredEvents.map((event) => {
          const schedule = formatEventSchedule(event);
          const timeLabel = formatEventTime(event.startsAt);
          const dateLabel = formatEventDate(event.date) || "No date";
          return `
            <details class="guest-card ${event.main ? "event-card--main" : ""}">
              <summary>
                <span class="event-accordion__summary-main">
                  <span class="event-accordion__toggle" aria-hidden="true"></span>
                  ${timeLabel ? `<span class="event-accordion__time">${escapeHtml(timeLabel)}</span>` : ""}
                  <span class="event-accordion__title">${escapeHtml(event.title || "Untitled event")}</span>
                </span>
                <span class="event-accordion__date">${escapeHtml(dateLabel)}</span>
              </summary>
              <div class="guest-card__body">
                <div class="guest-card__grid">
                  <div class="guest-card__field">
                    <span>Date & Time</span>
                    <strong>${escapeHtml(schedule || "No schedule yet")}</strong>
                  </div>
                  <div class="guest-card__field">
                    <span>Assigned To</span>
                    <strong>${escapeHtml(event.assignedTo || "No audience yet")}</strong>
                  </div>
                  <div class="guest-card__field">
                    <span>Location</span>
                    <strong>${escapeHtml(event.location || "No location")}</strong>
                  </div>
                  <div class="guest-card__field">
                    <span>Reminder</span>
                    <strong>${escapeHtml(`remind ${event.reminderMinutes} minutes ahead`)}</strong>
                  </div>
                  ${event.notes ? `
                    <div class="guest-card__field guest-card__field--full">
                      <span>Notes</span>
                      <strong>${escapeHtml(event.notes)}</strong>
                    </div>
                  ` : ""}
                </div>
                <div class="event-accordion__toolbar">
                  <button
                    class="button button--icon button--light event-card__edit"
                    type="button"
                    data-edit-event="${escapeHtml(event.id)}"
                    aria-label="Edit ${escapeHtml(event.title || "event")}">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                      <path d="M12 20h9"/>
                      <path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"/>
                    </svg>
                  </button>
                </div>
              </div>

          `;

    `;
  }

  function renderTodos() {

      todosListEl.innerHTML = '<p class="meta">No tasks yet. Add your wedding to-dos, reminders, and follow-ups here.</p>';

    }

    todosListEl.innerHTML = cachedTodos.map((todo) => {
      const schedule = [formatEventDate(todo.startDate), formatEventDate(todo.dueDate)].filter(Boolean).join(" to ");
      return `
        <article class="card event-card ${todo.isComplete ? "event-card--main" : ""}">
          <div class="event-card__header">
            <h3>${escapeHtml(todo.title || "Untitled task")}</h3>
            <button
              class="button button--icon button--light event-card__edit"
              type="button"
              data-edit-todo="${escapeHtml(todo.id)}"
              aria-label="Edit ${escapeHtml(todo.title || "task")}">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M12 20h9"/>
                <path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"/>
              </svg>
            </button>
          </div>

          ${schedule ? `<p class="meta">${escapeHtml(schedule)}</p>` : ""}

  async function saveBedInlineAssignment(bedId, field, value) {
    const bed = cachedBeds.find((item) => item.id === bedId);
    if (!bed || (field !== "thursday" && field !== "friday")) {
      return;
    }

    setStatus(bedsInlineStatusEl, "Saving bed assignment...", "pending");
    await rpcRequest("saveBed", {
      id: String(bed.id || "").trim(),
      lodging: String(bed.lodging || "").trim(),
      room: String(bed.room || "").trim(),
      bedLabel: String(bed.bedLabel || "").trim(),
      bedType: String(bed.bedType || "").trim(),
      capacity: Number(bed.capacity || 0),
      thursday: field === "thursday" ? String(value || "").trim() : String(bed.thursday || "").trim(),
      friday: field === "friday" ? String(value || "").trim() : String(bed.friday || "").trim(),
      notes: String(bed.notes || "").trim()
    });
  }

  function getBedCellInputClass(value) {
    const normalized = String(value || "").trim();
    if (!normalized) {
      return "bed-table__cell-input bed-table__cell-input--unassigned";
    }
    if (normalized.startsWith("??")) {
      return "bed-table__cell-input bed-table__cell-input--question";
    }
    return "bed-table__cell-input";
  }

  function getBedCellKey(bedId, field) {
    return `${String(bedId || "").trim()}:${String(field || "").trim()}`;
  }

  function applyBedInputAppearance(input) {
    if (!input) return;
    input.className = getBedCellInputClass(input.value);
  }

  function setCachedBedField(bedId, field, value) {
    const bed = cachedBeds.find((item) => item.id === bedId);
    if (!bed || (field !== "thursday" && field !== "friday")) {
      return;
    }
    bed[field] = String(value || "").trim();
  }

  function clearBedSaveTimer(key) {
    const timer = bedSaveTimers.get(key);
    if (timer) {
      window.clearTimeout(timer);
      bedSaveTimers.delete(key);
    }
  }

  async function commitBedInputValue(input, value) {
    if (!input) return;

    const bedId = String(input.dataset.bedId || "").trim();
    const field = String(input.dataset.bedField || "").trim();
    const key = getBedCellKey(bedId, field);
    const nextValue = String(value || "").trim();
    const previousValue = String(input.dataset.bedValue || "").trim();

    if (!bedId || (field !== "thursday" && field !== "friday") || nextValue === previousValue) {
      applyBedInputAppearance(input);
      return;
    }

    const previousChain = bedSaveChains.get(key) || Promise.resolve();
    const nextChain = previousChain.finally(async () => {
      setStatus(bedsInlineStatusEl, "Saving bed assignment...", "");
      await saveBedInlineAssignment(bedId, field, nextValue);
      input.dataset.bedValue = nextValue;
      setCachedBedField(bedId, field, nextValue);
      applyBedInputAppearance(input);
      setStatus(bedsInlineStatusEl, "Bed assignments saved.", "success");
    });

    bedSaveChains.set(key, nextChain.catch(() => {}));
    return nextChain;
  }

  function scheduleBedInputSave(input) {
    if (!input) return;
    applyBedInputAppearance(input);

    const key = getBedCellKey(input.dataset.bedId, input.dataset.bedField);
    clearBedSaveTimer(key);

    const pendingValue = String(input.value || "");
    const timer = window.setTimeout(async () => {
      bedSaveTimers.delete(key);
      try {
        await commitBedInputValue(input, pendingValue);
      } catch (error) {
        setStatus(bedsInlineStatusEl, error.message || "Unable to save bed assignment.", "error");
      }
    }, BED_SAVE_DEBOUNCE_MS);

    bedSaveTimers.set(key, timer);
  }

  async function flushBedInputSave(input) {
    if (!input) return;
    const key = getBedCellKey(input.dataset.bedId, input.dataset.bedField);
    clearBedSaveTimer(key);
    applyBedInputAppearance(input);
    return commitBedInputValue(input, input.value);
  }

  function shouldHideGuestColumn(column) {
    const normalized = String(column || "").trim().toLowerCase();
    return !normalized || normalized === "table number" || normalized === "table order" || normalized === "__rownumber";
  }

  function sanitizeGuestRow(row, columns) {
    const titleColumn = findGuestTitleColumn(columns);
    const title = String(row[titleColumn] || "").trim();

    if (!title || /^total:?$/i.test(title) || /^\d+$/.test(title)) {
      return null;
    }

    const fields = columns
      .filter((column) => column !== titleColumn)
      .map((column) => ({
        label: column,
        value: String(row[column] || "").trim()
      }))
      .filter((field) => field.value && field.value !== "-");

    if (!fields.length) {
      return {
        title,
        meta: "",
        fields: []
      };
    }

    return {
      title,
      type: getGuestType(row),
      meta: summarizeGuestFields(fields),
      fields
    };
  }

  function getGuestType(row) {
    const match = Object.entries(row).find(([key]) => String(key || "").trim().toLowerCase() === "type");
    return String(match?.[1] || "").trim();
  }

  function collectGuestTypes(guests) {
    return Array.from(new Set(
      guests
        .map((guest) => guest.type)
        .filter(Boolean)
    )).sort((a, b) => a.localeCompare(b));
  }

  function renderGuestTypeFilter(types) {
    if (!guestTypeFilterEl) {
      return;
    }

    const normalizedTypes = Array.isArray(types) ? types : [];
    if (selectedGuestType && !normalizedTypes.includes(selectedGuestType)) {
      selectedGuestType = "";

    guestTypeFilterEl.innerHTML = `
      <option value="">All types</option>
      ${normalizedTypes.map((type) => `<option value="${escapeHtml(type)}">${escapeHtml(type)}</option>`).join("")}
    `;
    guestTypeFilterEl.value = selectedGuestType;
    guestTypeFilterEl.disabled = normalizedTypes.length === 0;
  }

  function collectEventDateOptions(events) {
    const normalizedEvents = Array.isArray(events) ? events : [];
    const parsedDates = normalizedEvents
      .map((event) => ({
        value: getEventDateFilterValue(event),
        parsed: parseEventDateTime({ date: getEventDateFilterValue(event), startsAt: "00:00" })
      }))
      .filter((item) => item.value && item.parsed);

    if (!parsedDates.length) {
      return [];
    }

    const sortedDates = parsedDates
      .map((item) => item.parsed)
      .sort((left, right) => right.getTime() - left.getTime());

    const latestDate = sortedDates[0];
    const latestDateValue = `${latestDate.getFullYear()}-${String(latestDate.getMonth() + 1).padStart(2, "0")}-${String(latestDate.getDate()).padStart(2, "0")}`;
    const priorCutoff = new Date(latestDate);
    priorCutoff.setDate(priorCutoff.getDate() - 1);
    const priorCutoffValue = `${priorCutoff.getFullYear()}-${String(priorCutoff.getMonth() + 1).padStart(2, "0")}-${String(priorCutoff.getDate()).padStart(2, "0")}`;

    return [
      { value: latestDateValue, label: formatEventDateShort(latestDateValue) },
      { value: `before:${latestDateValue}`, label: `${formatEventDateShort(priorCutoffValue)} or before` }
    ];
  }

  function collectEventAssignedToOptions(events) {
    return Array.from(new Set(
      (Array.isArray(events) ? events : [])
        .map((event) => getEventAssignedToFilterValue(event))
        .filter(Boolean)
    )).sort((left, right) => left.localeCompare(right, undefined, { sensitivity: "base" }));
  }

  function getFilteredEvents() {
    return cachedEvents.filter((event) => {
      if (selectedEventDate) {
        const eventDateValue = getEventDateFilterValue(event);
        if (selectedEventDate.startsWith("before:")) {
          const cutoff = selectedEventDate.slice("before:".length);
          if (!eventDateValue) {
            return true;
          }
          if (eventDateValue >= cutoff) {
            return false;
          }
        } else if (eventDateValue !== selectedEventDate) {
          return false;
        }
      }

      if (selectedEventAssignedTo && getEventAssignedToFilterValue(event) !== selectedEventAssignedTo) {
        return false;
      }

      return true;
    });
  }

  function findGuestTitleColumn(columns) {

  function findGuestColumn(row, matcher) {

  function getGuestDisplayName(row) {
    const nameColumn = findGuestColumn(row, /name/i);

  function getGuestRowNumber(row) {
    const raw = row.__rowNumber;

    return Number.isInteger(parsed) && parsed > 1 ? parsed : 0;

  function getGuestTypeValue(row) {
    const typeColumn = findGuestColumn(row, /^type$/i);

  function getTableTypes(table) {

  function getGuestTableNumber(row) {
    const tableColumn = findGuestColumn(row, /^table\s*(number|#)?$/i);

  function getGuestTableOrder(row) {
    const orderColumn = findGuestColumn(row, /^table\s*order$/i);
    const raw = String(orderColumn ? row[orderColumn] || "" : "").trim();
    const parsed = Number(raw);
    return Number.isFinite(parsed) && parsed > 0 ? parsed : 0;

  function getGuestRsvpLabel(row) {
    const rsvpColumn = findGuestColumn(row, /^rsvp$/i);
    return String(rsvpColumn ? row[rsvpColumn] || "" : "").trim();

  function getGuestPlusOneRsvp(row) {
    const plusOneColumn = findGuestColumn(row, /plus\s*1.*rsvp|rsvp.*plus\s*1|plus\s*one.*rsvp/i);

    if (cachedGuests.length) {

          name: getGuestDisplayName(row),
          attending: getGuestRsvpLabel(row),
          plusOneRsvp: getGuestPlusOneRsvp(row),
          tableNumber: getGuestTableNumber(row),
          type: getGuestTypeValue(row),
          submittedAt: "",

    return cachedRsvps;

  function compareTableNumbers(left, right) {
    const leftNumber = Number.parseFloat(String(left).replace(/[^\d.]/g, ""));
    const rightNumber = Number.parseFloat(String(right).replace(/[^\d.]/g, ""));

    if (!Number.isNaN(leftNumber) && !Number.isNaN(rightNumber) && leftNumber !== rightNumber) {
      return leftNumber - rightNumber;
    }

    return String(left).localeCompare(String(right), undefined, { numeric: true, sensitivity: "base" });
  }

  function summarizeGuestFields(fields) {
    return fields

  function sortByUpdated(items, key) {
    return [...items].sort((left, right) => String(right[key] || "").localeCompare(String(left[key] || "")));
  }

  function sortEvents(items) {
    return [...items].sort((left, right) => {
      const leftDate = parseEventDateTime(left);
      const rightDate = parseEventDateTime(right);
      if (leftDate && rightDate) {
        const datedComparison = leftDate.getTime() - rightDate.getTime();
        if (datedComparison !== 0) {
          return datedComparison;
        }
      } else {
        const leftStamp = `${left.date || ""}T${left.startsAt || ""}`;
        const rightStamp = `${right.date || ""}T${right.startsAt || ""}`;
        const datedComparison = leftStamp.localeCompare(rightStamp);
        if (datedComparison !== 0) {
          return datedComparison;
        }
      }
      return String(left.title || "").localeCompare(String(right.title || ""));
    });
  }

  function sortTodos(items) {
    return [...items].sort((left, right) => {
      const completeDelta = Number(Boolean(left.isComplete)) - Number(Boolean(right.isComplete));
      if (completeDelta !== 0) {
        return completeDelta;
      }

      const dueDelta = String(left.dueDate || "").localeCompare(String(right.dueDate || ""));
      if (dueDelta !== 0) {
        return dueDelta;
      }

      return String(left.title || "").localeCompare(String(right.title || ""));
    });
  }

  function renderPlannerData() {
    renderPeople();
    renderEvents();
    renderTodos();
    renderBedsTable();
    renderRsvps();

  function getRpcUrl() {
    const scriptBaseUrl = String(window.PLANNER_CTX.scriptBaseUrl || "").trim();
    if (scriptBaseUrl && !scriptBaseUrl.startsWith("<?")) {
      return scriptBaseUrl;
    }
    return String(window.PLANNER_CTX.rsvpFeedUrl || "").trim();
  }

  async function rpcRequest(method, payload) {
    const rpcUrl = getRpcUrl();
    const passwordHash = String(window.sessionStorage.getItem(STORAGE_KEYS.authHash) || "").trim();

    if (!rpcUrl) {
      throw new Error("Planner backend URL is not configured yet.");
    }

    const response = await fetch(rpcUrl, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        method,
        payload,
        passwordHash
      })
    });

    const result = await response.json();
    if (!result?.ok) {
      throw new Error(result?.error || "Planner request failed.");
    }

    return result.data;
  }

  async function refreshPlannerCollections() {
    const [people, events, beds, todos, tables] = await Promise.all([
      rpcRequest("listPeople", {}),
      rpcRequest("listEvents", {}),
      rpcRequest("listBeds", {}),
      rpcRequest("listTodos", {}),
      rpcRequest("listTables", {})
    ]);

    cachedPeople = sortByUpdated(Array.isArray(people) ? people : [], "updatedAt");
    cachedEvents = sortEvents(Array.isArray(events) ? events : []);
    cachedBeds = [...(Array.isArray(beds) ? beds : [])].sort((left, right) => {
      const orderDelta = Number(left.sortOrder || 0) - Number(right.sortOrder || 0);
      if (orderDelta !== 0) {
        return orderDelta;
      }
      return `${left.lodging || ""} ${left.room || ""} ${left.bedLabel || ""}`.localeCompare(
        `${right.lodging || ""} ${right.room || ""} ${right.bedLabel || ""}`
      );
    });
    cachedTodos = sortTodos(Array.isArray(todos) ? todos : []);
    cachedTables = sortTables(Array.isArray(tables) ? tables : []);
    renderPlannerData();
  }

  async function hashPassword(password) {
    const normalized = String(password || "");
    const cryptoApi = window.crypto || window.msCrypto;

    if (cryptoApi && cryptoApi.subtle && typeof cryptoApi.subtle.digest === "function" && typeof TextEncoder !== "undefined") {
      const bytes = new TextEncoder().encode(normalized);
      const digest = await cryptoApi.subtle.digest("SHA-256", bytes);
      return Array.from(new Uint8Array(digest)).map((value) => value.toString(16).padStart(2, "0")).join("");
    }

    return sha256Fallback(normalized);
  }

  function sha256Fallback(input) {
    const words = [];
    const ascii = unescape(encodeURIComponent(String(input || "")));
    const bitLength = ascii.length * 8;
    const hash = [
      0x6a09e667,
      0xbb67ae85,
      0x3c6ef372,
      0xa54ff53a,
      0x510e527f,
      0x9b05688c,
      0x1f83d9ab,
      0x5be0cd19
    ];
    const roundConstants = [
      0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5,
      0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
      0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3,
      0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
      0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc,
      0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
      0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7,
      0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
      0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13,
      0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
      0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3,
      0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
      0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5,
      0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
      0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208,
      0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
    ];

    for (let index = 0; index < ascii.length; index += 1) {
      words[index >> 2] |= ascii.charCodeAt(index) << (24 - (index % 4) * 8);
    }

    words[bitLength >> 5] |= 0x80 << (24 - bitLength % 32);
    words[(((bitLength + 64) >> 9) << 4) + 15] = bitLength;

    for (let offset = 0; offset < words.length; offset += 16) {
      const schedule = new Array(64);

      for (let index = 0; index < 16; index += 1) {
        schedule[index] = words[offset + index] | 0;
      }

      for (let index = 16; index < 64; index += 1) {
        const gamma0x = schedule[index - 15];
        const gamma1x = schedule[index - 2];
        const gamma0 = rightRotate(gamma0x, 7) ^ rightRotate(gamma0x, 18) ^ (gamma0x >>> 3);
        const gamma1 = rightRotate(gamma1x, 17) ^ rightRotate(gamma1x, 19) ^ (gamma1x >>> 10);
        schedule[index] = add32(schedule[index - 16], gamma0, schedule[index - 7], gamma1);
      }

      let a = hash[0];
      let b = hash[1];
      let c = hash[2];
      let d = hash[3];
      let e = hash[4];
      let f = hash[5];
      let g = hash[6];
      let h = hash[7];

      for (let index = 0; index < 64; index += 1) {
        const sigma1 = rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25);
        const choice = (e & f) ^ (~e & g);
        const temp1 = add32(h, sigma1, choice, roundConstants[index], schedule[index]);
        const sigma0 = rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22);
        const majority = (a & b) ^ (a & c) ^ (b & c);
        const temp2 = add32(sigma0, majority);

        h = g;
        g = f;
        f = e;
        e = add32(d, temp1);
        d = c;
        c = b;
        b = a;
        a = add32(temp1, temp2);
      }

      hash[0] = add32(hash[0], a);
      hash[1] = add32(hash[1], b);
      hash[2] = add32(hash[2], c);
      hash[3] = add32(hash[3], d);
      hash[4] = add32(hash[4], e);
      hash[5] = add32(hash[5], f);
      hash[6] = add32(hash[6], g);
      hash[7] = add32(hash[7], h);
    }

    return hash.map((value) => (value >>> 0).toString(16).padStart(8, "0")).join("");
  }

  function rightRotate(value, amount) {
    return (value >>> amount) | (value << (32 - amount));
  }

  function add32() {
    let total = 0;
    for (let index = 0; index < arguments.length; index += 1) {
      total = (total + (arguments[index] | 0)) | 0;
    }
    return total;
  }

  async function unlockDashboard(password) {
    const expectedHash = String(window.PLANNER_CTX.dashboardPasswordHash || "").trim().toLowerCase();
    if (!expectedHash) {
      throw new Error("Dashboard password is not configured yet.");
    }

    const actualHash = await hashPassword(password.trim());
    if (actualHash !== expectedHash) {
      throw new Error("That password did not match.");
    }

    window.sessionStorage.setItem(STORAGE_KEYS.auth, "true");
    window.sessionStorage.setItem(STORAGE_KEYS.authHash, actualHash);
    refreshViewer();
    await maybeLoadPlannerData();
  }

  function requirePlannerAccess() {
    if (!viewerProfile.isAdmin) {
      throw new Error("Unlock the dashboard first.");
    }
  }

  async function fetchJsonp(url) {
    return new Promise((resolve, reject) => {
      const callbackName = `plannerFeed${Date.now()}${Math.random().toString(36).slice(2, 8)}`;
      const script = document.createElement("script");
      const separator = url.includes("?") ? "&" : "?";

      const cleanup = () => {
        delete window[callbackName];
        script.remove();
      };

      window[callbackName] = (payload) => {
        cleanup();
        resolve(payload);
      };

      script.onerror = () => {
        cleanup();
        reject(new Error("Unable to load the RSVP feed."));
      };

      script.src = `${url}${separator}callback=${callbackName}`;
      document.body.appendChild(script);
    });
  }

  function normalizeRsvps(payload) {
    const items = Array.isArray(payload?.responses) ? payload.responses : [];
    return items.map((item) => ({
      submittedAt: String(item.submittedAt || ""),
      name: String(item.name || ""),
      email: String(item.email || ""),
      attending: String(item.attending || ""),
      guests: String(item.guests || ""),
      comment: String(item.comment || "")
    }));
  }

  function normalizeGuests(payload) {
    const items = Array.isArray(payload?.guests) ? payload.guests : [];
    return items
      .map((item) => {
        if (!item || typeof item !== "object" || Array.isArray(item)) {
          return null;
        }

        return Object.fromEntries(
          Object.entries(item).map(([key, value]) => [String(key || "").trim(), String(value || "")])
        );
      })
      .filter((item) => item && Object.keys(item).length);
  }

  function sortTables(items) {
    return [...items].sort((left, right) => {
      const nameDelta = String(left.tableName || "").localeCompare(String(right.tableName || ""), undefined, { numeric: true, sensitivity: "base" });
      if (nameDelta !== 0) {
        return nameDelta;
      }

      return String(left.type || "").localeCompare(String(right.type || ""), undefined, { sensitivity: "base" });
    });
  }

  function getAssignedGuestByTableName(tableName) {
    return cachedGuests
      .filter((row) => getGuestTableNumber(row) === tableName)
      .map((row) => ({
        rowNumber: getGuestRowNumber(row),
        name: getGuestDisplayName(row),
        type: getGuestTypeValue(row),
        attending: getGuestRsvpLabel(row),
        plusOneRsvp: getGuestPlusOneRsvp(row),
        tableNumber: getGuestTableNumber(row),
        tableOrder: getGuestTableOrder(row)
      }))
      .filter((guest) => guest.rowNumber && guest.name)
      .sort((left, right) => {
        const orderDelta = Number(left.tableOrder || 0) - Number(right.tableOrder || 0);
        if (orderDelta !== 0) {
          return orderDelta;
        }
        return left.name.localeCompare(right.name);
      });
  }

  function getEligibleGuestsForTable(table) {
    return cachedGuests
      .map((row) => ({
        rowNumber: getGuestRowNumber(row),
        name: getGuestDisplayName(row),
        type: getGuestTypeValue(row),
        attending: getGuestRsvpLabel(row),
        plusOneRsvp: getGuestPlusOneRsvp(row),
        tableNumber: getGuestTableNumber(row)
      }))
      .filter((guest) => guest.rowNumber && guest.name)
      .filter((guest) => getTableTypes(table).includes(guest.type))
      .filter((guest) => getRsvpGroup(guest.attending) === "yes")
      .filter((guest) => !guest.tableNumber)
      .sort((left, right) => left.name.localeCompare(right.name));
  }

  async function addGuestToTable(table, guestRowNumber) {
    const tableName = String(table.tableName || "").trim();
    const nextRowNumber = Number(guestRowNumber || 0);
    if (!tableName || !nextRowNumber) {
      return;
    }

    const existingAssignments = getAssignedGuestByTableName(tableName);
    const nextOrder = (existingAssignments.reduce((maxOrder, guest) => Math.max(maxOrder, Number(guest.tableOrder || 0)), 0) || 0) + 1;

    await rpcRequest("saveGuestTableAssignment", {
      rowNumber: nextRowNumber,
      tableName,
      tableOrder: nextOrder
    });

    const nextGuest = cachedGuests.find((row) => getGuestRowNumber(row) === nextRowNumber);
    if (nextGuest) {
      const nextGuestTableColumn = findGuestColumn(nextGuest, /^table\s*(number|#)?$/i);
      const nextGuestOrderColumn = findGuestColumn(nextGuest, /^table\s*order$/i);
      if (nextGuestTableColumn) {
        nextGuest[nextGuestTableColumn] = tableName;
      }
      if (nextGuestOrderColumn) {
        nextGuest[nextGuestOrderColumn] = String(nextOrder);
      }
    }

  }

  async function removeGuestFromTable(button) {
    const rowNumber = Number(button.dataset.rowNumber || 0);
    if (!rowNumber) {
      return;
    }

    await rpcRequest("saveGuestTableAssignment", {
      rowNumber,
      tableName: "",
      tableOrder: ""
    });

    const guest = cachedGuests.find((row) => getGuestRowNumber(row) === rowNumber);
    if (guest) {
      const guestTableColumn = findGuestColumn(guest, /^table\s*(number|#)?$/i);
      const guestOrderColumn = findGuestColumn(guest, /^table\s*order$/i);
      if (guestTableColumn) {
        guest[guestTableColumn] = "";
      }
      if (guestOrderColumn) {
        guest[guestOrderColumn] = "";
      }
    }
  }

  function getRsvpGroup(attending) {
    const normalized = String(attending || "").trim().toLowerCase();
    if (normalized === "yes" || normalized === "attending") return "yes";
    if (normalized === "no" || normalized === "not attending" || normalized === "declined") return "no";
    return "maybe";
  }

  function getRsvpLabel(group) {
    if (group === "yes") return "Attending";
    if (group === "no") return "Not Attending";
    return "Maybe";
  }

  function formatRsvpMeta(rsvp) {
    return [
      getRsvpLabel(getRsvpGroup(rsvp.attending)),
      rsvp.plusOneRsvp ? `Plus 1: ${rsvp.plusOneRsvp}` : "",
      rsvp.tableNumber ? `Table ${rsvp.tableNumber}` : "",
      rsvp.guests ? `${rsvp.guests} guest${String(rsvp.guests) === "1" ? "" : "s"}` : "",
      rsvp.email || "",
      rsvp.submittedAt ? new Date(rsvp.submittedAt).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : ""
    ].filter(Boolean).join(" | ");
  }

  async function refreshRsvps() {
    const feedUrl = String(window.PLANNER_CTX.rsvpFeedUrl || "").trim();
    if (!feedUrl) {
      rsvpFeedConnected = false;
      cachedRsvps = [];
      cachedGuests = [];
      renderRsvps();
      renderGuests();
      renderTables();
      renderTableTypeOptions();
      renderSummary();
      setStatus(rsvpStatusEl, "No RSVP feed URL configured yet.", "error");
      setStatus(guestsStatusEl, "No Guests feed URL configured yet.", "error");
      setStatus(plannerSyncStatusEl, "Planner sheets are not connected because the Apps Script URL is missing.", "error");
      return;
    }

    try {
      const payload = await fetchJsonp(feedUrl);
      rsvpFeedConnected = true;
      cachedRsvps = normalizeRsvps(payload);
      cachedGuests = normalizeGuests(payload);
      renderRsvps();
      renderGuests();
      renderTables();
      renderTableTypeOptions();
      renderSummary();
      setStatus(rsvpStatusEl, `Loaded ${getDashboardRsvps().length} RSVP rows from Guests.`, "success");
      setStatus(guestsStatusEl, `Loaded ${cachedGuests.length} rows from Guests.`, "success");
      setStatus(plannerSyncStatusEl, "Spreadsheet feed connected. People and events sync through the planner backend.", "success");
    } catch (error) {
      rsvpFeedConnected = false;
      cachedRsvps = [];
      cachedGuests = [];
      renderRsvps();
      renderGuests();
      renderTables();
      renderTableTypeOptions();
      renderSummary();
      setStatus(rsvpStatusEl, error.message || "Unable to load RSVPs.", "error");
      setStatus(guestsStatusEl, error.message || "Unable to load Guests.", "error");
      setStatus(plannerSyncStatusEl, "Dashboard unlocked, but the spreadsheet feed could not be reached.", "error");
    }
  }

      await refreshPlannerCollections();
      setStatus(todoStatusEl, "Task saved to Google Sheets.", "success");
      window.setTimeout(() => {
        closeTodoModal();
      }, 300);
    } catch (error) {
      setStatus(todoStatusEl, error.message || "Unable to save task.", "error");
    }
  });

  refreshRsvpsButton.addEventListener("click", async () => {
    try {
      requirePlannerAccess();
      setStatus(rsvpStatusEl, "Refreshing RSVPs...", "pending");
      await refreshRsvps();
    } catch (error) {
      setStatus(rsvpStatusEl, error.message || "Unable to refresh RSVPs.", "error");
    }
  });

  guestTypeFilterEl?.addEventListener("change", (event) => {
    selectedGuestType = String(event.target.value || "");
    renderGuests();
  });

  eventDateFilterEl?.addEventListener("change", (event) => {
    selectedEventDate = String(event.target.value || "");
    renderEvents();
  });

  eventAssignedToFilterEl?.addEventListener("change", (event) => {
    selectedEventAssignedTo = String(event.target.value || "");
    renderEvents();
  });

  openPersonModalButton.addEventListener("click", () => {
    setActivePlannerPanel("people");
    openPersonModal("Add Person");
  });

  openEventModalButton.addEventListener("click", () => {
    setActivePlannerPanel("events");
    openEventModal("Add Event");
  });

  openTodoModalButton.addEventListener("click", () => {
    setActivePlannerPanel("todos");
    openTodoModal("Add Task");
  });

  openTableModalButton.addEventListener("click", () => {
    setActivePlannerPanel("tables");
    openTableModal();
  });

  tableForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    try {
      requirePlannerAccess();
      setStatus(tableStatusEl, "Saving table...", "pending");
      const data = Object.fromEntries(new FormData(tableForm).entries());
      const selectedTypes = Array.from(tableForm.querySelectorAll('input[name="type"]:checked'))
        .map((input) => String(input.value || "").trim())
        .filter(Boolean);
      if (!selectedTypes.length) {
        throw new Error("Select at least one type.");
      }
      await rpcRequest("saveTable", {
        tableName: String(data.tableName || "").trim(),
        type: selectedTypes.join(", "),
        count: Number(data.count || 0)
      });
      tableForm.reset();
      await refreshPlannerCollections();
      setStatus(tableStatusEl, "Table saved to Google Sheets.", "success");
      setActivePlannerPanel("tables");
      window.setTimeout(() => {
        closeTableModal();
        setStatus(tableStatusEl, "Table saved to Google Sheets.", "success");
      }, 250);
    } catch (error) {
      setStatus(tableStatusEl, error.message || "Unable to save table.", "error");
    }
  });

  addGuestForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    try {
      requirePlannerAccess();
      if (!activeTableForGuestModal) {
        throw new Error("Select a table first.");
      }
      setStatus(addGuestStatusEl, "Saving table assignment...", "pending");
      const data = Object.fromEntries(new FormData(addGuestForm).entries());
      await addGuestToTable(activeTableForGuestModal, data.guestRowNumber);
      renderRsvps();
      renderGuests();
      renderTables();
      renderSummary();
      setStatus(tableStatusEl, "Table assignment saved.", "success");
      closeAddGuestModal();
    } catch (error) {
      setStatus(addGuestStatusEl, error.message || "Unable to add guest to table.", "error");
    }
  });

  document.querySelector("[data-reset-person]").addEventListener("click", () => {
    clearPersonForm();
  });

  document.querySelectorAll("[data-close-person-modal]").forEach((button) => {
    button.addEventListener("click", () => {
      closePersonModal();
    });
  });

  document.querySelector("[data-reset-event]").addEventListener("click", () => {
    clearEventForm();
  });

  document.querySelectorAll("[data-close-event-modal]").forEach((button) => {
    button.addEventListener("click", () => {
      closeEventModal();
    });
  });

  document.querySelector("[data-reset-bed]").addEventListener("click", () => {
    clearBedForm();
  });

  document.querySelectorAll("[data-close-bed-modal]").forEach((button) => {
    button.addEventListener("click", () => {
      closeBedModal();
    });
  });

  document.querySelector("[data-reset-todo]").addEventListener("click", () => {
    clearTodoForm();
  });

  document.querySelectorAll("[data-close-todo-modal]").forEach((button) => {
    button.addEventListener("click", () => {
      closeTodoModal();
    });
  });

  document.querySelectorAll("[data-close-table-modal]").forEach((button) => {
    button.addEventListener("click", () => {
      closeTableModal();
    });
  });

  document.querySelectorAll("[data-close-add-guest-modal]").forEach((button) => {
    button.addEventListener("click", () => {
      closeAddGuestModal();
    });
  });

  peopleListEl.addEventListener("click", (event) => {
    const button = event.target.closest("[data-edit-person]");
    if (!button) return;
    const person = cachedPeople.find((item) => item.id === button.dataset.editPerson);
    if (!person) return;
    setActivePlannerPanel("people");
    openPersonModal("Edit Person", person);
    setStatus(personStatusEl, `Editing ${person.name}.`, "success");
  });

  eventsListEl.addEventListener("click", (event) => {
    const button = event.target.closest("[data-edit-event]");
    if (!button) return;
    const eventItem = cachedEvents.find((item) => item.id === button.dataset.editEvent);
    if (!eventItem) return;
    setActivePlannerPanel("events");
    openEventModal("Edit Event", {
      ...eventItem,
      date: String(eventItem.date || "").trim(),
      startsAt: String(eventItem.startsAt || "").trim(),
      main: eventItem.main ? "true" : "false",
      active: eventItem.active ? "true" : "false"
    });
    setStatus(eventStatusEl, `Editing ${eventItem.title}.`, "success");
  });

  todosListEl.addEventListener("click", (event) => {
    const button = event.target.closest("[data-edit-todo]");
    if (!button) return;
    const todo = cachedTodos.find((item) => item.id === button.dataset.editTodo);
    if (!todo) return;
    setActivePlannerPanel("todos");
    openTodoModal("Edit Task", {
      ...todo,
      isComplete: todo.isComplete ? "true" : "false"
    });
    setStatus(todoStatusEl, `Editing ${todo.title}.`, "success");
  });

  bedsListEl.addEventListener("click", (event) => {
    const button = event.target.closest("[data-edit-bed]");
    if (!button) return;
    const bed = cachedBeds.find((item) => item.id === button.dataset.editBed);
    if (!bed) return;
    setActivePlannerPanel("beds");
    openBedModal("Edit Bed", bed);
    setStatus(bedStatusEl, `Editing ${bed.lodging} ${bed.room} ${bed.bedLabel}.`, "success");
  });

  bedsListEl.addEventListener("change", async (event) => {
    const input = event.target.closest("[data-bed-field]");
    if (!input) return;

    try {
      await flushBedInputSave(input);
    } catch (error) {
      setStatus(bedsInlineStatusEl, error.message || "Unable to save bed assignment.", "error");
    }
  });

  bedsListEl.addEventListener("input", (event) => {
    const input = event.target.closest("[data-bed-field]");
    if (!input) return;
    scheduleBedInputSave(input);
  });

  bedsListEl.addEventListener("focusout", async (event) => {
    const input = event.target.closest("[data-bed-field]");
    if (!input) return;

    try {
      await flushBedInputSave(input);
    } catch (error) {
      setStatus(bedsInlineStatusEl, error.message || "Unable to save bed assignment.", "error");
    }
  });

  bedsListEl.addEventListener("keydown", async (event) => {
    const input = event.target.closest("[data-bed-field]");
    if (!input || event.key !== "Enter") return;

    event.preventDefault();
    input.blur();

    try {
      await flushBedInputSave(input);
    } catch (error) {
      setStatus(bedsInlineStatusEl, error.message || "Unable to save bed assignment.", "error");
    }
  });

  tablesListEl.addEventListener("click", async (event) => {
    const openButton = event.target.closest("[data-open-add-guest-modal]");
    if (openButton) {
      const table = cachedTables.find((item) => item.id === openButton.dataset.tableId);
      if (!table) return;
      openAddGuestModal(table);
      return;
    }

    const button = event.target.closest("[data-remove-table-guest]");
    if (!button) return;

    try {
      requirePlannerAccess();
      setStatus(tableStatusEl, "Removing table assignment...", "pending");
      await removeGuestFromTable(button);
      renderRsvps();
      renderGuests();
      renderTables();
      renderSummary();
      setStatus(tableStatusEl, "Guest removed from table.", "success");
    } catch (error) {
      setStatus(tableStatusEl, error.message || "Unable to remove guest from table.", "error");
      await refreshRsvps();
    }
  });

  routeLinks.forEach((link) => {
    link.addEventListener("click", (event) => {
      const route = link.dataset.routeLink;
      if (!route) return;
      event.preventDefault();
      navigateTo(route);
    });
  });

  plannerSectionButtons.forEach((button) => {
    button.addEventListener("click", () => {
      setActivePlannerPanel(button.dataset.plannerSection);
    });
  });

  window.addEventListener("popstate", () => {
    currentView = getRequestedView();
    renderRoute();
    maybeLoadPlannerData();
  });

  window.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && !personModal.hidden) {
      closePersonModal();
      return;
    }

    if (event.key === "Escape" && !eventModal.hidden) {
      closeEventModal();
      return;
    }

    if (event.key === "Escape" && !bedModal.hidden) {
      closeBedModal();
      return;
    }

    if (event.key === "Escape" && !todoModal.hidden) {
      closeTodoModal();
      return;
    }

    if (event.key === "Escape" && !tableModal.hidden) {
      closeTableModal();
      return;
    }

    if (event.key === "Escape" && !addGuestModal.hidden) {
      closeAddGuestModal();
    }
  });

  window.addEventListener("load", async () => {
    refreshViewer();
    renderRoute();
    await maybeLoadPlannerData();
  });
</script>
