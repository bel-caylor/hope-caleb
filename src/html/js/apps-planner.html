  function renderWorkspace() {
    if (!workspaceCalendarEl) return;
    document.querySelectorAll("[data-workspace-manager-only]").forEach((element) => {
      element.hidden = !viewerProfile.isAdmin;
    });
    if (openCalendarEventModalButton) openCalendarEventModalButton.hidden = !viewerProfile.isAdmin;

    const datedEvents = cachedWorkspaceEvents
      .map((event) => ({ event, date: parseWorkspaceDate(event.startsAt) }))
      .filter((item) => item.date);
    const selectedDate = parseWorkspaceDate(selectedWorkspaceCalendarDate);
    const fallbackAnchor = datedEvents[0]?.date || new Date();
    const anchor = selectedDate || fallbackAnchor;
    const monthStart = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
    if (workspaceCalendarTitleEl) workspaceCalendarTitleEl.textContent = "Calendar";

    const renderCalendarDay = (day, outsideRange = false) => {
      const events = datedEvents.filter(({ date }) => date.getFullYear() === day.getFullYear() && date.getMonth() === day.getMonth() && date.getDate() === day.getDate());
      const holiday = getWorkspaceCalendarHoliday(day);
      return `
        <div class="workspace-calendar__day ${outsideRange ? "workspace-calendar__day--outside" : ""} ${holiday ? "workspace-calendar__day--holiday" : ""}" data-workspace-calendar-date="${workspaceDateKey(day)}">
          <button class="workspace-calendar__date" type="button" data-workspace-calendar-date="${workspaceDateKey(day)}" aria-label="View ${escapeHtml(formatWorkspaceDay(day))}">${day.getDate()}${day.getDate() === 1 ? `<span class="workspace-calendar__month-label"><span class="workspace-calendar__month-label-full">${escapeHtml(day.toLocaleDateString(undefined, { month: "long" }))}</span><span class="workspace-calendar__month-label-short" aria-hidden="true">${escapeHtml(day.toLocaleDateString(undefined, { month: "short" }))}</span></span>` : ""}</button>
          ${holiday ? `<span class="workspace-calendar__holiday"><span class="workspace-calendar__holiday-full">${escapeHtml(holiday)}</span><span class="workspace-calendar__holiday-short" aria-hidden="true">${escapeHtml(getWorkspaceCalendarHolidayShortLabel(holiday))}</span></span>` : ""}
          ${events.map(({ event }) => `<button class="workspace-calendar__event" type="button" data-open-workspace-event="${escapeHtml(event.id)}" title="Open ${escapeHtml(event.title || "Untitled event")}">${escapeHtml(event.title || "Untitled event")}</button>`).join("")}
        </div>
      `;
    };
    const months = [...new Map(datedEvents.map(({ date }) => {
        const start = new Date(date.getFullYear(), date.getMonth(), 1);
        return [workspaceDateKey(start), start];
      })).values()].sort((left, right) => left.getTime() - right.getTime());
    workspaceCalendarEl.classList.remove("workspace-calendar--month-list");
    const firstMonth = months[0] || monthStart;
    const lastMonth = months[months.length - 1] || monthStart;
    const gridStart = new Date(firstMonth);
    gridStart.setDate(gridStart.getDate() - gridStart.getDay());
    const gridEnd = new Date(lastMonth.getFullYear(), lastMonth.getMonth() + 1, 0);
    gridEnd.setDate(gridEnd.getDate() + (6 - gridEnd.getDay()));
    const weekdays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const cells = weekdays.map((day) => `<span class="workspace-calendar__weekday">${day}</span>`);
    for (const day = new Date(gridStart); day <= gridEnd; day.setDate(day.getDate() + 1)) {
      const outsideRange = day < firstMonth || day > new Date(lastMonth.getFullYear(), lastMonth.getMonth() + 1, 0);
      cells.push(renderCalendarDay(new Date(day), outsideRange));
    }
    workspaceCalendarEl.innerHTML = cells.join("");

    renderWorkspaceEventDirectory();
    setWorkspaceCalendarView(activeWorkspaceCalendarView);
    if (!selectedWorkspaceEventId) setWorkspaceHubView(activeWorkspaceHubView);
    renderWorkspaceEventPage();
  }

  function toWorkspaceDateTime(date, time) {
    const normalizedDate = String(date || "").trim();
    const normalizedTime = String(time || "").trim() || "09:00";
    return normalizedDate ? `${normalizedDate}T${normalizedTime}` : "";
  }

  function splitWorkspaceDateTime(value) {
    const raw = String(value || "").trim();
    const matched = raw.match(/^(\d{4}-\d{2}-\d{2})[T\s](\d{2}:\d{2})/);
    if (matched) return { date: matched[1], time: matched[2] };
    const parsed = parseWorkspaceDate(raw);
    if (!parsed) return { date: "", time: "" };
    return {
      date: `${parsed.getFullYear()}-${String(parsed.getMonth() + 1).padStart(2, "0")}-${String(parsed.getDate()).padStart(2, "0")}`,
      time: `${String(parsed.getHours()).padStart(2, "0")}:${String(parsed.getMinutes()).padStart(2, "0")}`
    };
  }

  function compareGuestsByLastName(left, right) {
    const fullName = (guest) => String(guest?.name || "").trim();
    const lastName = (guest) => fullName(guest).split(/\s+/).at(-1) || "";
    return lastName(left).localeCompare(lastName(right)) || fullName(left).localeCompare(fullName(right));
  }

  function renderWorkspaceEventInvitees(event) {
    const selection = parseWorkspaceInvitationSelection(event.invitees);
    const groups = Array.isArray(cachedWorkspaceInvitees.groups) ? cachedWorkspaceInvitees.groups : [];
    const guests = getWorkspaceInviteeGuestChoices();
    const selectedGroups = new Set(selection.groups.map((group) => group.toLowerCase()));
    const selectedIndividuals = new Set(selection.individuals.map((name) => name.toLowerCase()));
    const invitedGuests = guests
      .filter((guest) => selectedIndividuals.has(String(guest.name || "").toLowerCase()) || (guest.types || []).some((type) => selectedGroups.has(String(type || "").toLowerCase())))
      .sort(compareGuestsByLastName);

    return `
      <div class="workspace-invitees">
        <input type="hidden" name="invitees" value="${escapeHtml(JSON.stringify(selection))}">
        <div class="workspace-invitees__header">
          <h4>Who's invited?</h4>
          <strong class="workspace-invitees__count">${invitedGuests.length} invited</strong>
        </div>
        <div class="workspace-invitees__groups">
          <strong>Include guest groups</strong>
          <div class="workspace-invitees__choices workspace-invitees__choices--groups">
            ${groups.length ? groups.map((group) => `<label class="workspace-invitees__choice"><input type="checkbox" data-workspace-event-invitee-group value="${escapeHtml(group)}" ${selectedGroups.has(String(group).toLowerCase()) ? "checked" : ""}>${escapeHtml(group)}</label>`).join("") : '<span class="meta">No guest groups are available yet.</span>'}
          </div>
        </div>
        <div class="workspace-invitees__add">
          <label>Add an individual guest
            <select data-workspace-event-invitee-guest><option value="">Choose a guest…</option>${guests.map((guest) => `<option value="${escapeHtml(guest.name)}">${escapeHtml(guest.name)}</option>`).join("")}</select>
          </label>
          <button class="button button--light" type="button" data-add-workspace-event-invitee>Add guest</button>
        </div>
        ${invitedGuests.length ? `<details open><summary>View invited guests</summary><ul class="workspace-invitees__guest-list">${invitedGuests.map((guest) => {
            const name = String(guest.name || "").trim();
            const includedByGroup = (guest.types || []).some((type) => selectedGroups.has(String(type || "").toLowerCase()));
            const individuallyAdded = selectedIndividuals.has(name.toLowerCase());
            return `<li class="workspace-invitees__guest ${individuallyAdded && !includedByGroup ? "workspace-invitees__guest--removable" : ""}">${escapeHtml(name)}${individuallyAdded && !includedByGroup ? `<button type="button" class="workspace-invitees__remove" data-remove-workspace-event-invitee="${escapeHtml(name)}" aria-label="Remove ${escapeHtml(name)}">×</button>` : ""}</li>`;
          }).join("")}</ul></details>` : '<p class="meta">Select a group or add an individual guest.</p>'}
      </div>
    `;

  function workspaceFallbackTasks(title) {
    const normalizedTitle = String(title || "this event").trim();
    if (!/breakfast|brunch/i.test(normalizedTitle)) {
      return [
        `Confirm the guest count for ${normalizedTitle}`,
        "Confirm the event details, supplies, and budget",
        "Confirm the location, setup, and cleanup plan",
        "Assign day-of responsibilities",
        "Send the final reminder before the event"
      ];
    }
    return [
      `Confirm the guest count for ${normalizedTitle}`,
      "Collect dietary needs or breakfast preferences",
      "Choose the food plan and set a budget",
      "Confirm the serving location, setup, and cleanup plan",
      "Assign food, setup, and cleanup responsibilities",
      "Send the final reminder the evening before"
    ];
  }

  function getWorkspaceInviteeGuestChoices() {
    const backendChoices = Array.isArray(cachedWorkspaceInvitees.guests) ? cachedWorkspaceInvitees.guests : [];
    if (backendChoices.length) return [...backendChoices].sort(compareGuestsByLastName);

    const guestsByName = new Map();
    cachedGuests.forEach((guest) => {
      const name = getGuestDisplayName(guest);
      if (!name) return;
      const key = name.toLowerCase();
      const types = getGuestTypeValue(guest).split(",").map((type) => type.trim()).filter(Boolean);
      const existing = guestsByName.get(key);
      guestsByName.set(key, {
        name: existing?.name || name,
        types: [...new Set([...(existing?.types || []), ...types])]
      });
    });
    return [...guestsByName.values()].sort(compareGuestsByLastName);
  }

  function getPlannerUserGuestChoices() {
    const guestsByName = new Map();
    const addGuest = (id, name, email = "", phone = "", types = []) => {
      const normalizedName = String(name || "").trim();
      if (!normalizedName) return;
      const key = normalizedName.toLowerCase();
      const existing = guestsByName.get(key);
      const normalizedTypes = Array.isArray(types)
        ? types.map((type) => String(type || "").trim()).filter(Boolean)
        : String(types || "").split(",").map((type) => type.trim()).filter(Boolean);
      guestsByName.set(key, {
        id: existing?.id || String(id || "").trim(),
        name: existing?.name || normalizedName,
        email: existing?.email || String(email || "").trim(),
        phone: existing?.phone || String(phone || "").trim(),
        types: [...new Set([...(existing?.types || []), ...normalizedTypes])]
      });
    };

    (Array.isArray(cachedWorkspaceInvitees.guests) ? cachedWorkspaceInvitees.guests : [])
      .forEach((guest) => addGuest(guest?.id, guest?.name, guest?.email, guest?.phone, guest?.types));
    cachedGuests.forEach((guest) => addGuest("", getGuestDisplayName(guest), getGuestEmail(guest), getGuestPhone(guest), getGuestTypeValue(guest)));

    return [...guestsByName.values()].sort((left, right) => left.name.localeCompare(right.name));
  }

      ${needsEmail ? `<label>Google account email <input name="email" type="email" required value="${escapeHtml(existingEmail)}" placeholder="name@gmail.com"></label>` : ""}
      ${needsPhone ? `<label>Mobile number <input name="phone" type="tel" required value="${escapeHtml(existingPhone)}" placeholder="+12105551234"></label>` : ""}
    `;
    return true;
  }

      .filter((guest) => selectedIndividuals.has(String(guest.name || "").toLowerCase()) || (guest.types || []).some((type) => selectedGroups.has(String(type || "").toLowerCase())))

  function parseWorkspaceInvitationSelection(value) {
    try {
      const parsed = JSON.parse(String(value || ""));
      if (parsed && typeof parsed === "object") {
        return {
          groups: Array.isArray(parsed.groups) ? parsed.groups.map((item) => String(item || "").trim()).filter(Boolean) : [],
          individuals: Array.isArray(parsed.individuals) ? parsed.individuals.map((item) => String(item || "").trim()).filter(Boolean) : []
        };
      }
    } catch (_) {}
    return { groups: [], individuals: String(value || "").split(/[,\n;]+/).map((item) => item.trim()).filter(Boolean) };

  function toggleWorkspaceInlineVoiceInput(input, button, key, fallbackLabel) {
    if (!input || !button) return;
    if (!EventWorkspaceSpeechRecognition) {
      setStatus(workspaceStatusEl, "Voice input works in supported browsers such as Chrome. You can type this instead.", "pending");
      return;
    }
    const activeRecognition = workspaceInlineVoiceRecognitions.get(key);
    if (activeRecognition) {
      activeRecognition.__stoppedManually = true;
      activeRecognition.stop();
      return;
    }
    const recognition = new EventWorkspaceSpeechRecognition();
    recognition.lang = "en-US";
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;
    recognition.__stoppedManually = false;
    recognition.__baseValue = String(input.value || "").trim();
    recognition.__transcript = "";
    recognition.__finalResultValues = new Map();
    workspaceInlineVoiceRecognitions.set(key, recognition);
    recognition.onstart = () => {
      stopVoiceInputAfterListeningWindow(recognition);
      recognition.__baseValue = String(input.value || "").trim();
      recognition.__transcript = "";
      recognition.__finalResultValues = new Map();
      button.classList.add("is-listening");
      button.setAttribute("aria-label", `Stop voice input for ${fallbackLabel}`);
      button.title = "Stop recording";
    };
    recognition.onresult = (resultEvent) => {
      let interimTranscript = "";
      for (let index = resultEvent.resultIndex || 0; index < resultEvent.results.length; index += 1) {
        const result = resultEvent.results[index];
        const transcript = String(result?.[0]?.transcript || "").trim();
        if (result.isFinal) {
          if (isNewFinalSpeechResult(recognition, index, transcript)) recognition.__transcript = mergeVoiceTranscriptIntoNotes(recognition.__transcript, transcript);
        } else {
          interimTranscript = mergeVoiceTranscriptIntoNotes(interimTranscript, transcript);
        }
      }
      const voiceValue = mergeVoiceTranscriptIntoNotes(
        recognition.__baseValue,
        mergeVoiceTranscriptIntoNotes(recognition.__transcript, interimTranscript)
      );
      input.value = normalizeVoiceTextForInput(input, voiceValue);
      input.dispatchEvent(new Event("input", { bubbles: true }));
    };
    recognition.onerror = (errorEvent) => {
      clearVoiceInputListeningWindow(recognition);
      if (["not-allowed", "service-not-allowed", "audio-capture"].includes(String(errorEvent.error || ""))) {
        recognition.__stoppedManually = true;
        setStatus(workspaceStatusEl, `Microphone access was not available. You can type the ${fallbackLabel} instead.`, "error");
      }
    };
    recognition.onend = () => {
      clearVoiceInputListeningWindow(recognition);
      if (!recognition.__stoppedManually) {
        try {
          recognition.start();
          return;
        } catch (_) {
          recognition.__stoppedManually = true;
        }
      }
      if (workspaceInlineVoiceRecognitions.get(key) === recognition) workspaceInlineVoiceRecognitions.delete(key);
      button.classList.remove("is-listening");
      button.setAttribute("aria-label", `Start voice input for ${fallbackLabel}`);
      button.title = "Use microphone";
    };
    recognition.start();
  }

  async function refineWorkspaceDraftTasks(instruction) {
    if (!workspaceDraftState || !instruction) return;
    syncWorkspaceDraftTasksFromReview();
    const draft = workspaceDraftState;
    const currentTasks = (draft.todos || []).map((task) => `- ${task.title}`).join("\n") || "None";
    draft.taskRefinementPrompt = instruction;
    setStatus(workspaceStatusEl, "AI is revising the suggested tasks…", "pending");
    try {
      const plan = await backendRequest("generateEventPlan", {
        title: draft.title,
        date: String(draft.startsAt || "").slice(0, 10),
        startsAt: String(draft.startsAt || "").slice(11, 16),
        location: draft.location,
        notes: draft.notes,
        planningNotes: `Current suggested tasks:\n${currentTasks}\n\nRequested changes:\n${instruction}`,
        goals: ["todo items"],
        systemPrompt: "You revise a wedding-event task list. Follow the requested changes exactly when practical. Return only concise, actionable tasks; do not add shopping lists or shot ideas.",
        userPrompt: `Revise the task list for \"${draft.title}\".\n\nCurrent tasks:\n${currentTasks}\n\nRequested changes:\n${instruction}`
      });
      if (plan?.error || !Array.isArray(plan?.todos) || !plan.todos.length) {
        throw new Error("AI could not revise the tasks right now. You can still edit the task names directly.");
      }
      workspaceDraftState.todos = plan.todos.map((task) => ({ ...task, selected: true }));
      renderWorkspaceDraft();
      setStatus(workspaceStatusEl, "Task suggestions updated. Review them before creating the event page.", "success");
    } catch (error) {
      setStatus(workspaceStatusEl, error.message || "AI could not revise the tasks right now.", "error");
    }
  }

  function makeWorkspaceDraft(prompt) {
    if (workspaceCaptureRecognition) {
      workspaceCaptureRecognition.__stoppedManually = true;
      workspaceCaptureRecognition.stop();
    }
    const guessed = guessEventFormValuesFromPrompt(prompt);
    const title = guessed.title || "New event";
    const startsAt = toWorkspaceDateTime(guessed.date, guessed.startsAt);
    if (!startsAt) {
      throw new Error("Include a date and time so I can schedule the event.");
    }
    setStatus(workspaceStatusEl, "", "");
    workspaceDraftState = {
      title,
      startsAt,
      location: guessed.location || (/venue/i.test(prompt) ? "Venue" : ""),
      audience: "wedding_party",
      invitees: "",
      notes: "",
      todos: []
    };
    renderWorkspaceDraft();
  }

  async function saveWorkspaceDraft(event) {
    event.preventDefault();
    if (!workspaceDraftState) return;
    const form = event.currentTarget;
    const data = Object.fromEntries(new FormData(form).entries());
    try {
      requirePlannerAccess();
      const now = new Date().toISOString();
      const optimisticEvent = {
        id: createClientId("workspace_event"),
        title: String(data.title || "").trim(),
        startsAt: String(data.startsAt || "").trim(),
        location: String(data.location || "").trim(),
        audience: "wedding_party",
        invitees: String(new FormData(form).get("invitees") || "").trim(),
        notes: String(data.notes || "").trim(),
        assignedUserIds: [],
        createdAt: now,
        updatedAt: now
      };

      upsertCachedWorkspaceEvent(optimisticEvent);
      savePlannerSessionCache();
      workspaceDraftState = null;
      selectedWorkspaceEventId = "";
      window.sessionStorage.removeItem(STORAGE_KEYS.workspaceEventId);
      window.sessionStorage.removeItem(STORAGE_KEYS.workspaceEventTab);
      if (workspaceDraftEl) workspaceDraftEl.hidden = true;
      setActivePlannerPanel("calendar");
      renderWorkspace();
      setStatus(calendarStatusEl, "Event added to your calendar. Saving in the background…", "pending");

      void (async () => {
        try {
          const savedEvent = await backendRequest("saveWorkspaceEvent", optimisticEvent);
          upsertCachedWorkspaceEvent(savedEvent);
          savePlannerSessionCache();
          renderWorkspace();
          setStatus(calendarStatusEl, "Event saved.", "success");
        } catch (error) {
          cachedWorkspaceEvents = cachedWorkspaceEvents.filter((item) => String(item.id || "") !== optimisticEvent.id);
          savePlannerSessionCache();
          renderWorkspace();
          setStatus(calendarStatusEl, error.message || "Unable to save this event.", "error");
        }
      })();
    } catch (error) {
      setStatus(workspaceStatusEl, error.message || "Unable to create this event.", "error");
    }
  }

  function renderWorkspaceEventPage() {
    if (!workspaceEventPageEl || !workspaceEventPageContentEl) return;
    const event = cachedWorkspaceEvents.find((item) => String(item.id || "") === selectedWorkspaceEventId);
    if (!event) {
      window.sessionStorage.removeItem(STORAGE_KEYS.workspaceEventId);
      selectedWorkspaceEventId = "";
      if (activePlannerPanel === "workspace" && plannerPageTitleEl) {
        plannerPageTitleEl.textContent = "Add";
      }
      setWorkspaceHubView(activeWorkspaceHubView);
      workspaceEventPageEl.hidden = true;
      workspaceEventPageEl.classList.remove("workspace-event-page--has-save-bar");
      workspaceStatusEl?.classList.remove("workspace-status--above-save-bar");
      return;
    }
    const isPlanningProject = !String(event.startsAt || "").trim();
    const taskBeingEdited = cachedWorkspaceTasks.find((item) => String(item.id || "") === selectedWorkspaceTaskId) || null;
    if (selectedWorkspaceTaskId && (!taskBeingEdited || String(taskBeingEdited.eventId || "") !== String(event.id || ""))) {
      selectedWorkspaceTaskId = "";
      window.sessionStorage.removeItem(STORAGE_KEYS.workspaceTaskId);
      syncPlannerRoute({ replace: true });
    } else if (taskBeingEdited && activeWorkspaceEventTab !== "tasks") {
      activeWorkspaceEventTab = "tasks";
      window.sessionStorage.setItem(STORAGE_KEYS.workspaceEventTab, activeWorkspaceEventTab);
      syncPlannerRoute({ replace: true });
    }
    const tasks = cachedWorkspaceTasks
      .filter((task) => String(task.eventId || "") === event.id)
      .sort((left, right) => Number(left.sortOrder || 0) - Number(right.sortOrder || 0));
    const lists = cachedWorkspaceLists.filter((list) => String(list.eventId || "") === event.id);
    const taskAssets = (taskId) => cachedWorkspaceAssets.filter((asset) => String(asset.taskId || "") === String(taskId || ""));
    const associatedListForTask = (task) => lists.find((list) => String(list.id || "") === String(task.listId || ""));
    const renderTaskList = (listId) => {

                  return itemIndex;

                renderModalList(savedList);

                moveButton.disabled = false;

  function openWorkspaceEvent(eventId, tab = "details") {
    selectedWorkspaceEventId = String(eventId || "").trim();
    if (!selectedWorkspaceEventId) return;

    activeWorkspaceEventTab = tab;
    window.sessionStorage.setItem(STORAGE_KEYS.workspaceEventId, selectedWorkspaceEventId);
    window.sessionStorage.setItem(STORAGE_KEYS.workspaceEventTab, activeWorkspaceEventTab);
    setActivePlannerPanel("workspace", { recordHistory: false });
    syncPlannerRoute();
    renderWorkspaceEventPage();
    window.requestAnimationFrame(() => window.scrollTo({ top: 0, behavior: "auto" }));
  }

  function upsertCachedWorkspaceTask(savedTask) {
    const id = String(savedTask?.id || "").trim();
    if (!id) return;
    const existingIndex = cachedWorkspaceTasks.findIndex((task) => String(task.id || "") === id);
    if (existingIndex >= 0) {
      cachedWorkspaceTasks[existingIndex] = savedTask;
    } else {
      cachedWorkspaceTasks.push(savedTask);
    }
  }

  function upsertCachedWorkspaceUser(savedUser) {
    const id = String(savedUser?.id || "").trim();
    if (!id) return;
    const existingIndex = cachedWorkspaceUsers.findIndex((user) => String(user.id || "") === id);
    if (existingIndex >= 0) {
      cachedWorkspaceUsers[existingIndex] = savedUser;
    } else {
      cachedWorkspaceUsers.push(savedUser);
    }
  }

  function upsertCachedWorkspaceEvent(savedEvent) {
    const id = String(savedEvent?.id || "").trim();
    if (!id) return;
    const existingIndex = cachedWorkspaceEvents.findIndex((event) => String(event.id || "") === id);
    if (existingIndex >= 0) {
      cachedWorkspaceEvents[existingIndex] = savedEvent;
    } else {
      cachedWorkspaceEvents.push(savedEvent);
    }
  }

  function upsertCachedWorkspaceList(savedList) {
    const id = String(savedList?.id || "").trim();
    if (!id) return;
    const existingIndex = cachedWorkspaceLists.findIndex((list) => String(list.id || "") === id);
    if (existingIndex >= 0) {
      cachedWorkspaceLists[existingIndex] = savedList;
    } else {
      cachedWorkspaceLists.push(savedList);
    }
  }

  async function refreshWorkspaceCollections() {
    // Apps Script serializes work against the spreadsheet poorly when many
    // fresh requests arrive together. Load the startup collections in order
    // so one opening dashboard does not exhaust the proxy/upstream.
    const users = await backendRequest("listWorkspaceUsers", {});
    const events = await backendRequest("listWorkspaceEvents", {});
    const tasks = await backendRequest("listWorkspaceTasks", {});
    const lists = await backendRequest("listWorkspaceLists", {});
    const assets = await backendRequest("listWorkspaceAssets", {});
    cachedWorkspaceUsers = Array.isArray(users) ? users : [];
    cachedWorkspaceEvents = Array.isArray(events) ? events : [];
    cachedWorkspaceTasks = Array.isArray(tasks) ? tasks : [];
    cachedWorkspaceLists = Array.isArray(lists) ? lists : [];
    cachedWorkspaceAssets = Array.isArray(assets) ? assets : [];
    try {
      const invitees = await backendRequest("listWorkspaceInvitees", {});
      cachedWorkspaceInvitees = invitees && typeof invitees === "object" ? invitees : { groups: [], guests: [] };
    } catch (error) {
      cachedWorkspaceInvitees = { groups: [], guests: [] };
      setStatus(workspaceStatusEl, `Guest choices could not load: ${String(error?.message || "unknown backend error")}`, "error");
    }
    renderTodos();
    renderSummary();
    renderWorkspace();
  }

  function getRpcUrl() {
    const scriptBaseUrl = String(window.PLANNER_CTX.scriptBaseUrl || "").trim();
    if (scriptBaseUrl && !scriptBaseUrl.startsWith("<?")) {
      return scriptBaseUrl;
    }
    return String(window.PLANNER_CTX.rsvpFeedUrl || "").trim();
  }

  function getGoogleClientId() {
    return String(window.PLANNER_CTX.googleClientId || "").trim();
  }

  async function handleGoogleCredentialResponse(response) {
    const credential = String(response?.credential || "").trim();
    if (!credential) {
      setStatus(plannerLoginStatusEl, "Google sign-in did not return a credential.", "error");
      return;
    }

    // A Google account may have just been deliberately changed. Do not let a
    // durable Worker session from the previous account win this verification.
    window.localStorage.removeItem(STORAGE_KEYS.sessionToken);
    window.localStorage.setItem(STORAGE_KEYS.authToken, credential);
    window.sessionStorage.setItem(STORAGE_KEYS.authToken, credential);
    googleCredentialPromptPending = false;
    plannerReconnectGoogleButton.hidden = true;
    const cacheShown = showCachedPlannerWhileVerifying(getGoogleCredentialEmail(credential));
    setStatus(plannerLoginStatusEl, "Checking Google account access...", "pending");

    try {
      const hasAccess = await refreshViewer();
      if (!hasAccess) {
        setStatus(
          plannerLoginStatusEl,
          `Signed in as ${viewerProfile.email || "this account"}, but that email has not been invited to the planner yet.`,
          "error"
        );
        return;
      }

      setStatus(plannerLoginStatusEl, "Dashboard access granted.", "success");
      clearStoredGoogleCredential();
      await maybeLoadPlannerData();
      await refreshPlannerVersionInfo();
    } catch (error) {
      if (cacheShown) {
        setStatus(plannerLoginStatusEl, "Showing your saved planner while account verification retries.", "pending");
        setStatus(plannerSyncStatusEl, error.message || "The planner connection is still waking up. Saved data is available.", "pending");
        return;
      }
      // Do not throw away a durable session or saved dashboard merely because
      // Google Sheets/Apps Script had a temporary outage during sign-in.
      if (/Please sign in with Google first|not been invited|account access/i.test(String(error?.message || ""))) {
        clearStoredAuthToken();
      }
      viewerProfile = {
        signedIn: false,
        email: "",
        isAdmin: false
      };
      renderRoute();
      setStatus(plannerLoginStatusEl, error.message || "Unable to verify your Google sign-in.", "error");
    }
  }

  function renderGoogleSignIn() {
    if (!plannerGoogleSignInEl) {
      return;
    }

    const clientId = getGoogleClientId();
    if (!clientId) {
      plannerGoogleSignInEl.replaceChildren();
      setStatus(plannerLoginStatusEl, "Google sign-in is not configured yet. Add GOOGLE_CLIENT_ID before publishing.", "error");
      return;
    }

    if (!window.google?.accounts?.id) {
      plannerGoogleSignInEl.replaceChildren();
      setStatus(plannerLoginStatusEl, "Google sign-in is still loading. Refresh the page if the button does not appear.", "pending");
      return;
    }

    if (!googleSignInReady) {
      window.google.accounts.id.initialize({
        client_id: clientId,
        callback: handleGoogleCredentialResponse,
        // Never silently reuse an account after someone signs out. This is
        // particularly important on shared tablets, where the next person
        // must be able to choose their own Google account.
        auto_select: false,
        cancel_on_tap_outside: false
      });
      googleSignInReady = true;
    }

    plannerGoogleSignInEl.replaceChildren();
    window.google.accounts.id.renderButton(plannerGoogleSignInEl, {
      theme: "outline",
      size: "large",
      shape: "pill",
      text: "signin_with",
      width: 280
    });
  }

  function requestGoogleCredentialRefresh() {
    renderGoogleSignIn();
    // The current dashboard can stay on screen from its local cache while an
    // ID token has expired. Its normal sign-in control is in the hidden
    // sidebar at that point, so expose a direct recovery action in the header.
    plannerReconnectGoogleButton.hidden = false;
    if (!window.google?.accounts?.id?.prompt) return;
    if (googleCredentialPromptPending) return;
    googleCredentialPromptPending = true;

    window.google.accounts.id.prompt((notification) => {
      googleCredentialPromptPending = false;
      if (notification.isNotDisplayed?.() || notification.isSkippedMoment?.() || notification.isDismissedMoment?.()) {
        setStatus(plannerSyncStatusEl, "Google needs your attention. Select Reconnect Google, then choose the invited account.", "pending");
      }
      // A person can suppress One Tap or have multiple Google accounts. The
      // regular button remains visible in that case, with saved planner data
      // left in place rather than treating this as a logout.
    });
  }

  async function backendRequest(method, payload) {
    const rpcUrl = getRpcUrl();
    let authToken = getStoredSessionToken() || getStoredAuthToken();

    if (!rpcUrl) {
      throw new Error("Planner backend URL is not configured yet.");
    }

    const retryableRead = ["getViewerProfile", "getWorkspaceProfile"].includes(method);
    const attempts = retryableRead ? 3 : 1;
    let lastError = null;
    for (let attempt = 0; attempt < attempts; attempt += 1) {
      try {
        const controller = new AbortController();
        // Apps Script may need a cold start, token verification, Drive access,
        // and sheet access on a person's first sign-in. Give that one
        // read-only handshake more time without making ordinary saves wait.
        const longRunningRequest = ["getWorkspaceProfile", "getViewerProfile", "getPlannerBootstrap", "getWorkspaceAssetImage", "saveWorkspaceEvent", "saveWorkspaceTask", "uploadTodoImage", "saveWorkspaceAsset"].includes(method);
        const requestTimeoutMs = longRunningRequest ? 90000 : 20000;
        const requestTimeout = window.setTimeout(() => controller.abort(), requestTimeoutMs);
        const response = await fetch(rpcUrl, {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          signal: controller.signal,
          body: JSON.stringify({
            method,
            payload,
            authToken
          })
        });
        window.clearTimeout(requestTimeout);
        const result = await response.json();
        if (result?.sessionToken) window.localStorage.setItem(STORAGE_KEYS.sessionToken, String(result.sessionToken));
        if (result?.ok) return result.data;

        const message = String(result?.error || "Planner request failed.");
        // A Worker session can expire independently of the Google credential
        // saved by the browser. Retry the read with that credential once,
        // rather than repeatedly submitting the expired session token.
        if (response.status === 401 && /^session\./i.test(authToken) && getStoredAuthToken() && attempt < attempts - 1) {
          window.localStorage.removeItem(STORAGE_KEYS.sessionToken);
          authToken = getStoredAuthToken();
          lastError = new Error(message);
          continue;
        }
        if (/Please sign in with Google first\./i.test(message)) {
          requestGoogleCredentialRefresh();
          throw new Error("Your Google session needs a quick refresh. Your saved dashboard is still available while Google reconnects you.");
        }
        if (retryableRead && attempt < attempts - 1 && /Apps Script upstream returned (404|502|503|504)|Apps Script upstream did not return JSON/i.test(message)) {
          lastError = new Error(message);
          await new Promise((resolve) => window.setTimeout(resolve, 900 * (attempt + 1)));
          continue;
        }
        throw new Error(message);
      } catch (error) {
        if (String(error?.name || "") === "AbortError") {
          lastError = new Error(["uploadTodoImage", "saveWorkspaceAsset"].includes(method)
            ? "The photo upload took too long. Please try saving the task again."
            : "The planner connection took too long. Please try signing in again.");
          throw lastError;
        }
        lastError = error;
        if (retryableRead && attempt < attempts - 1 && /Apps Script upstream returned (404|502|503|504)|Apps Script upstream did not return JSON/i.test(String(error?.message || ""))) {
          await new Promise((resolve) => window.setTimeout(resolve, 900 * (attempt + 1)));
          continue;
        }
        throw error;
      }
    }
    throw lastError || new Error("Planner request failed.");
  }

  function queueWorkspaceTaskCompletionChange(taskId, completed, rerender) {
    const existingTask = cachedWorkspaceTasks.find((task) => String(task.id || "") === taskId);
    if (!existingTask) return;

    const previousTask = { ...existingTask };
    const version = (workspaceTaskCompletionVersions.get(taskId) || 0) + 1;
    workspaceTaskCompletionVersions.set(taskId, version);
    upsertCachedWorkspaceTask({
      ...existingTask,
      status: completed ? "Done" : "Not Started",
      completedAt: completed ? new Date().toISOString() : ""
    });
    savePlannerSessionCache();
    rerender();
    setStatus(workspaceStatusEl, "Task updated. Saving in the background…", "pending");

    const previousSave = workspaceTaskCompletionSaveChains.get(taskId) || Promise.resolve();
    const queuedSave = previousSave.catch(() => undefined).then(async () => {
      try {
        const savedTask = await backendRequest("setWorkspaceTaskCompleted", { id: taskId, completed });
        // A later click is already reflected locally and will be saved next.
        if (workspaceTaskCompletionVersions.get(taskId) !== version) return;
        upsertCachedWorkspaceTask(savedTask);
        savePlannerSessionCache();
        rerender();
        setStatus(workspaceStatusEl, "Task saved.", "success");
      } catch (error) {
        // Do not undo a newer choice if an earlier save failed.
        if (workspaceTaskCompletionVersions.get(taskId) !== version) return;
        upsertCachedWorkspaceTask(previousTask);
        savePlannerSessionCache();
        rerender();
        setStatus(workspaceStatusEl, error.message || "Unable to update the task.", "error");
      }
    });
    workspaceTaskCompletionSaveChains.set(taskId, queuedSave);
    void queuedSave.finally(() => {
      if (workspaceTaskCompletionSaveChains.get(taskId) === queuedSave) {
        workspaceTaskCompletionSaveChains.delete(taskId);
      }
    });
  }

  async function refreshPlannerCollections() {
    const requests = [
      {
        key: "people",
        label: "People",
        run: () => backendRequest("listPeople", {}),
        apply: (items) => {
          cachedPeople = sortByUpdated(Array.isArray(items) ? items : [], "updatedAt");
        }
      },
      {
        key: "events",
        label: "Events",
        run: () => backendRequest("listEvents", {}),
        apply: (items) => {
          cachedEvents = sortEvents(Array.isArray(items) ? items : []);
        }
      },
      {
        key: "shots",
        label: "Shots",
        run: () => backendRequest("listShots", {}).catch((error) => {
          const message = String(error?.message || "");
          if (/Unknown RPC method:\s*listShots/i.test(message)) {
            setStatus(shotStatusEl, "Shot List is hidden until the latest planner backend is deployed.", "pending");
            return [];
          }
          throw error;
        }),
        apply: (items) => {
          cachedShots = sortShots(Array.isArray(items) ? items : []);
        }
      },
      {
        key: "beds",
        label: "Beds",
        run: () => backendRequest("listBeds", {}),
        apply: (items) => {
          cachedBeds = sortBeds(Array.isArray(items) ? items : []);
        }
      },
      {
        key: "todos",
        label: "Todo",
        run: () => backendRequest("listTodos", {}),
        apply: (items) => {
          cachedTodos = sortTodos(Array.isArray(items) ? items : []);
        }
      },
      {
        key: "eventLists",
        label: "Lists",
        run: () => backendRequest("listEventLists", {}).catch((error) => {
          const message = String(error?.message || "");
          if (/Unknown RPC method:\s*listEventLists/i.test(message)) {
            return [];
          }
          throw error;
        }),
        apply: (items) => {
          cachedEventLists = sortEventLists(Array.isArray(items) ? items : []);
        }
      },
      {
        key: "tables",
        label: "Tables",
        run: () => backendRequest("listTables", {}),
        apply: (items) => {
          cachedTables = sortTables(Array.isArray(items) ? items : []);
        }
      }
    ];

    const failures = [];

    for (const request of requests) {
      try {
        request.apply(await request.run());
      } catch (error) {
        failures.push({
          label: request.label,
          message: String(error?.message || "Planner request failed.")
        });
      }
    }

    renderPlannerData();
    return failures;
  }

  async function refreshViewer() {
    const authToken = getStoredAuthToken();
    const previousProfile = { ...viewerProfile };

    // This endpoint verifies the Google credential and determines workspace
    // access together. Keeping it to one request avoids making people wait for
    // two serial trips through the proxy and Apps Script after signing in.
    let workspaceProfile;
    try {
      workspaceProfile = await backendRequest("getWorkspaceProfile", {});
    } catch (error) {
      // Older deployed Apps Script bundles predate the workspace profile
      // endpoint. They can still authenticate full planners through the
      // original profile method while a newer backend is rolled out.
      if (!/Unknown RPC method:\s*getWorkspaceProfile/i.test(String(error?.message || ""))) {
        throw error;
      }
      workspaceProfile = await backendRequest("getViewerProfile", {});
    }
    const supportsWorkspaceAccess = Object.prototype.hasOwnProperty.call(workspaceProfile || {}, "accessLevel");
    viewerProfile = {
      signedIn: Boolean(workspaceProfile?.signedIn),
      email: String(workspaceProfile?.email || "").trim(),
      name: String(workspaceProfile?.name || "").trim(),
      userId: String(workspaceProfile?.userId || "").trim(),
      isAdmin: Boolean(workspaceProfile?.isAdmin) || String(workspaceProfile?.accessLevel || "") === "full_planner",
      hasWorkspaceAccess: supportsWorkspaceAccess
        ? Boolean(workspaceProfile?.signedIn)
        : Boolean(workspaceProfile?.signedIn && workspaceProfile?.isAdmin),
      accessLevel: String(workspaceProfile?.accessLevel || "").trim()
    };

    if (!viewerProfile.signedIn && (previousProfile.isAdmin || previousProfile.hasWorkspaceAccess)) {
      // This is normally an expired ID token, not a user-driven sign-out.
      // Retain the previously restored profile/cache and ask GIS for a fresh
      // token, so an intermittent refresh does not collapse the dashboard.
      viewerProfile = {
        ...previousProfile,
        signedIn: true
      };
      requestGoogleCredentialRefresh();
    } else if (!viewerProfile.signedIn) {
      clearStoredAuthToken();
    }

    renderRoute();
    return canUsePlanner();
  }

  function savePlannerSessionCache() {
    if (!viewerProfile.email) return;
    try {
      const serialized = JSON.stringify({
        version: 3,
        email: viewerProfile.email,
        viewer: viewerProfile,
        savedAt: Date.now(),
        people: cachedPeople,
        events: cachedEvents,
        shots: cachedShots,
        beds: cachedBeds,
        tables: cachedTables,
        todos: cachedTodos,
        eventLists: cachedEventLists,
        rsvps: cachedRsvps,
        guests: cachedGuests,
        workspaceUsers: cachedWorkspaceUsers,
        workspaceEvents: cachedWorkspaceEvents,
        workspaceTasks: cachedWorkspaceTasks,
        workspaceLists: cachedWorkspaceLists,
        workspaceAssets: cachedWorkspaceAssets,
        workspaceInvitees: cachedWorkspaceInvitees
      });
      window.localStorage.setItem(STORAGE_KEYS.plannerDataCache, serialized);
      // Remove the old tab-only cache once the durable cache has been written.
      window.sessionStorage.removeItem(STORAGE_KEYS.plannerDataCache);
    } catch (_) {
      // The cache is only a speed-up. If browser storage is full or disabled,
      // the planner continues to load directly from Google Sheets.
    }
  }

  function restorePlannerSessionCache() {
    try {
      const cached = JSON.parse(String(
        window.localStorage.getItem(STORAGE_KEYS.plannerDataCache)
        || window.sessionStorage.getItem(STORAGE_KEYS.plannerDataCache)
        || ""
      ));
      const savedAt = Number(cached?.savedAt || 0);
      const isCurrent = Number(cached?.version || 0) === 3;
      const isFresh = savedAt > 0 && Date.now() - savedAt <= PLANNER_CACHE_TTL_MS;
      if (!cached || !isCurrent || !isFresh || String(cached.email || "").toLowerCase() !== viewerProfile.email.toLowerCase()) {
        window.localStorage.removeItem(STORAGE_KEYS.plannerDataCache);
        window.sessionStorage.removeItem(STORAGE_KEYS.plannerDataCache);
        return false;
      }
      cachedPeople = Array.isArray(cached.people) ? cached.people : [];
      cachedEvents = Array.isArray(cached.events) ? cached.events : [];
      cachedShots = Array.isArray(cached.shots) ? cached.shots : [];
      cachedBeds = Array.isArray(cached.beds) ? cached.beds : [];
      cachedTables = Array.isArray(cached.tables) ? cached.tables : [];
      cachedTodos = Array.isArray(cached.todos) ? cached.todos : [];
      cachedEventLists = Array.isArray(cached.eventLists) ? cached.eventLists : [];
      cachedRsvps = Array.isArray(cached.rsvps) ? cached.rsvps : [];
      cachedGuests = Array.isArray(cached.guests) ? cached.guests : [];
      cachedWorkspaceUsers = Array.isArray(cached.workspaceUsers) ? cached.workspaceUsers : [];
      cachedWorkspaceEvents = Array.isArray(cached.workspaceEvents) ? cached.workspaceEvents : [];
      cachedWorkspaceTasks = Array.isArray(cached.workspaceTasks) ? cached.workspaceTasks : [];
      cachedWorkspaceLists = Array.isArray(cached.workspaceLists) ? cached.workspaceLists : [];
      cachedWorkspaceAssets = Array.isArray(cached.workspaceAssets) ? cached.workspaceAssets : [];
      cachedWorkspaceInvitees = cached.workspaceInvitees && typeof cached.workspaceInvitees === "object" ? cached.workspaceInvitees : { groups: [], guests: [] };
      plannerCacheHydrated = true;
      return true;
    } catch (_) {
      return false;
    }
  }

  function getGoogleCredentialEmail(credential) {
    try {
      const payload = String(credential || "").split(".")[1] || "";
      const base64 = payload.replace(/-/g, "+").replace(/_/g, "/");
      const decoded = JSON.parse(window.atob(base64.padEnd(base64.length + (4 - base64.length % 4) % 4, "=")));
      return String(decoded?.email || "").trim().toLowerCase();
    } catch (_) {
      return "";
    }
  }

  function showCachedPlannerWhileVerifying(expectedEmail = "") {
    try {
      const cached = JSON.parse(String(
        window.localStorage.getItem(STORAGE_KEYS.plannerDataCache)
        || window.sessionStorage.getItem(STORAGE_KEYS.plannerDataCache)
        || ""
      ));
      const cachedEmail = String(cached?.email || "").trim().toLowerCase();
      const requestedEmail = String(expectedEmail || "").trim().toLowerCase();
      const savedAt = Number(cached?.savedAt || 0);
      const isFresh = Number(cached?.version || 0) === 3 && savedAt > 0 && Date.now() - savedAt <= PLANNER_CACHE_TTL_MS;
      if (!isFresh || !cachedEmail || (requestedEmail && cachedEmail !== requestedEmail) || !cached?.viewer) {
        window.localStorage.removeItem(STORAGE_KEYS.plannerDataCache);
        window.sessionStorage.removeItem(STORAGE_KEYS.plannerDataCache);
        return false;
      }
      viewerProfile = { ...viewerProfile, ...cached.viewer, signedIn: true };
      if (!canUsePlanner() || !restorePlannerSessionCache()) return false;
      renderRoute();
      renderRestoredPlannerCache();
      plannerDataReady = true;
      renderRoute();
      plannerContentEl.hidden = false;
      setStatus(plannerSyncStatusEl, "Showing saved planner data while checking account access…", "pending");
      restorePlannerScrollPosition();
      return true;
    } catch (_) {
      return false;
    }
  }

  function renderRestoredPlannerCache() {
    renderPlannerData();
    renderWorkspace();
    renderRsvps();
    renderGuests();
    renderTables();
    renderTableTypeOptions();
    renderEventAssignedTypeOptions(collectEventAssignedToFormValue());
    rerenderGuestDrivenEventUi();
  }

  function applyPlannerBootstrap(snapshot) {
    const planner = snapshot?.planner || {};
    const workspace = snapshot?.workspace || {};
    const feed = planner.feed || {};

    cachedPeople = sortByUpdated(Array.isArray(planner.people) ? planner.people : [], "updatedAt");
    cachedEvents = sortEvents(Array.isArray(planner.events) ? planner.events : []);
    cachedShots = sortShots(Array.isArray(planner.shots) ? planner.shots : []);
    cachedBeds = sortBeds(Array.isArray(planner.beds) ? planner.beds : []);
    cachedTodos = sortTodos(Array.isArray(planner.todos) ? planner.todos : []);
    cachedEventLists = sortEventLists(Array.isArray(planner.eventLists) ? planner.eventLists : []);
    cachedTables = sortTables(Array.isArray(planner.tables) ? planner.tables : []);
    cachedRsvps = normalizeRsvps(feed);
    cachedGuests = normalizeGuests(feed);
    cachedWorkspaceUsers = Array.isArray(workspace.users) ? workspace.users : [];
    cachedWorkspaceEvents = Array.isArray(workspace.events) ? workspace.events : [];
    cachedWorkspaceTasks = Array.isArray(workspace.tasks) ? workspace.tasks : [];
    cachedWorkspaceLists = Array.isArray(workspace.lists) ? workspace.lists : [];
    cachedWorkspaceAssets = Array.isArray(workspace.assets) ? workspace.assets : [];
    cachedWorkspaceInvitees = workspace.invitees && typeof workspace.invitees === "object" ? workspace.invitees : { groups: [], guests: [] };
    rsvpFeedConnected = true;

    renderPlannerData();
    renderWorkspace();
    renderRsvps();
    renderGuests();
    renderTables();
    renderTableTypeOptions();
    renderEventAssignedTypeOptions(collectEventAssignedToFormValue());
    rerenderGuestDrivenEventUi();
  }

  async function maybeLoadPlannerData() {
    if (currentView !== "planner" || !canUsePlanner()) {
      plannerContentEl.hidden = currentView !== "planner" || !canUsePlanner();
      return;
    }

    if (!plannerDataReady && plannerLoadingMessageEl) {
      plannerLoadingMessageEl.textContent = "Loading your dashboard…";
    }

    if (restorePlannerSessionCache()) {
      renderRestoredPlannerCache();
      plannerDataReady = true;
      renderRoute();
      plannerContentEl.hidden = false;
      setStatus(plannerSyncStatusEl, "Showing saved planner data while checking for updates…", "pending");
      restorePlannerScrollPosition();
    }

    try {
      let usedBootstrap = false;
      try {
        const snapshot = await backendRequest("getPlannerBootstrap", {});
        if (!snapshot?.profile?.signedIn) throw new Error("Please sign in with Google first.");
        applyPlannerBootstrap(snapshot);
        usedBootstrap = true;
        setStatus(plannerSyncStatusEl, "Planner data synced from Google Sheets.", "success");
      } catch (error) {
        if (!/Unknown RPC method:\s*getPlannerBootstrap/i.test(String(error?.message || ""))) throw error;
        const failures = viewerProfile.isAdmin ? await refreshPlannerCollections() : [];
        if (viewerProfile.isAdmin) await backendRequest("initializePlannerWorkspace", {});
        await refreshWorkspaceCollections();
        if (failures.length) {
          const labels = failures.map((failure) => failure.label).join(", ");
          setStatus(plannerSyncStatusEl, `Planner data partially synced. Failed: ${labels}.`, "pending");
        } else {
          setStatus(plannerSyncStatusEl, "Planner data synced from Google Sheets.", "success");
        }
      }
      if (usedBootstrap) {
        setStatus(rsvpStatusEl, `Loaded ${getRsvpSubmissions().length} RSVP submissions and ${getDashboardRsvps().length} guest attendance records.`, "success");
        setStatus(guestsStatusEl, `Loaded ${cachedGuests.length} rows from Guests.`, "success");
      }
    } catch (error) {
      if (/Your Google session needs a quick refresh/i.test(String(error?.message || ""))) {
        clearStoredAuthToken();
        viewerProfile = {
          signedIn: false,
          email: "",
          name: "",
          userId: "",
          isAdmin: false,
          hasWorkspaceAccess: false,
          accessLevel: ""
        };
        plannerDataReady = false;
        plannerContentEl.hidden = true;
        renderRoute();
        renderGoogleSignIn();
        plannerReconnectGoogleButton.hidden = false;
        setStatus(plannerLoginStatusEl, "Your Google session expired. Select Reconnect Google to sign in again.", "pending");
        return;
      }
      if (plannerLoadingMessageEl) {
        plannerLoadingMessageEl.textContent = "We couldn’t load your dashboard. Please refresh and try again.";
      }
      setStatus(plannerSyncStatusEl, error.message || "Unable to load planner data.", "error");
      return;
    }
    if (!rsvpFeedConnected) await refreshRsvps();
    savePlannerSessionCache();
    plannerDataReady = true;
    renderRoute();
    plannerContentEl.hidden = false;
    restorePlannerScrollPosition();
  }

  function requirePlannerAccess() {
    if (!viewerProfile.isAdmin) {
      throw new Error("Only full planners can make this change.");
    }
  }

  async function fetchJsonp(url) {
    return new Promise((resolve, reject) => {
      const callbackName = `plannerFeed${Date.now()}${Math.random().toString(36).slice(2, 8)}`;
      const script = document.createElement("script");
      const separator = url.includes("?") ? "&" : "?";

      const cleanup = () => {
        delete window[callbackName];
        script.remove();
      };

      window[callbackName] = (payload) => {
        cleanup();
        resolve(payload);
      };

      script.onerror = () => {
        cleanup();
        reject(new Error("Unable to load the RSVP feed."));
      };

      script.src = `${url}${separator}callback=${callbackName}`;
      document.body.appendChild(script);
    });
  }

  function normalizeRsvps(payload) {
    const items = Array.isArray(payload?.responses) ? payload.responses : [];
    return items.map((item) => ({
      submittedAt: String(item.submittedAt || ""),
      name: String(item.name || ""),
      email: String(item.email || ""),
      mobile: String(item.mobile || ""),
      smsOptedIn: String(item.smsOptedIn || ""),
      smsConsentRecordedAt: String(item.smsConsentRecordedAt || ""),
      attending: String(item.attending || ""),
      guests: String(item.guests || ""),
      comment: String(item.comment || ""),
      group: String(item.group || ""),
      groupMembers: String(item.groupMembers || ""),
      weddingRsvpSummary: String(item.weddingRsvpSummary || ""),
      rehearsalRsvp: String(item.rehearsalRsvp || ""),
      openHouseRsvp: String(item.openHouseRsvp || ""),
      plusOneCount: String(item.plusOneCount || ""),
      plusOneName: String(item.plusOneName || ""),
      childrenCount: String(item.childrenCount || ""),
      childrenNote: String(item.childrenNote || ""),
      volunteerRoles: String(item.volunteerRoles || "")
    }));
  }

  function normalizeGuests(payload) {
    const items = Array.isArray(payload?.guests) ? payload.guests : [];
    return items
      .map((item) => {
        if (!item || typeof item !== "object" || Array.isArray(item)) {
          return null;
        }

        return Object.fromEntries(
          Object.entries(item).map(([key, value]) => [String(key || "").trim(), String(value || "")])
        );
      })
      .filter((item) => item && Object.keys(item).length);
  }

function sortTables(items) {
  return [...items].sort((left, right) => {
    const locationDelta = String(left.location || "").localeCompare(String(right.location || ""), undefined, { sensitivity: "base" });
    if (locationDelta !== 0) {
      return locationDelta;
    }

    const orderDelta = Number(left.order || 0) - Number(right.order || 0);
    if (orderDelta !== 0) {
      return orderDelta;
    }

    const nameDelta = String(left.tableName || "").localeCompare(String(right.tableName || ""), undefined, { numeric: true, sensitivity: "base" });
    if (nameDelta !== 0) {
      return nameDelta;
    }

      return String(left.type || "").localeCompare(String(right.type || ""), undefined, { sensitivity: "base" });
    });
  }

  function getAssignedGuestByTableName(tableName) {
    return cachedGuests
      .filter((row) => getGuestTableNumber(row) === tableName)
      .map((row) => ({
        rowNumber: getGuestRowNumber(row),
        name: getGuestDisplayName(row),
        type: getGuestTypeValue(row),
        attending: getGuestRsvpLabel(row),
        plusOneRsvp: getGuestPlusOneRsvp(row),
        tableNumber: getGuestTableNumber(row),
        tableOrder: getGuestTableOrder(row)
      }))
      .filter((guest) => guest.rowNumber && guest.name)
      .sort((left, right) => {
        const orderDelta = Number(left.tableOrder || 0) - Number(right.tableOrder || 0);
        if (orderDelta !== 0) {
          return orderDelta;
        }
        return left.name.localeCompare(right.name);
      });
  }

  function getTableByName(tableName) {
    const targetName = String(tableName || "").trim();
    return cachedTables.find((table) => String(table.tableName || "").trim() === targetName) || null;
  }

  function updateCachedTableReservedOpenSeats(tableId, reservedSeats) {
    const table = getTableById(tableId);
    if (!table) {
      return null;
    }

    const normalizedReservedSeats = [...new Set((Array.isArray(reservedSeats) ? reservedSeats : [])
      .map((seatNumber) => Number(seatNumber || 0))
      .filter((seatNumber) => Number.isInteger(seatNumber) && seatNumber > 0))]
      .sort((left, right) => left - right);

    const updatedTable = {
      ...table,
      reservedOpenSeatPositions: normalizedReservedSeats.join(", "),
      updatedAt: new Date().toISOString()
    };
    upsertCachedTable(updatedTable);
    return updatedTable;
  }

  async function toggleReservedOpenSeat(tableId, seatNumber) {
    const table = getTableById(tableId);
    if (!table) {
      throw new Error("Table not found.");
    }

    const numericSeatNumber = Number(seatNumber || 0);
    if (!Number.isInteger(numericSeatNumber) || numericSeatNumber < 1 || numericSeatNumber > Number(table.count || 0)) {
      throw new Error("That seat cannot be reserved.");
    }

    const currentReservedSeats = getReservedOpenSeatPositions(table);
    const nextReservedSeats = currentReservedSeats.includes(numericSeatNumber)
      ? currentReservedSeats.filter((item) => item !== numericSeatNumber)
      : [...currentReservedSeats, numericSeatNumber].sort((left, right) => left - right);

    const previousTables = cachedTables;
    updateCachedTableReservedOpenSeats(tableId, nextReservedSeats);

    try {
      const savedTable = await backendRequest("saveTableReservedOpenSeats", {
        id: tableId,
        reservedOpenSeatPositions: nextReservedSeats
      });
      upsertCachedTable(savedTable);
      setStatus(tableStatusEl, currentReservedSeats.includes(numericSeatNumber) ? "Held seat released." : "Seat held open.", "success");
    } catch (error) {
      cachedTables = previousTables;
      rerenderTableData();
      throw error;
    }
  }

  async function clearReservedOpenSeatIfNeeded(tableId, seatNumber) {
    const table = getTableById(tableId);
    const numericSeatNumber = Number(seatNumber || 0);
    if (!table || !numericSeatNumber) {
      return;
    }

    const currentReservedSeats = getReservedOpenSeatPositions(table);
    if (!currentReservedSeats.includes(numericSeatNumber)) {
      return;
    }

    const nextReservedSeats = currentReservedSeats.filter((item) => item !== numericSeatNumber);
    const savedTable = await backendRequest("saveTableReservedOpenSeats", {
      id: tableId,
      reservedOpenSeatPositions: nextReservedSeats
    });
    upsertCachedTable(savedTable);
  }

  function canGuestSitAtTable(guest, table) {
    if (!guest || !table) {
      return false;
    }

    if (getRsvpGroup(guest.attending) !== "yes") {
      return false;
    }

    if (tableAcceptsAnyGuest(table)) {
      return true;
    }

    const guestTypes = getTypeTokens(guest.type).map((type) => type.toLowerCase());
    const tableTypes = getTableTypes(table).map((type) => type.toLowerCase());
    return guestTypes.some((type) => tableTypes.includes(type));
  }

  function getAvailableSeatCount(tableName, ignoreRowNumber = 0) {
    const table = getTableByName(tableName);
    if (!table) {
      return 0;
    }

    const assignedCount = getAssignedGuestByTableName(tableName)
      .filter((guest) => Number(guest.rowNumber || 0) !== Number(ignoreRowNumber || 0))
      .length;
    return Math.max(0, Number(table.count || 0) - assignedCount);
  }

  function getRenderableSeatCountForTable(table, assignedGuests = []) {
    const configuredSeatCount = Math.max(0, Number(table?.count || 0));
    const maxAssignedSeat = assignedGuests.reduce((maxSeat, guest) => Math.max(maxSeat, Number(guest.tableOrder || 0)), 0);
    return Math.max(configuredSeatCount, maxAssignedSeat);
  }

  function getReservedOpenSeatPositions(table) {
    const seen = new Set();
    return String(table?.reservedOpenSeatPositions || "")
      .split(",")
      .map((token) => Number(String(token || "").trim()))
      .filter((seatNumber) => Number.isInteger(seatNumber) && seatNumber > 0)
      .filter((seatNumber) => {
        if (seen.has(seatNumber)) {
          return false;
        }
        seen.add(seatNumber);
        return true;
      })
      .sort((left, right) => left - right);
  }

  function isReservedOpenSeat(table, seatNumber) {
    return getReservedOpenSeatPositions(table).includes(Number(seatNumber || 0));
  }

  function findFirstOpenSeat(tableName) {
    const table = getTableByName(tableName);
    const seatCount = Math.max(0, Number(table?.count || 0));
    const reservedSeats = new Set(getReservedOpenSeatPositions(table));
    const usedSeats = new Set(
      getAssignedGuestByTableName(tableName)
        .map((guest) => Number(guest.tableOrder || 0))
        .filter((seatNumber) => seatNumber > 0)
    );
    for (let seatNumber = 1; seatNumber <= seatCount; seatNumber += 1) {
      if (!usedSeats.has(seatNumber) && !reservedSeats.has(seatNumber)) {
        return seatNumber;
      }
    }
    return 0;
  }

  function renderTableSeatGrid(table, assignedGuests, seatCount) {
    const tableName = String(table.tableName || "").trim();
    if (!seatCount) {
      return '<p class="meta">Set a seat count to start placing guests.</p>';
    }

    const assignedBySeat = new Map(
      assignedGuests
        .map((guest) => [Number(guest.tableOrder || 0), guest])
        .filter(([seatNumber]) => seatNumber > 0)
    );

    return Array.from({ length: seatCount }, (_, index) => {
      const seatNumber = index + 1;
      return renderTableSeat(table, seatNumber, assignedBySeat.get(seatNumber) || null);
    }).join("");
  }

  function renderTableSeat(table, seatNumber, guest = null) {
    const tableName = String(table?.tableName || "").trim();
    const tableId = String(table?.id || "").trim();
    const guestName = guest ? formatTableGuestName(guest) : "";
    const reserved = !guest && isReservedOpenSeat(table, seatNumber);
    const dropLabel = guest
      ? `Move ${guestName} to seat ${seatNumber} at ${tableName}`
      : `Place guest in open seat ${seatNumber} at ${tableName}`;
    const isDragSource = guest && activeTableDrag && Number(activeTableDrag.rowNumber || 0) === Number(guest.rowNumber || 0);
    return `
      <div class="table-seat ${guest ? "table-seat--occupied" : "table-seat--empty"} ${reserved ? "table-seat--reserved" : ""} ${isDragSource ? "is-drag-source" : ""}" data-table-dropzone data-table-id="${escapeHtml(tableId)}" data-table-name="${escapeHtml(tableName)}" data-drop-seat="${escapeHtml(String(seatNumber))}" data-drop-enabled="false" role="button" tabindex="0" aria-label="${escapeHtml(dropLabel)}" aria-disabled="true">
        ${guest ? activeTableDrag ? `<span class="table-seat__hint" aria-hidden="true">Drop here</span>` : "" : ""}
        ${guest ? `
          <div class="dashboard-entry" data-assigned-guest data-row-number="${escapeHtml(String(guest.rowNumber || ""))}" data-table-name="${escapeHtml(tableName)}">
            <div class="table-assignment-row">
              <div class="table-assignment-row__meta">
                <button class="button button--light table-drag-handle" type="button" draggable="true" data-table-guest-handle data-row-number="${escapeHtml(String(guest.rowNumber || ""))}" aria-label="Move ${escapeHtml(guestName)}">
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M9 6h.01"></path>
                    <path d="M9 12h.01"></path>
                    <path d="M9 18h.01"></path>
                    <path d="M15 6h.01"></path>
                    <path d="M15 12h.01"></path>
                    <path d="M15 18h.01"></path>
                  </svg>
                </button>
                <strong>${escapeHtml(guestName)}</strong>
              </div>
              <div class="table-assignment-row__actions">
                ${isPlusOneAttending(guest.plusOneRsvp) ? '<span class="table-assignment-row__plus-one" title="Plus one attending" aria-label="Plus one attending">+1</span>' : ""}
                <button class="button button--light table-remove-button" type="button" data-remove-table-guest data-row-number="${escapeHtml(String(guest.rowNumber || ""))}" data-table-name="${escapeHtml(tableName)}" aria-label="Remove ${escapeHtml(guestName)} from ${escapeHtml(tableName || "table")}">
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M3 6h18"></path>
                    <path d="M8 6V4h8v2"></path>
                    <path d="M19 6l-1 14H6L5 6"></path>
                    <path d="M10 11v6"></path>
                    <path d="M14 11v6"></path>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        ` : `
          <div class="table-seat__empty">
            <div class="table-seat__actions">
              <button class="button button--icon table-seat__add" type="button" data-open-add-guest-seat data-table-id="${escapeHtml(tableId)}" data-seat-number="${escapeHtml(String(seatNumber))}" aria-label="Add guest to seat ${escapeHtml(String(seatNumber))} at ${escapeHtml(tableName || "table")}">+</button>
              <button class="button button--light table-seat__toggle" type="button" data-toggle-reserved-seat data-table-id="${escapeHtml(tableId)}" data-seat-number="${escapeHtml(String(seatNumber))}">
                ${reserved ? "Release" : "Hold"}
              </button>
            </div>
          </div>
        `}
      </div>
    `;
  }

  function getEligibleGuestsForTable(table) {
    return cachedGuests
      .map((row) => ({
        rowNumber: getGuestRowNumber(row),
        name: getGuestDisplayName(row),
        type: getGuestTypeValue(row),
        attending: getGuestRsvpLabel(row),
        plusOneRsvp: getGuestPlusOneRsvp(row),
        tableNumber: getGuestTableNumber(row)
      }))
      .filter((guest) => guest.rowNumber && guest.name)
      .filter((guest) => canGuestSitAtTable(guest, table))
      .filter((guest) => getRsvpGroup(guest.attending) === "yes")
      .filter((guest) => !guest.tableNumber)
      .sort((left, right) => left.name.localeCompare(right.name));
  }

  async function addGuestToTable(table, guestRowNumber, seatNumber = "") {
    const tableName = String(table.tableName || "").trim();
    const tableId = String(table.id || "").trim();
    const nextRowNumber = Number(guestRowNumber || 0);
    const requestedSeatNumber = Number(seatNumber || 0);
    if (!tableName || !nextRowNumber) {
      return;
    }

    const nextOrder = requestedSeatNumber || findFirstOpenSeat(tableName);
    if (!nextOrder) {
      throw new Error("That table is already full.");
    }
    if (requestedSeatNumber) {
      const assignedGuests = getAssignedGuestByTableName(tableName);
      if (assignedGuests.some((guest) => Number(guest.tableOrder || 0) === requestedSeatNumber)) {
        throw new Error("That seat is already taken.");
      }
      if (requestedSeatNumber < 1 || requestedSeatNumber > Number(table.count || 0)) {
        throw new Error("That seat is outside this table's range.");
      }
    }

    await backendRequest("saveGuestTableAssignment", {
      rowNumber: nextRowNumber,
      tableName,
      tableOrder: nextOrder
    });

    const nextGuest = cachedGuests.find((row) => getGuestRowNumber(row) === nextRowNumber);
    if (nextGuest) {
      const nextGuestTableColumn = findGuestColumn(nextGuest, /^table\s*(number|#)?$/i);
      const nextGuestOrderColumn = findGuestColumn(nextGuest, /^table\s*order$/i);
      if (nextGuestTableColumn) {
        nextGuest[nextGuestTableColumn] = tableName;
      }
      if (nextGuestOrderColumn) {
        nextGuest[nextGuestOrderColumn] = String(nextOrder);
      }
    }

    await clearReservedOpenSeatIfNeeded(tableId, nextOrder);

  }

  function updateCachedGuestTableAssignment(rowNumber, tableName, tableOrder) {
    const numericRowNumber = Number(rowNumber || 0);
    if (!numericRowNumber) {
      return;
    }

    const guest = cachedGuests.find((row) => getGuestRowNumber(row) === numericRowNumber);
    if (!guest) {
      return;
    }

    const guestTableColumn = findGuestColumn(guest, /^table\s*(number|#)?$/i);
    const guestOrderColumn = findGuestColumn(guest, /^table\s*order$/i);
    if (guestTableColumn) {
      guest[guestTableColumn] = String(tableName || "").trim();
    }
    if (guestOrderColumn) {
      guest[guestOrderColumn] = tableOrder ? String(tableOrder) : "";
    }
  }

  async function syncTableAssignments(tableName, orderedRowNumbers) {
    const normalizedTableName = String(tableName || "").trim();
    if (!normalizedTableName) {
      return;
    }

    const pendingAssignments = [];
    for (let index = 0; index < orderedRowNumbers.length; index += 1) {
      const rowNumber = Number(orderedRowNumbers[index] || 0);
      if (!rowNumber) {
        continue;
      }

      const guestRow = cachedGuests.find((row) => getGuestRowNumber(row) === rowNumber);
      if (guestRow && getGuestTableNumber(guestRow) === normalizedTableName && getGuestTableOrder(guestRow) === index + 1) {
        continue;
      }

      pendingAssignments.push({
        rowNumber,
        tableName: normalizedTableName,
        tableOrder: index + 1
      });
    }

    if (!pendingAssignments.length) {
      return;
    }

    const savedAssignments = await backendRequest("saveGuestTableAssignments", {
      assignments: pendingAssignments
    });

    (Array.isArray(savedAssignments) ? savedAssignments : []).forEach((assignment) => {
      updateCachedGuestTableAssignment(assignment.rowNumber, assignment.tableName, assignment.tableOrder);
    });
  }

  function buildSeatRowNumbers(tableName) {
    const table = getTableByName(tableName);
    const seatCount = getRenderableSeatCountForTable(table, getAssignedGuestByTableName(tableName));
    const seats = Array.from({ length: seatCount }, () => 0);
    getAssignedGuestByTableName(tableName).forEach((guest) => {
      const seatIndex = Number(guest.tableOrder || 0) - 1;
      if (seatIndex >= 0 && seatIndex < seats.length) {
        seats[seatIndex] = Number(guest.rowNumber || 0);
      }
    });
    return seats;
  }

  async function moveGuestToTablePosition(rowNumber, targetTableName, targetIndex) {
    const numericRowNumber = Number(rowNumber || 0);
    const normalizedTargetTableName = String(targetTableName || "").trim();
    const targetSeatNumber = Math.max(1, Number(targetIndex || 0));
    const guestRow = cachedGuests.find((row) => getGuestRowNumber(row) === numericRowNumber);
    if (!numericRowNumber || !normalizedTargetTableName || !guestRow) {
      return;
    }

    const sourceTableName = getGuestTableNumber(guestRow);
    const guest = {
      rowNumber: numericRowNumber,
      name: getGuestDisplayName(guestRow),
      type: getGuestTypeValue(guestRow),
      attending: getGuestRsvpLabel(guestRow),
      tableNumber: sourceTableName,
      tableOrder: getGuestTableOrder(guestRow)
    };
    const targetTable = getTableByName(normalizedTargetTableName);
    if (!targetTable || !canGuestSitAtTable(guest, targetTable)) {
      throw new Error("That guest cannot be assigned to the selected table.");
    }

    if (targetSeatNumber > Math.max(0, Number(targetTable.count || 0))) {
      throw new Error("That seat is outside the selected table.");
    }

    if (sourceTableName !== normalizedTargetTableName && getAvailableSeatCount(normalizedTargetTableName, numericRowNumber) < 1) {
      throw new Error("That table is already full.");
    }

    const currentSeatNumber = Math.max(1, Number(getGuestTableOrder(guestRow) || 0));
    const currentIndex = currentSeatNumber - 1;
    if (currentIndex < 0) {
      return;
    }

    if (sourceTableName === normalizedTargetTableName) {
      if (currentSeatNumber === targetSeatNumber) {
        return;
      }

      const nextSeats = buildSeatRowNumbers(sourceTableName);
      const targetSeatIndex = targetSeatNumber - 1;
      nextSeats[currentIndex] = 0;
      if (!nextSeats[targetSeatIndex]) {
        nextSeats[targetSeatIndex] = numericRowNumber;
      } else if (targetSeatIndex < currentIndex) {
        for (let index = currentIndex - 1; index >= targetSeatIndex; index -= 1) {
          nextSeats[index + 1] = nextSeats[index];
        }
        nextSeats[targetSeatIndex] = numericRowNumber;
      } else {
        for (let index = currentIndex + 1; index <= targetSeatIndex; index += 1) {
          nextSeats[index - 1] = nextSeats[index];
        }
        nextSeats[targetSeatIndex] = numericRowNumber;
      }
      await syncTableAssignments(sourceTableName, nextSeats);
      await clearReservedOpenSeatIfNeeded(String(targetTable.id || "").trim(), targetSeatNumber);
      return;
    }

    const nextSourceSeats = buildSeatRowNumbers(sourceTableName);
    const nextTargetSeats = buildSeatRowNumbers(normalizedTargetTableName);
    const targetSeatIndex = targetSeatNumber - 1;
    nextSourceSeats[currentIndex] = 0;

    if (nextTargetSeats[targetSeatIndex]) {
      const openSeatIndex = nextTargetSeats.findIndex((seatRowNumber) => !seatRowNumber);
      if (openSeatIndex < 0) {
        throw new Error("That table is already full.");
      }
      for (let index = openSeatIndex - 1; index >= targetSeatIndex; index -= 1) {
        nextTargetSeats[index + 1] = nextTargetSeats[index];
      }
    }
    nextTargetSeats[targetSeatIndex] = numericRowNumber;

    await syncTableAssignments(sourceTableName, nextSourceSeats);
    await syncTableAssignments(normalizedTargetTableName, nextTargetSeats);
    await clearReservedOpenSeatIfNeeded(String(targetTable.id || "").trim(), targetSeatNumber);
  }

  function getActiveTableDragGuest() {
    if (!activeTableDrag) {
      return null;
    }

    const guestRow = cachedGuests.find((row) => getGuestRowNumber(row) === Number(activeTableDrag.rowNumber || 0));
    if (!guestRow) {
      return null;
    }

    return {
      rowNumber: getGuestRowNumber(guestRow),
      name: getGuestDisplayName(guestRow),
      type: getGuestTypeValue(guestRow),
      attending: getGuestRsvpLabel(guestRow),
      tableNumber: getGuestTableNumber(guestRow),
      tableOrder: getGuestTableOrder(guestRow)
    };
  }

  function canDropActiveGuestOnTable(tableName) {
    const guest = getActiveTableDragGuest();
    if (!guest) {
      return false;
    }

    const normalizedTableName = String(tableName || "").trim();
    if (guest.tableNumber === normalizedTableName) {
      return true;
    }

    const table = getTableByName(normalizedTableName);
    return Boolean(table) && canGuestSitAtTable(guest, table) && getAvailableSeatCount(normalizedTableName, guest.rowNumber) > 0;
  }

  function syncTableDragUi() {
    const dragGuest = getActiveTableDragGuest();
    tablesListEl.classList.toggle("is-table-drag-active", Boolean(dragGuest));
    tablesListEl.querySelectorAll("[data-assigned-guest]").forEach((entry) => {
      entry.classList.toggle("is-drag-source", Boolean(dragGuest) && Number(entry.dataset.rowNumber || 0) === Number(dragGuest?.rowNumber || 0));
    });
    tablesListEl.querySelectorAll("[data-table-dropzone]").forEach((dropzone) => {
      const canDrop = dragGuest
        ? canDropActiveGuestOnTable(dropzone.dataset.tableName) && Number(dropzone.dataset.dropSeat || 0) > 0
        : false;
      dropzone.dataset.dropEnabled = canDrop ? "true" : "false";
      dropzone.setAttribute("aria-disabled", canDrop ? "false" : "true");
      dropzone.classList.toggle("is-drop-available", Boolean(dragGuest) && canDrop);
      dropzone.classList.toggle("is-active-dropzone", false);
    });
  }

  function setActiveTableDrag(rowNumber) {
    const guestRow = cachedGuests.find((row) => getGuestRowNumber(row) === Number(rowNumber || 0));
    if (!guestRow) {
      return;
    }

    activeTableDrag = {
      rowNumber: getGuestRowNumber(guestRow)
    };
    syncTableDragUi();
  }

  function clearActiveTableDrag() {
    if (!activeTableDrag) {
      return;
    }

    activeTableDrag = null;
    syncTableDragUi();
  }

  async function removeGuestFromTable(button) {
    const rowNumber = Number(button.dataset.rowNumber || 0);
    if (!rowNumber) {
      return;
    }

    const guest = cachedGuests.find((row) => getGuestRowNumber(row) === rowNumber);
    await backendRequest("saveGuestTableAssignment", {
      rowNumber,
      tableName: "",
      tableOrder: ""
    });

    const updatedGuest = cachedGuests.find((row) => getGuestRowNumber(row) === rowNumber);
    if (updatedGuest) {
      const guestTableColumn = findGuestColumn(updatedGuest, /^table\s*(number|#)?$/i);
      const guestOrderColumn = findGuestColumn(updatedGuest, /^table\s*order$/i);
      if (guestTableColumn) {
        updatedGuest[guestTableColumn] = "";
      }
      if (guestOrderColumn) {
        updatedGuest[guestOrderColumn] = "";
      }
    }

  }

  function getRsvpGroup(attending) {
    const normalized = String(attending || "").trim().toLowerCase();
    if (normalized === "yes" || normalized === "attending") return "yes";
    if (normalized === "no" || normalized === "not attending" || normalized === "declined") return "no";
    return "maybe";
  }

  function getRsvpLabel(group) {
    if (group === "yes") return "Attending";
    if (group === "no") return "Not Attending";
    return "Maybe";
  }

  function formatRsvpMeta(rsvp) {
    return [
      getRsvpLabel(getRsvpGroup(rsvp.attending)),
      rsvp.plusOneRsvp ? `Plus 1: ${rsvp.plusOneRsvp}` : "",
      rsvp.tableNumber ? `Table ${rsvp.tableNumber}` : "",
      rsvp.guests ? `${rsvp.guests} guest${String(rsvp.guests) === "1" ? "" : "s"}` : "",
      rsvp.email || "",
      rsvp.submittedAt ? new Date(rsvp.submittedAt).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : ""
    ].filter(Boolean).join(" | ");
  }

  function formatRsvpSubmissionMeta(rsvp) {
    return [
      rsvp.weddingRsvpSummary ? `Wedding: ${rsvp.weddingRsvpSummary}` : (rsvp.attending ? `Wedding: ${getRsvpLabel(getRsvpGroup(rsvp.attending))}` : ""),
      rsvp.rehearsalRsvp ? `Rehearsal dinner: ${rsvp.rehearsalRsvp}` : "",
      rsvp.openHouseRsvp ? `Open house: ${rsvp.openHouseRsvp}` : "",
      rsvp.plusOneCount && rsvp.plusOneCount !== "0" ? `Plus ones: ${rsvp.plusOneCount}${rsvp.plusOneName ? ` (${rsvp.plusOneName})` : ""}` : "",
      rsvp.childrenCount && rsvp.childrenCount !== "0" ? `Children: ${rsvp.childrenCount}${rsvp.childrenNote ? ` (${rsvp.childrenNote})` : ""}` : "",
      rsvp.guests ? `${rsvp.guests} attending` : "",
      rsvp.email || "",
      rsvp.submittedAt ? new Date(rsvp.submittedAt).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : ""
    ].filter(Boolean).join(" | ");
  }

  async function refreshRsvps() {
    try {
      requirePlannerAccess();
      let payload;
      try {
        payload = await backendRequest("listPlannerDashboardFeed", {});
      } catch (error) {
        // Maintain guest/table functionality while an existing Apps Script
        // deployment is upgraded. The fallback is used only after the
        // authenticated planner access check above succeeds.
        if (!/Unknown RPC method:\s*listPlannerDashboardFeed/i.test(String(error?.message || ""))) {
          throw error;
        }
        const feedUrl = String(window.PLANNER_CTX.rsvpFeedUrl || "").trim();
        if (!feedUrl) {
          throw error;
        }
        payload = await fetchJsonp(feedUrl);
      }
      rsvpFeedConnected = true;
      cachedRsvps = normalizeRsvps(payload);
      cachedGuests = normalizeGuests(payload);
      if (workspaceDraftState) renderWorkspaceDraft();
      renderRsvps();
