  function getFrontendBuildVersion() {
    return String(window.PLANNER_CTX.frontendVersion || "").trim() || "unknown";

  function renderPlannerVersionInfo() {
    if (!plannerVersionInfoEl) {
      return;
    }

    const frontendVersion = getFrontendBuildVersion();
    const backendVersion = String(backendBuildVersion || "").trim();
    if (!backendVersion) {
      plannerVersionInfoEl.textContent = `Planner version ${frontendVersion} | backend unavailable`;
      return;
    }

    plannerVersionInfoEl.textContent = `Planner version ${frontendVersion} | backend ${backendVersion}`;
  }

  async function refreshPlannerVersionInfo() {
    renderPlannerVersionInfo();

    // Version information is useful after access is established, but asking
    // Apps Script for it on the sign-in screen can compete with the first
    // access check and make local sign-in look stalled.
    if (!getStoredAuthToken()) {
      return;
    }

    try {
      const buildInfo = await backendRequest("getPlannerBuildInfo", {});
      backendBuildVersion = String(buildInfo?.version || "").trim();
      renderPlannerVersionInfo();

      if (backendBuildVersion && backendBuildVersion !== getFrontendBuildVersion()) {
        setStatus(
          plannerSyncStatusEl,
          `Frontend ${getFrontendBuildVersion()} is newer than backend ${backendBuildVersion}. Push a new Apps Script deployment to sync them.`,
          "pending"
        );
      }
    } catch (error) {
      const message = String(error?.message || "");
      backendBuildVersion = "";
      renderPlannerVersionInfo();
      if (/Unknown RPC method:\s*getPlannerBuildInfo/i.test(message)) {
        setStatus(
          plannerSyncStatusEl,
          `Frontend ${getFrontendBuildVersion()} is running against an older backend that does not expose version info yet.`,
          "pending"
        );
        return;
      }
    }
  }

  function sortBeds(items) {
    return [...items].sort((left, right) => {
      const orderDelta = Number(left.sortOrder || 0) - Number(right.sortOrder || 0);
      if (orderDelta !== 0) {
        return orderDelta;
      }
      return `${left.lodging || ""} ${left.room || ""} ${left.bedLabel || ""}`.localeCompare(
        `${right.lodging || ""} ${right.room || ""} ${right.bedLabel || ""}`
      );
    });
  }

  function upsertItemById(items, nextItem) {
    const nextId = String(nextItem?.id || "").trim();
    if (!nextId) {
      return [...items];
    }

    const nextItems = [...items];
    const existingIndex = nextItems.findIndex((item) => String(item?.id || "").trim() === nextId);
    if (existingIndex >= 0) {
      nextItems[existingIndex] = nextItem;
      return nextItems;
    }

    nextItems.unshift(nextItem);
    return nextItems;
  }

  function getRequestedView() {
    const pathname = String(window.location.pathname || "").toLowerCase();
    if (pathname.endsWith("/dashboard.html") || pathname.endsWith("dashboard.html")) {
      return "planner";
    }

    const requested = new URLSearchParams(window.location.search).get("view");
    return requested === "planner" ? "planner" : "home";
  }

    const panel = new URLSearchParams(window.location.search).get("panel");
    return String(panel || "").trim();
  }

  function getRequestedWorkspaceEventId() {
    return String(new URLSearchParams(window.location.search).get("event") || "").trim();
  }

  function getRequestedWorkspaceEventTab() {
    const tab = String(new URLSearchParams(window.location.search).get("eventTab") || "").trim();
    return ["details", "tasks", "lists"].includes(tab) ? tab : "";
  }

  function getRequestedWorkspaceTaskId() {
    return String(new URLSearchParams(window.location.search).get("task") || "").trim();
  }

  function syncPlannerRoute(options = {}) {
    if (currentView !== "planner") {
      return;
    }

    const url = new URL(window.location.href);
    url.searchParams.set("panel", activePlannerPanel);
    if (activePlannerPanel === "workspace" && selectedWorkspaceEventId) {
      url.searchParams.set("event", selectedWorkspaceEventId);
      url.searchParams.set("eventTab", activeWorkspaceEventTab);
      if (selectedWorkspaceTaskId) url.searchParams.set("task", selectedWorkspaceTaskId);
      else url.searchParams.delete("task");
    } else {
      url.searchParams.delete("event");
      url.searchParams.delete("eventTab");
      url.searchParams.delete("task");
    }

    const nextUrl = `${url.pathname}${url.search}${url.hash}`;
    const currentUrl = `${window.location.pathname}${window.location.search}${window.location.hash}`;
    if (nextUrl === currentUrl) {
      return;
    }

    window.history[options.replace ? "replaceState" : "pushState"]({}, "", url);
  }

  function restorePlannerRoute() {
    const requestedPanel = getRequestedPlannerPanel();
    const requestedEventId = getRequestedWorkspaceEventId();
    const requestedEventTab = getRequestedWorkspaceEventTab();
    const requestedTaskId = getRequestedWorkspaceTaskId();
    const availablePanels = plannerPanels.map((panel) => panel.dataset.plannerPanel);

    if (requestedPanel && availablePanels.includes(requestedPanel)) {
      activePlannerPanel = requestedPanel;
    }
    selectedWorkspaceEventId = requestedEventId;
    activeWorkspaceEventTab = requestedEventTab || "details";
    selectedWorkspaceTaskId = requestedTaskId;
    if (selectedWorkspaceEventId) {
      window.sessionStorage.setItem(STORAGE_KEYS.workspaceEventId, selectedWorkspaceEventId);
      window.sessionStorage.setItem(STORAGE_KEYS.workspaceEventTab, activeWorkspaceEventTab);
      if (selectedWorkspaceTaskId) window.sessionStorage.setItem(STORAGE_KEYS.workspaceTaskId, selectedWorkspaceTaskId);
      else window.sessionStorage.removeItem(STORAGE_KEYS.workspaceTaskId);
    } else {
      window.sessionStorage.removeItem(STORAGE_KEYS.workspaceEventId);
      window.sessionStorage.removeItem(STORAGE_KEYS.workspaceEventTab);
      window.sessionStorage.removeItem(STORAGE_KEYS.workspaceTaskId);
    }
  }

  function navigateTo(view) {
    const url = new URL(window.location.href);
    const pathname = String(url.pathname || "").toLowerCase();

    if (pathname.endsWith("/dashboard.html") || pathname.endsWith("dashboard.html")) {
      currentView = "planner";
      renderRoute();
      maybeLoadPlannerData();
      return;
    }

    if (view === "planner") {
      url.searchParams.set("view", "planner");
    } else {
      url.searchParams.delete("view");
    }
    window.history.pushState({}, "", url);
    currentView = view;
    renderRoute();
    maybeLoadPlannerData();
  }

  function renderRoute() {
    routedViews.forEach((section) => {
      section.hidden = section.dataset.view !== currentView;
    });

    routeLinks.forEach((link) => {
      link.classList.toggle("is-active", link.dataset.routeLink === currentView);
    });

    const showPlanner = currentView === "planner";
    const hasAccess = canUsePlanner();
    const showPlannerNavigation = showPlanner && hasAccess && plannerDataReady;
    plannerMenuToggleButton.hidden = !showPlannerNavigation;
    plannerPageTitleEl.hidden = !showPlannerNavigation;
    plannerLockedEl.hidden = !showPlanner || hasAccess;
    plannerUnlockedEl.hidden = !showPlannerNavigation;
    plannerLoadingEl.hidden = !showPlanner || !hasAccess || plannerDataReady;
    plannerLoadingEl.setAttribute("aria-busy", String(!plannerDataReady));
    plannerContentEl.hidden = !showPlannerNavigation;
    plannerSignOutButton.hidden = !viewerProfile.signedIn;
    if (hasAccess && !viewerProfile.isAdmin && !["calendar", "todos"].includes(activePlannerPanel)) {
      activePlannerPanel = "calendar";
    }
    plannerSectionButtons.forEach((button) => {
      button.hidden = !viewerProfile.isAdmin && !["calendar", "todos"].includes(button.dataset.plannerSection);
    });
    setActivePlannerPanel(activePlannerPanel, { recordHistory: false });
    syncPlannerRoute({ replace: true });
    syncPlannerSidebar();
    updateViewerState();
  }

  function getStoredAuthToken() {
    // A standalone/PWA window can be discarded while it is in the background.
    // sessionStorage disappears in that case, even though the person never
    // chose to sign out. Keep the credential in origin storage too; Google
    // still verifies its short lifetime on every backend request.
    return String(
      window.localStorage.getItem(STORAGE_KEYS.authToken)
      || window.sessionStorage.getItem(STORAGE_KEYS.authToken)
      || ""
    ).trim();
  }

  function getStoredSessionToken() {
    return String(window.localStorage.getItem(STORAGE_KEYS.sessionToken) || "").trim();
  }

  function hasStoredPlannerSession() {
    return Boolean(getStoredSessionToken() || getStoredAuthToken());
  }

  function clearStoredAuthToken() {
    window.localStorage.removeItem(STORAGE_KEYS.authToken);
    window.sessionStorage.removeItem(STORAGE_KEYS.authToken);

    window.localStorage.removeItem(STORAGE_KEYS.plannerDataCache);

  function toLocalInputValue(isoString) {
    if (!isoString) return "";
    const date = new Date(isoString);
    if (Number.isNaN(date.getTime())) return "";
    const pad = (value) => String(value).padStart(2, "0");
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
  }

  function formatEventDate(dateValue) {
    const raw = String(dateValue || "").trim();
    if (!raw) return "";

    const directMatch = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (directMatch) {
      const localDate = new Date(Number(directMatch[1]), Number(directMatch[2]) - 1, Number(directMatch[3]));
      return localDate.toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" });
    }

    const parsed = new Date(raw);
    return Number.isNaN(parsed.getTime())
      ? raw
      : parsed.toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" });
  }

  function formatEventTime(timeValue) {
    const raw = String(timeValue || "").trim();
    if (!raw) return "";

    const twentyFourHourMatch = raw.match(/^(\d{1,2}):(\d{2})$/);
    if (twentyFourHourMatch) {
      const hours = Number(twentyFourHourMatch[1]);
      const minutes = twentyFourHourMatch[2];
      const suffix = hours >= 12 ? "PM" : "AM";
      const normalizedHour = hours % 12 || 12;
      return `${normalizedHour}:${minutes} ${suffix}`;
    }

    // Older event records can store a date and time together (for example,
    // "Fri, Jan 8, 7:00 AM"). Keep only the time wherever this formatter is used.
    const twelveHourMatch = raw.match(/(?:^|[\s,])(\d{1,2}:\d{2}\s*[AP]M)$/i);
    if (twelveHourMatch) {
      return twelveHourMatch[1].replace(/\s+/u, " ").toUpperCase();
    }

    const parsed = new Date(raw);
    return Number.isNaN(parsed.getTime())
      ? raw
      : parsed.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }

  function formatEventTimeRange(startsAt, endsAt) {
    const startLabel = formatEventTime(startsAt);
    const endLabel = formatEventTime(endsAt);
    if (startLabel && endLabel) {
      return `${startLabel} - ${endLabel}`;
    }
    return startLabel || endLabel || "";
  }

  function formatEventSchedule(event) {
    const dateLabel = formatEventDate(event.date);
    const timeLabel = formatEventTimeRange(event?.startsAt, event?.endsAt);
    return [dateLabel, timeLabel].filter(Boolean).join(" at ");
  }

  function formatEventDateShort(dateValue) {
    const raw = String(dateValue || "").trim();
    if (!raw) return "";

    const directMatch = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (directMatch) {
      const localDate = new Date(Number(directMatch[1]), Number(directMatch[2]) - 1, Number(directMatch[3]));
      return localDate.toLocaleDateString([], { month: "short", day: "numeric" });
    }

    const parsed = new Date(raw);
    return Number.isNaN(parsed.getTime())
      ? raw
      : parsed.toLocaleDateString([], { month: "short", day: "numeric" });
  }

  function getEventDateFilterValue(event) {
    return String(event?.date || "").trim();
  }

  function getEventAssignedToFilterValue(event) {
    return String(event?.assignedTo || "").trim();
  }

  function getEventAssignedToTokens(event) {

  }

  function getEventAssignedPeopleTokens(event) {
    return dedupeTokens(getTypeTokens(String(event?.assignedPeople || "").trim()));
  }

  function parseEventDateTime(event) {
    const rawDate = String(event?.date || "").trim();
    if (!rawDate) {
      return null;
    }

    let parsedDate;
    const dateMatch = rawDate.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (dateMatch) {
      parsedDate = new Date(Number(dateMatch[1]), Number(dateMatch[2]) - 1, Number(dateMatch[3]));
    } else {
      parsedDate = new Date(rawDate);
    }

    if (Number.isNaN(parsedDate.getTime())) {
      return null;
    }

    const rawTime = String(event?.startsAt || "").trim();
    if (!rawTime) {
      parsedDate.setHours(0, 0, 0, 0);
      return parsedDate;
    }

    const twentyFourHourMatch = rawTime.match(/^(\d{1,2}):(\d{2})$/);
    if (twentyFourHourMatch) {
      parsedDate.setHours(Number(twentyFourHourMatch[1]), Number(twentyFourHourMatch[2]), 0, 0);
      return parsedDate;
    }

    const twelveHourMatch = rawTime.match(/^(\d{1,2}):(\d{2})\s*([AP]M)$/i);
    if (twelveHourMatch) {
      let hours = Number(twelveHourMatch[1]) % 12;
      if (twelveHourMatch[3].toUpperCase() === "PM") {
        hours += 12;
      }
      parsedDate.setHours(hours, Number(twelveHourMatch[2]), 0, 0);
      return parsedDate;
    }

    return parsedDate;
  }

  function isTrueLike(value) {
    const normalized = String(value == null ? "" : value).trim().toLowerCase();
    return normalized === "true" || normalized === "yes" || normalized === "1";
  }

  function isFalseLike(value) {
    const normalized = String(value == null ? "" : value).trim().toLowerCase();
    return normalized === "false" || normalized === "no" || normalized === "0";
  }

  function getNextWorkspaceEvent() {
    const now = Date.now();
    return cachedWorkspaceEvents
      .map((event) => ({ event, startsAt: parseWorkspaceDate(event?.startsAt) }))
      .filter(({ startsAt }) => startsAt && startsAt.getTime() >= now)
      .sort((left, right) => left.startsAt.getTime() - right.startsAt.getTime())[0]?.event || null;
  }

  function getCountdownDays(targetDate) {
    if (!(targetDate instanceof Date) || Number.isNaN(targetDate.getTime())) {
      return null;
    }

    const diffMs = targetDate.getTime() - Date.now();
    if (diffMs <= 0) {
      return { days: "0", isPast: true };
    }

    return {
      days: String(Math.ceil(diffMs / 86400000)),
      isPast: false
    };
  }

  function updatePlannerCountdown(targetDate, eventTitle) {
    const countdownRoot = plannerSummaryEl.querySelector("[data-planner-countdown]");
    if (!countdownRoot) {
      return;
    }

    const dayEl = countdownRoot.querySelector("[data-countdown-days]");
    const summaryEl = countdownRoot.querySelector("[data-countdown-summary]");
    const parts = getCountdownDays(targetDate);

    if (!dayEl || !summaryEl || !parts) {
      return;
    }

    dayEl.textContent = parts.days;
    summaryEl.textContent = parts.isPast
      ? `${eventTitle} is happening now or has already started.`
      : `${parts.days} days until ${eventTitle.toLowerCase()}.`;
  }

  function startPlannerCountdown(targetDate, eventTitle) {
    if (plannerCountdownTimer) {
      window.clearInterval(plannerCountdownTimer);
      plannerCountdownTimer = null;
    }

    if (!(targetDate instanceof Date) || Number.isNaN(targetDate.getTime())) {
      return;
    }

    updatePlannerCountdown(targetDate, eventTitle);
    plannerCountdownTimer = window.setInterval(() => {
      updatePlannerCountdown(targetDate, eventTitle);
    }, 60000);
  }

  function toIsoDateString(date) {
    if (!(date instanceof Date) || Number.isNaN(date.getTime())) {
      return "";
    }

    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
  }

  function createLocalDate(year, monthIndex, day) {
    const date = new Date(year, monthIndex, day);
    return Number.isNaN(date.getTime()) ? null : date;
  }

  function getMonthIndexFromLabel(label) {
    const monthLookup = {
      january: 0,
      jan: 0,
      february: 1,
      feb: 1,
      march: 2,
      mar: 2,
      april: 3,
      apr: 3,
      may: 4,
      june: 5,
      jun: 5,
      july: 6,
      jul: 6,
      august: 7,
      aug: 7,
      september: 8,
      sep: 8,
      sept: 8,
      october: 9,
      oct: 9,
      november: 10,
      nov: 10,
      december: 11,
      dec: 11
    };

    const normalized = String(label || "").trim().toLowerCase().replace(/\.$/, "");
    return Number.isInteger(monthLookup[normalized]) ? monthLookup[normalized] : -1;
  }

  function addDays(date, days) {
    if (!(date instanceof Date) || Number.isNaN(date.getTime())) {
      return null;
    }

    return createLocalDate(date.getFullYear(), date.getMonth(), date.getDate() + Number(days || 0));
  }

  function getReferenceWeddingDate() {
    const activeEvents = cachedEvents.filter((event) => !isFalseLike(event?.active));
    const ceremonyEvent = activeEvents.find((event) => /^\s*ceremony\s*$/i.test(String(event?.title || "").trim()) || /\bceremony\b/i.test(String(event?.title || "")));
    if (ceremonyEvent?.date) {
      return String(ceremonyEvent.date || "").trim();
    }

    const mainEvent = activeEvents.find((event) => isTrueLike(event?.main) && String(event?.date || "").trim());
    if (mainEvent?.date) {
      return String(mainEvent.date || "").trim();
    }

    const datedEvent = activeEvents
      .filter((event) => String(event?.date || "").trim())
      .sort((left, right) => {
        const leftDate = parseEventDateTime({ date: left.date, startsAt: left.startsAt || "00:00" })?.getTime() || 0;
        const rightDate = parseEventDateTime({ date: right.date, startsAt: right.startsAt || "00:00" })?.getTime() || 0;
        return leftDate - rightDate;
      })[0];
    return String(datedEvent?.date || "").trim();
  }

  function guessEventDateFromPrompt(prompt) {
    const text = String(prompt || "").trim();
    if (!text) {
      return "";
    }

    const isoMatch = text.match(/\b(20\d{2})-(\d{2})-(\d{2})\b/);
    if (isoMatch) {
      return `${isoMatch[1]}-${isoMatch[2]}-${isoMatch[3]}`;
    }

    const numericMatch = text.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);
    if (numericMatch) {
      const month = Number(numericMatch[1]);
      const day = Number(numericMatch[2]);
      const hasYear = Boolean(numericMatch[3]);
      let year = Number(numericMatch[3] || new Date().getFullYear());
      if (year < 100) {
        year += 2000;
      }
      let candidate = createLocalDate(year, month - 1, day);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      if (!hasYear && candidate && candidate < today) {
        candidate = createLocalDate(year + 1, month - 1, day);
      }
      return toIsoDateString(candidate);
    }

    const monthMatch = text.match(/\b(january|jan\.?|february|feb\.?|march|mar\.?|april|apr\.?|may|june|jun\.?|july|jul\.?|august|aug\.?|september|sept?\.?|october|oct\.?|november|nov\.?|december|dec\.?)\s+(\d{1,2})(?:st|nd|rd|th)?(?:,\s*(\d{4}))?\b/i);
    if (monthMatch) {
      const monthIndex = getMonthIndexFromLabel(monthMatch[1]);
      const day = Number(monthMatch[2]);
      const hasYear = Boolean(monthMatch[3]);
      const year = Number(monthMatch[3] || new Date().getFullYear());
      if (monthIndex >= 0) {
        let candidate = createLocalDate(year, monthIndex, day);
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        if (!hasYear && candidate && candidate < today) {
          candidate = createLocalDate(year + 1, monthIndex, day);
        }
        return toIsoDateString(candidate);
      }
    }

    if (/\bwedding day\b|\bday of the wedding\b|\bceremony day\b/i.test(text)) {
      return getReferenceWeddingDate();
    }

    const today = new Date();
    if (/\bday after tomorrow\b/i.test(text)) {
      return toIsoDateString(addDays(today, 2));
    }
    if (/\btomorrow\b/i.test(text)) {
      return toIsoDateString(addDays(today, 1));
    }
    if (/\btoday\b/i.test(text)) {
      return toIsoDateString(today);
    }

    return "";
  }

  function guessEventTimeFromPrompt(prompt) {
    const text = String(prompt || "").trim();
    if (!text) {
      return "";
    }

    if (/\bnoon\b/i.test(text)) {
      return "12:00";
    }
    if (/\bmidnight\b/i.test(text)) {
      return "00:00";
    }

    const meridiemMatch = text.match(/\b(\d{1,2})(?::(\d{2}))?\s*([ap])(?:\.?\s*m\.?)\b/i);
    if (meridiemMatch) {
      let hours = Number(meridiemMatch[1]) % 12;
      if (String(meridiemMatch[3] || "").toLowerCase() === "p") {
        hours += 12;
      }
      const minutes = String(meridiemMatch[2] || "00").padStart(2, "0");
      return `${String(hours).padStart(2, "0")}:${minutes}`;
    }

    const twentyFourHourMatch = text.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);
    if (twentyFourHourMatch) {
      return `${String(twentyFourHourMatch[1]).padStart(2, "0")}:${twentyFourHourMatch[2]}`;
    }

    return "";
  }

  function normalizePromptText(text) {
    return String(text || "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function escapeRegex(value) {
    return String(value || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  function buildLooseTypePattern(type) {
    const tokens = String(type || "")
      .trim()
      .split(/\s+/)
      .filter(Boolean)
      .map((token, index, array) => {
        if (index === array.length - 1 && !/s$/i.test(token) && token.length > 3) {
          return `${escapeRegex(token)}s?`;
        }
        return escapeRegex(token);
      });

    return tokens.length ? new RegExp(`\\b${tokens.join("\\s+")}\\b`, "i") : null;
  }

  function guessAssignedToFromPrompt(prompt) {
    const text = normalizePromptText(prompt);
    if (!text) {
      return "";
    }

    const matches = getGuestTypeOptions().filter((type) => {
      const normalizedType = String(type || "").trim();
      if (!normalizedType) {
        return false;
      }

      const directPattern = buildLooseTypePattern(normalizedType);
      if (directPattern?.test(text)) {
        return true;
      }

      return false;
    });

    return dedupeTokens(matches).join(", ");
  }

  function getKnownEventLocations() {
    return Array.from(new Set(
      cachedEvents
        .map((event) => String(event?.location || "").trim())
        .filter(Boolean)
    )).sort((left, right) => right.length - left.length);
  }

  function guessEventLocationFromPrompt(prompt) {
    const text = normalizePromptText(prompt);
    if (!text) {
      return "";
    }

    const knownLocation = getKnownEventLocations().find((location) => new RegExp(`\\b${escapeRegex(location)}\\b`, "i").test(text));
    if (knownLocation) {
      return knownLocation;
    }

    const locationMatch = text.match(/\b(?:at|in)\s+the\s+([^,.;]+?)(?=\s+\b(?:on|with|for|by|before|after|during)\b|[,.;&]|$)/i)
      || text.match(/\b(?:at|in)\s+((?:courtyard|church|chapel|sanctuary|garden|patio|terrace|ballroom|hall|barn|venue|house|cabin|hotel|lobby|suite|salon|studio|kitchen|dining room|living room|bridal suite|groom suite|reception tent|tent|porch|deck|lawn|gazebo|vineyard|orchard|parking lot|driveway)[^,.;]*?)(?=\s+\b(?:on|with|for|by|before|after|during)\b|[,.;&]|$)/i);
    if (!locationMatch) {
      return "";
    }

    const candidate = String(locationMatch[1] || "")
      .replace(/^(the)\s+/i, "")
      .trim()
      .replace(/\s+/g, " ");

    if (!candidate) {
      return "";
    }

    if (/^(?:\d{1,2}(?::\d{2})?\s*[ap]\.?\s*m\.?|[01]?\d:\d{2}|noon|midnight)$/i.test(candidate)) {
      return "";
    }

    if (/^(?:jan\.?|feb\.?|mar\.?|apr\.?|may|jun\.?|jul\.?|aug\.?|sep\.?|sept\.?|oct\.?|nov\.?|dec\.?)\s+\d{1,2}$/i.test(candidate)) {
      return "";
    }

    if (/\b(?:planning|departure|arrival|breakfast|brunch|lunch|dinner|photos|ceremony|reception)\b/i.test(candidate)
      && !/\b(?:courtyard|church|chapel|sanctuary|garden|patio|terrace|ballroom|hall|barn|venue|house|cabin|hotel|lobby|suite|salon|studio|kitchen|dining room|living room|tent|porch|deck|lawn|gazebo|vineyard|orchard|parking lot|driveway)\b/i.test(candidate)) {
      return "";
    }

    return candidate;
  }

  function guessMainEventFromPrompt(prompt) {
    const text = normalizePromptText(prompt);
    if (!text) {
      return null;
    }

    if (/\bmain event\b|\bprimary event\b/i.test(text)) {
      return true;
    }

    if (/\b(ceremony|reception|cocktail hour|vows|first dance|send[- ]?off|grand exit|wedding dinner)\b/i.test(text)) {
      return true;
    }

    if (/\b(photo|photos|portrait|portraits|prep|getting ready|breakfast|brunch|shower|reminder|hair|makeup)\b/i.test(text)) {
      return false;
    }

    return null;
  }

  function guessEventTitleFromPrompt(prompt) {
    const normalized = normalizePromptText(prompt);
    if (!normalized) {
      return "";
    }

    const quotedMatch = normalized.match(/["“”']([^"“”']{2,80})["“”']/);
    if (quotedMatch) {
      return String(quotedMatch[1] || "").trim();
    }

    let title = normalized
      .replace(/^(please\s+)?(?:add|create|schedule|plan|set up|put in|make)\s+(?:an?\s+)?(?:event|timeline item|reminder)\s+(?:for\s+)?/i, "")
      .replace(/^(please\s+)?(?:add|create|schedule|plan|set up|put in|make)\s+/i, "")
      .replace(/^(?:on\s+)?(?:wedding day|day of the wedding|ceremony day|today|tomorrow)\s+/i, "")
      .replace(/^(?:on\s+)?(?:\d{1,2}\/\d{1,2}(?:\/\d{2,4})?|(?:january|jan\.?|february|feb\.?|march|mar\.?|april|apr\.?|may|june|jun\.?|july|jul\.?|august|aug\.?|september|sep\.?|sept\.?|october|oct\.?|november|nov\.?|december|dec\.?)\s+\d{1,2}(?:st|nd|rd|th)?(?:,\s*\d{4})?)\s+/i, "")
      .replace(/^(?:at\s+)?(?:\d{1,2}(?::\d{2})?\s*[ap]\.?\s*m\.?|[01]?\d:\d{2}|noon|midnight)\s+/i, "");

    const firstClause = title.split(/\b(?:at|in|on|with|for|by|before|after|during)\b/i)[0];
    title = String(firstClause || title)
      .replace(/\b\d{1,2}:\d{2}\s*[ap]\.?\s*m\.?\b/ig, "")
      .replace(/\b\d{1,2}\s*[ap]\.?\s*m\.?\b/ig, "")
      .replace(/\b\d{1,2}\/\d{1,2}(?:\/\d{2,4})?\b/g, "")
      .replace(/\b(january|jan\.?|february|feb\.?|march|mar\.?|april|apr\.?|may|june|jun\.?|july|jul\.?|august|aug\.?|september|sep\.?|sept\.?|october|oct\.?|november|nov\.?|december|dec\.?)\s+\d{1,2}(?:st|nd|rd|th)?(?:,\s*\d{4})?(?=\s|$)/ig, "")
      .replace(/[,:;.\-]+$/g, "")
      .trim();

    if (!title) {
      const actionMatch = normalized.match(/\b(?:do|have|hold|plan|schedule|add|create)\s+([^,.;]+?)(?=\s+\b(?:at|in|on|with|for|by|before|after|during)\b|[,.;&]|$)/i);
      title = String(actionMatch?.[1] || "").trim();
    }

    if (!title) {
      return "";
    }

    return `${title.charAt(0).toUpperCase()}${title.slice(1)}`;
  }

  function guessEventFormValuesFromPrompt(prompt) {
    const title = guessEventTitleFromPrompt(prompt);
    const date = guessEventDateFromPrompt(prompt);
    const startsAt = guessEventTimeFromPrompt(prompt);
    const endsAt = "";
    const location = guessEventLocationFromPrompt(prompt);
    const assignedTo = guessAssignedToFromPrompt(prompt);
    const main = guessMainEventFromPrompt(prompt);

    return {
      title,
      date,
      startsAt,
      endsAt,
      location,
      assignedTo,
      main
    };
  }

  function buildEventMessageTemplate(values) {
    const title = String(values?.title || "").trim();
    const time = formatEventTimeRange(values?.startsAt, values?.endsAt);
    const date = formatEventDate(values?.date);
    const location = String(values?.location || "").trim();
    const assignedTo = String(values?.assignedTo || "").trim();
    const audience = assignedTo || "everyone";
    const schedule = [time, date].filter(Boolean).join(" on ");

    if (!title || !schedule) {
      return "";
    }

    const locationPart = location ? ` in ${location}` : "";
    return `Hope & Caleb update: ${title} for ${audience} is at ${schedule}${locationPart}. Please plan to be there a few minutes early.`;
  }

  function applyEventPromptGuess() {
    if (!eventForm) {
      return;
    }

    const promptField = eventForm.elements.namedItem("eventPrompt");
    const prompt = normalizePromptText(promptField?.value || "");
    if (!prompt) {
      setStatus(eventPromptStatusEl, "Add a short prompt first so I have something to infer from.", "error");
      promptField?.focus();
      return;
    }

    const guessed = guessEventFormValuesFromPrompt(prompt);
    const nextValues = {};
    if (guessed.title) nextValues.title = guessed.title;
    if (guessed.date) nextValues.date = guessed.date;
    if (guessed.startsAt) nextValues.startsAt = guessed.startsAt;
    if (guessed.endsAt) nextValues.endsAt = guessed.endsAt;
    if (guessed.location) nextValues.location = guessed.location;
    if (typeof guessed.main === "boolean") nextValues.main = guessed.main ? "true" : "false";
    const currentMessageTemplate = String(eventForm.elements.namedItem("messageTemplate")?.value || "").trim();
    const messageTemplate = buildEventMessageTemplate(guessed);
    if (messageTemplate && !currentMessageTemplate) {
      nextValues.messageTemplate = messageTemplate;
    }
    fillForm(eventForm, nextValues);

    if (guessed.assignedTo) {
      renderEventAssignedTypeOptions(guessed.assignedTo);
    }

    const guessedFields = [
      guessed.title ? "title" : "",
      guessed.date ? "date" : "",
      guessed.startsAt || guessed.endsAt ? "time" : "",
      guessed.location ? "location" : "",
      messageTemplate && !currentMessageTemplate ? "message template" : "",
      guessed.assignedTo ? "assigned to" : "",
      typeof guessed.main === "boolean" ? "main event" : ""
    ].filter(Boolean);

    if (guessedFields.length) {
      setStatus(eventPromptStatusEl, `Filled ${guessedFields.join(", ")} with best guesses. Review before saving.`, "success");
      setStatus(eventStatusEl, "", "");
      return;
    }

    setStatus(eventPromptStatusEl, "I could not infer much from that prompt yet. Try including a title, date, time, or location.", "pending");
  }

  function isSafeImageUrl(value) {
    try {
      const url = new URL(String(value || "").trim(), window.location.href);
      return url.protocol === "https:" || url.protocol === "http:";
    } catch (_) {
      return false;
    }
  }

  function displayImageUrl(value) {
    const rawUrl = String(value || "").trim();
    try {
      const url = new URL(rawUrl, window.location.href);
      const isLegacyDriveThumbnail = url.hostname === "drive.google.com" && url.pathname === "/thumbnail";
      const fileId = isLegacyDriveThumbnail ? url.searchParams.get("id") : "";
      return fileId
        ? `https://drive.usercontent.google.com/download?id=${encodeURIComponent(fileId)}&export=view&authuser=0`
        : rawUrl;
    } catch (_) {
      return rawUrl;
    }
  }

  async function prepareTodoPhoto(file) {
    if (!file) return null;
    if (!String(file.type || "").startsWith("image/")) {
      throw new Error("Choose an image file for the task snapshot.");
    }

    const previewUrl = URL.createObjectURL(file);
    const source = await new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = () => reject(new Error("This photo format cannot be prepared in the browser. Please choose a JPG or PNG."));
      image.src = previewUrl;
    });
    const longestSide = Math.max(source.naturalWidth || source.width, source.naturalHeight || source.height);
    const scale = longestSide > 1600 ? 1600 / longestSide : 1;
    const width = Math.max(1, Math.round((source.naturalWidth || source.width) * scale));
    const height = Math.max(1, Math.round((source.naturalHeight || source.height) * scale));
    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    canvas.getContext("2d").drawImage(source, 0, 0, width, height);
    const dataUrl = canvas.toDataURL("image/jpeg", 0.82);
    const encoded = dataUrl.split(",")[1] || "";
    if (!encoded || encoded.length > 6.5 * 1024 * 1024) {
      URL.revokeObjectURL(previewUrl);
      throw new Error("This photo is still too large. Please choose a smaller image.");
    }
    return {
      previewUrl,
      data: encoded,
      contentType: "image/jpeg",
      fileName: `${String(file.name || "task-photo").replace(/\.[^.]+$/, "") || "task-photo"}.jpg`
    };
  }

  function parseDelimitedValues(value) {
    return String(value || "")
      .split(/[\n,;]+/)
      .map((item) => String(item || "").trim())
      .filter(Boolean);
  }

  function formatDelimitedValues(items) {
    return Array.isArray(items)
      ? items.map((item) => String(item || "").trim()).filter(Boolean).join(", ")
      : "";
  }

  function parseEventListItems(value) {
    const normalized = String(value || "").replace(/\r/g, "").trim();
    if (!normalized) {
      return [];
    }

    const rawItems = normalized.includes("\n")
      ? normalized.split(/\n+/)
      : normalized.split(/[;,]+/);

    return rawItems
      .map((item) => String(item || "").trim())
      .filter(Boolean)
      .map((item) => {
        const match = item.match(/^\[(x|X| )\]\s*(.+)$/);
        if (match) {
          return {
            label: String(match[2] || "").trim(),
            checked: String(match[1] || "").trim().toLowerCase() === "x"
          };
        }

        return {
          label: item,
          checked: false
        };
      })
      .filter((item) => item.label);
  }

  function serializeEventListItems(items) {
    return Array.isArray(items)
      ? items
        .map((item) => {
          const label = String(item?.label || item || "").trim();
          if (!label) {
            return "";
          }
          return `[${item?.checked ? "x" : " "}] ${label}`;
        })
        .filter(Boolean)
        .join("\n")
      : "";
  }

  function formatEventListItemsForEditor(value) {
    return serializeEventListItems(parseEventListItems(value));
  }

      : "None yet.";
    const systemPrompt = "You are a practical event-planning assistant. Return clean JSON only. Create realistic, useful planning outputs based on the event context. Keep items concise and actionable.";
    const userPrompt = [
      `Help me plan this event and turn my notes into ${goalSentence}.`,

      "Event context:",

      "",
      "Focus on these outputs:",
      goals.includes("todo items")

      `System:\n${systemPrompt}`,

  function setEventAiVoiceState(eventId, nextState = {}) {
    const normalizedEventId = String(eventId || "").trim();
    if (!normalizedEventId) {
      return;
    }

    const currentState = getEventAiVoiceState(normalizedEventId);
    const mergedState = {
      ...currentState,
      ...nextState
    };
    eventAiVoiceStates.set(normalizedEventId, mergedState);

    if (!eventDetailShellEl || selectedEventDetailId !== normalizedEventId) {

    eventDetailShellEl.querySelectorAll("[data-event-workspace-mic]").forEach((button) => {

      button.setAttribute("aria-pressed", mergedState.isListening ? "true" : "false");
      button.classList.toggle("event-detail-ai-mic-button--active", mergedState.isListening);
      button.disabled = !EventWorkspaceSpeechRecognition;
    });
    eventDetailShellEl.querySelectorAll("[data-event-workspace-mic-status]").forEach((statusEl) => {
      statusEl.textContent = mergedState.status || "";
      statusEl.classList.toggle("event-detail-ai-mic-status--error", Boolean(mergedState.error));
    });

  function mergeVoiceTranscriptIntoNotes(existingValue, transcript) {
    const currentValue = String(existingValue || "").trim();
    const nextTranscript = String(transcript || "").trim();
    if (!nextTranscript) {
      return currentValue;
    }
    if (!currentValue) {
      return nextTranscript;
    }

    const currentWords = currentValue.split(/\s+/);
    const nextWords = nextTranscript.split(/\s+/);
    const normalizeWord = (word) => String(word || "").toLocaleLowerCase().replace(/[^\p{L}\p{N}']/gu, "");
    const maxOverlap = Math.min(currentWords.length, nextWords.length);
    let overlap = 0;
    for (let size = maxOverlap; size > 0; size -= 1) {
      const currentTail = currentWords.slice(-size).map(normalizeWord).join(" ");
      const nextStart = nextWords.slice(0, size).map(normalizeWord).join(" ");
      if (currentTail && currentTail === nextStart) {
        overlap = size;
        break;
      }
    }
    return overlap >= nextWords.length
      ? currentValue
      : `${currentValue} ${nextWords.slice(overlap).join(" ")}`.trim();
  }

  function normalizeVoiceTextForInput(input, value) {
    let normalizedValue = String(value || "");
    if (input?.hasAttribute("data-voice-no-period")) {
      normalizedValue = normalizedValue.replace(/[.!?…]+\s*$/u, "");
    }
    if (input?.hasAttribute("data-voice-no-auto-capitalization")) {
      normalizedValue = normalizedValue.replace(/^(\s*)(\p{Lu})/u, (_match, leadingSpace, firstLetter) => `${leadingSpace}${firstLetter.toLocaleLowerCase()}`);
    }
    return normalizedValue;
  }

  function isNewFinalSpeechResult(recognition, index, transcript) {
    if (!recognition.__finalResultValues) {
      recognition.__finalResultValues = new Map();
    }
    const normalizedTranscript = String(transcript || "").trim().toLocaleLowerCase();
    if (recognition.__finalResultValues.get(index) === normalizedTranscript) {
      return false;
    }
    recognition.__finalResultValues.set(index, normalizedTranscript);
    return true;
  }

  function stopVoiceInputAfterListeningWindow(recognition) {
    clearVoiceInputListeningWindow(recognition);
    recognition.__voiceInputTimeout = window.setTimeout(() => {
      recognition.__stoppedManually = true;
      recognition.__codexStoppedManually = true;
      recognition.__autoStopped = true;
      try { recognition.stop(); } catch (_) {}
    }, VOICE_INPUT_LISTENING_MS);
  }

  function clearVoiceInputListeningWindow(recognition) {
    if (recognition?.__voiceInputTimeout) {
      window.clearTimeout(recognition.__voiceInputTimeout);
      recognition.__voiceInputTimeout = null;
    }
  }

  function stopEventWorkspaceVoiceRecognition(nextStatus, isError = false) {
    const activeRecognition = activeEventVoiceRecognition;
    if (!activeRecognition) {
      return;
    }

    activeEventVoiceRecognition = null;
    activeRecognition.__codexStoppedManually = true;

    try {
      activeRecognition.stop();
    } catch (error) {
      // Some browsers throw if stop() is called during teardown.
    }

    if (activeRecognition.__eventId) {
      setEventAiVoiceState(activeRecognition.__eventId, {
        isListening: false,
        status: nextStatus || "Dictation stopped.",
        error: isError
      });
    }
  }

  function toggleEventWorkspaceVoiceInput() {
    const eventItem = getEventById(selectedEventDetailId);
    if (!eventItem || !eventDetailShellEl) {
      return;
    }

    const normalizedEventId = String(eventItem.id || "").trim();
    if (!EventWorkspaceSpeechRecognition) {
      setEventAiVoiceState(normalizedEventId, {
        isListening: false,
        status: "Voice input works in supported browsers like Chrome.",
        error: true
      });
      return;
    }

    if (activeEventVoiceRecognition?.__eventId === normalizedEventId) {
      stopEventWorkspaceVoiceRecognition("Dictation stopped.");
      return;
    }

    if (activeEventVoiceRecognition) {
      stopEventWorkspaceVoiceRecognition("Dictation stopped.");
    }

    const planningNotesField = eventDetailShellEl.querySelector("[data-event-workspace-note]");
    if (!planningNotesField) {
      return;
    }

    const recognition = new EventWorkspaceSpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = "en-US";
    recognition.__eventId = normalizedEventId;
    recognition.__baseValue = planningNotesField.value;
    recognition.__finalTranscript = "";
    recognition.__finalResultValues = new Map();
    recognition.__codexStoppedManually = false;

    recognition.onstart = () => {
      stopVoiceInputAfterListeningWindow(recognition);
      setEventAiVoiceState(normalizedEventId, {
        isListening: true,
        status: "Listening... speak naturally and tap again to stop.",
        error: false
      });
    };

    recognition.onresult = (event) => {
      let interimTranscript = "";
      for (let index = event.resultIndex; index < event.results.length; index += 1) {
        const result = event.results[index];
        const transcript = String(result?.[0]?.transcript || "").trim();
        if (!transcript) {
          continue;
        }
        if (result.isFinal && isNewFinalSpeechResult(recognition, index, transcript)) {
          recognition.__finalTranscript = mergeVoiceTranscriptIntoNotes(recognition.__finalTranscript, transcript);
        } else if (!result.isFinal) {
          interimTranscript = mergeVoiceTranscriptIntoNotes(interimTranscript, transcript);
        }
      }

      planningNotesField.value = mergeVoiceTranscriptIntoNotes(
        recognition.__baseValue,
        mergeVoiceTranscriptIntoNotes(recognition.__finalTranscript, interimTranscript)
      );
      planningNotesField.dispatchEvent(new Event("input", { bubbles: true }));
      setEventAiVoiceState(normalizedEventId, {
        isListening: true,
        status: interimTranscript ? "Listening... release when your thought is complete." : "Listening...",
        error: false
      });
    };

    recognition.onerror = (event) => {
      clearVoiceInputListeningWindow(recognition);
      const errorCode = String(event?.error || "").trim();
      const message = errorCode === "not-allowed"
        ? "Microphone permission was blocked."
        : errorCode === "no-speech"
          ? "No speech was detected. Try again and speak a little closer to the mic."
          : "Voice input ran into a browser error.";
      activeEventVoiceRecognition = null;
      setEventAiVoiceState(normalizedEventId, {
        isListening: false,
        status: message,
        error: true
      });
    };

    recognition.onend = () => {
      clearVoiceInputListeningWindow(recognition);
      const finalStatus = recognition.__finalTranscript
        ? "Dictation added to your notes."
        : "Dictation stopped.";
      const wasManualStop = recognition.__codexStoppedManually;
      activeEventVoiceRecognition = null;
      setEventAiVoiceState(normalizedEventId, {
        isListening: false,
        status: recognition.__autoStopped ? "Dictation stopped after 3 seconds." : wasManualStop ? "Dictation stopped." : finalStatus,
        error: false
      });
    };

    activeEventVoiceRecognition = recognition;

    try {
      recognition.start();
    } catch (error) {
      activeEventVoiceRecognition = null;
      setEventAiVoiceState(normalizedEventId, {
        isListening: false,
        status: "Voice input could not start right now. Please try again.",
        error: true
      });
    }
  }

  function setEventAiDraft(eventId, patch = {}) {
    const normalizedEventId = String(eventId || "").trim();
    if (!normalizedEventId) {
      return;
    }

    const current = getEventAiDraft(normalizedEventId);
    eventAiDrafts.set(normalizedEventId, {
      ...current,
      ...patch
    });
  }

  function toDateInputValue(value) {
    const raw = String(value || "").trim();
    if (!raw) {
      return "";
    }

    if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) {
      return raw;
    }

    const parsed = new Date(raw);
    if (Number.isNaN(parsed.getTime())) {
      return "";
    }

    return `${parsed.getFullYear()}-${String(parsed.getMonth() + 1).padStart(2, "0")}-${String(parsed.getDate()).padStart(2, "0")}`;
  }

  function toTimeInputValue(value) {
    const raw = String(value || "").trim();
    if (!raw) {
      return "";
    }

    const twentyFourHourMatch = raw.match(/\b(\d{1,2}):(\d{2})\b/);
    if (twentyFourHourMatch && !/[AP]M/i.test(raw)) {
      return `${String(Number(twentyFourHourMatch[1]) % 24).padStart(2, "0")}:${twentyFourHourMatch[2]}`;
    }

    const meridiemMatch = raw.match(/\b(\d{1,2}):(\d{2})\s*([AP]M)\b/i);
    if (meridiemMatch) {
      let hours = Number(meridiemMatch[1]) % 12;
      if (meridiemMatch[3].toUpperCase() === "PM") {
        hours += 12;
      }
      return `${String(hours).padStart(2, "0")}:${meridiemMatch[2]}`;
    }

    const parsed = new Date(raw);
    if (Number.isNaN(parsed.getTime())) {
      return "";
    }

    return `${String(parsed.getHours()).padStart(2, "0")}:${String(parsed.getMinutes()).padStart(2, "0")}`;
  }

  function formatAiTodoSchedule(todo) {
    const dateLabel = formatEventDate(todo?.dueDate) || "";
    const timeLabel = formatEventTimeRange(toTimeInputValue(todo?.dueTiming || ""), "") || "";
    return [dateLabel, timeLabel].filter(Boolean).join(", ") || String(todo?.dueTiming || "").trim() || "No due timing suggested";
  }

  function updateEventAiPlan(eventId, recipe) {
    const normalizedEventId = String(eventId || "").trim();
    const currentPlan = getEventAiPlan(normalizedEventId);
    if (!normalizedEventId || !currentPlan || typeof recipe !== "function") {

    }

    const nextPlan = recipe(currentPlan);
    if (!nextPlan) {
      return;
    }

    eventAiPlans.set(normalizedEventId, nextPlan);
    renderEventDetail();
  }

  async function generateEventPlanInApp() {
    const eventItem = getEventById(selectedEventDetailId);
    if (!eventItem || !eventDetailShellEl) {
      return;
    }

    const planningNotesField = eventDetailShellEl.querySelector("[data-event-workspace-note]");
    const generateButton = eventDetailShellEl.querySelector("[data-event-workspace-generate]");
    const goals = Array.from(eventDetailShellEl.querySelectorAll("[data-event-workspace-goal][aria-pressed='true']"))
      .map((button) => String(button.dataset.eventWorkspaceGoalValue || "").trim())
      .filter(Boolean);
    const planningNotes = String(planningNotesField?.value || "").trim();

    setEventAiDraft(eventItem.id, {
      planningNotes,
      goals
    });

    try {
      requirePlannerAccess();
      if (generateButton) {
        generateButton.disabled = true;
      }
      setStatus(eventDetailStatusEl, "Generating event plan...", "pending");
      const prompts = buildEventAiPrompts(eventItem, {
        planningNotes,
        goals
      });
      const plan = await backendRequest("generateEventPlan", {
        eventId: String(eventItem.id || "").trim(),
        title: String(eventItem.title || "").trim(),
        date: String(eventItem.date || "").trim(),
        startsAt: String(eventItem.startsAt || "").trim(),
        location: String(eventItem.location || "").trim(),
        assignedTo: String(eventItem.assignedTo || "").trim(),
        reminderMinutes: Number(eventItem.reminderMinutes || 15),
        notes: String(eventItem.notes || "").trim(),
        planningNotes,
        goals,
        systemPrompt: prompts.systemPrompt,
        userPrompt: prompts.userPrompt,
        existingShots: getShotsForEvent(eventItem.id).map((shot) => ({
          title: String(shot.title || "").trim(),
          description: String(shot.description || "").trim(),
          notes: String(shot.notes || "").trim()
        }))
      });
      eventAiPlans.set(String(eventItem.id || "").trim(), plan);
      renderEventDetail();
      setStatus(eventDetailStatusEl, plan?.error ? `Plan generated with fallback content. ${plan.error}` : "Event plan generated in the app.", plan?.error ? "pending" : "success");
    } catch (error) {
      setStatus(eventDetailStatusEl, error.message || "Unable to generate event plan.", "error");
    } finally {
      if (generateButton) {
        generateButton.disabled = false;
      }
    }
  }

  function normalizeLookupValue(value) {
    return String(value || "").trim().toLowerCase();
  }

  function buildAiTodoNotes(todo) {
    const sections = [];
    if (todo?.notes) {
      sections.push(String(todo.notes).trim());
    }
    if (todo?.dueTiming) {
      sections.push(`Suggested timing: ${String(todo.dueTiming).trim()}`);
    }
    return sections.filter(Boolean).join("\n\n");
  }

  function formatAiChecklistItems(items) {
    return serializeEventListItems((items || []).map((item) => ({
      label: [
        item?.item,
        item?.quantity ? `(${item.quantity})` : "",
        item?.notes ? `- ${item.notes}` : ""
      ].filter(Boolean).join(" "),
      checked: false
    })));
  }

  function countAiChecklistItems(checklists) {
    return (Array.isArray(checklists) ? checklists : []).reduce((total, checklist) => {
      return total + (Array.isArray(checklist?.items) ? checklist.items.length : 0);
    }, 0);
  }

  function normalizeEventListType(value) {
    const normalized = normalizeLookupValue(value);
    return normalized.includes("pack") ? "packing" : "shopping";
  }

  function setActiveEventDetailTab(tabId) {
    const nextTab = normalizeLookupValue(tabId) || "overview";
    activeEventDetailTab = nextTab;
    window.sessionStorage.setItem(STORAGE_KEYS.eventDetailTab, activeEventDetailTab);

    if (!eventDetailShellEl) {
      return;
    }

    eventDetailShellEl.querySelectorAll("[data-event-detail-tab-toggle]").forEach((button) => {
      const isActive = normalizeLookupValue(button.dataset.eventDetailTabToggle) === nextTab;
      button.setAttribute("aria-selected", isActive ? "true" : "false");
      button.setAttribute("tabindex", isActive ? "0" : "-1");
    });
    eventDetailShellEl.querySelectorAll("[data-event-detail-panel]").forEach((panel) => {
      panel.hidden = normalizeLookupValue(panel.dataset.eventDetailPanel) !== nextTab;
    });
  }

  function openEventDetailSection(sectionId) {
    const normalizedSectionId = normalizeLookupValue(sectionId);
    if (!normalizedSectionId) {
      return;
    }

    setActiveEventDetailTab(normalizedSectionId);
    openEventDetailAccordionSections.clear();
    openEventDetailAccordionSections.add(normalizedSectionId);

    if (!eventDetailShellEl) {
      return;
    }

    eventDetailShellEl.querySelectorAll("[data-event-detail-accordion-toggle]").forEach((button) => {
      const isOpen = normalizeLookupValue(button.dataset.eventDetailAccordionToggle) === normalizedSectionId;
      button.setAttribute("aria-expanded", isOpen ? "true" : "false");
    });
    eventDetailShellEl.querySelectorAll("[data-event-detail-accordion-panel]").forEach((panel) => {
      panel.hidden = normalizeLookupValue(panel.dataset.eventDetailAccordionPanel) !== normalizedSectionId;
    });
  }

  function isEventDetailAccordionOpen(sectionId) {
    return openEventDetailAccordionSections.has(normalizeLookupValue(sectionId));
  }

  function toggleEventDetailAccordionSection(sectionId) {
    const normalizedSectionId = normalizeLookupValue(sectionId);
    if (!normalizedSectionId) {
      return;
    }

    if (openEventDetailAccordionSections.has(normalizedSectionId)) {
      openEventDetailAccordionSections.delete(normalizedSectionId);
    } else {
      openEventDetailAccordionSections.add(normalizedSectionId);
    }

    if (!eventDetailShellEl) {
      return;
    }

    eventDetailShellEl.querySelectorAll("[data-event-detail-accordion-toggle]").forEach((button) => {
      const isOpen = normalizeLookupValue(button.dataset.eventDetailAccordionToggle) === normalizedSectionId
        ? openEventDetailAccordionSections.has(normalizedSectionId)
        : openEventDetailAccordionSections.has(normalizeLookupValue(button.dataset.eventDetailAccordionToggle));
      button.setAttribute("aria-expanded", isOpen ? "true" : "false");
    });
    eventDetailShellEl.querySelectorAll("[data-event-detail-accordion-panel]").forEach((panel) => {
      panel.hidden = !openEventDetailAccordionSections.has(normalizeLookupValue(panel.dataset.eventDetailAccordionPanel));
    });
  }

  async function addAiPlanTodosToEvent(eventId, todos) {
    const normalizedEventId = String(eventId || "").trim();
    const suggestions = Array.isArray(todos) ? todos : [];
    if (!normalizedEventId || !suggestions.length) {
      throw new Error("Generate todo suggestions first.");
    }

    const previousTodos = cachedTodos;
    const existingTitles = new Set(getTodosForEvent(normalizedEventId).map((todo) => normalizeLookupValue(todo.title)));
    const savedTodos = [];
    let skippedCount = 0;

    try {
      requirePlannerAccess();
      setStatus(eventDetailStatusEl, "Adding AI todos...", "pending");
      for (const todo of suggestions) {
        const title = String(todo?.title || "").trim();
        const normalizedTitle = normalizeLookupValue(title);
        if (!normalizedTitle || existingTitles.has(normalizedTitle)) {
          skippedCount += 1;
          continue;
        }

        existingTitles.add(normalizedTitle);
        const optimisticTodo = {
          id: createClientId("todo"),
          eventId: normalizedEventId,
          title,
          notes: buildAiTodoNotes(todo),
          assignedTo: String(todo?.ownerSuggestion || "").trim(),
          startDate: "",
          dueDate: toDateInputValue(todo?.dueDate || todo?.dueTiming),
          priority: "Medium",
          status: "Not Started",
          isComplete: false,
          completedAt: "",
          imageUrl: "",
          smsMessage: "",
          reminderDate: "",
          category: "Event",
          tags: "AI Generated",
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };
        upsertCachedTodo(optimisticTodo);
        const savedTodo = await backendRequest("saveTodo", optimisticTodo);
        savedTodos.push(savedTodo);
      }

      cachedTodos = sortTodos(previousTodos);
      savedTodos.forEach((todo) => upsertCachedTodo(todo));
      if (!savedTodos.length) {
        setStatus(eventDetailStatusEl, "All suggested todos were already linked to this event.", "pending");
        return;
      }

      openEventDetailSection("todos");
      const skippedMessage = skippedCount ? ` Skipped ${skippedCount} duplicate${skippedCount === 1 ? "" : "s"}.` : "";
      setStatus(eventDetailStatusEl, `Added ${savedTodos.length} AI todo${savedTodos.length === 1 ? "" : "s"}.${skippedMessage}`, "success");
    } catch (error) {
      cachedTodos = previousTodos;
      rerenderTodoData();
      throw error;
    }
  }

  function updateAiTodoField(eventId, index, patch = {}) {
    updateEventAiPlan(eventId, (currentPlan) => ({
      ...currentPlan,
      todos: (Array.isArray(currentPlan.todos) ? currentPlan.todos : []).map((todo, todoIndex) => (
        todoIndex === Number(index)
          ? { ...todo, ...patch }
          : todo
      ))
    }));
  }

  function deleteAiTodoSuggestion(eventId, index) {
    updateEventAiPlan(eventId, (currentPlan) => ({
      ...currentPlan,
      todos: (Array.isArray(currentPlan.todos) ? currentPlan.todos : []).filter((_, todoIndex) => todoIndex !== Number(index))
    }));
  }

  async function addAiPlanListsToEvent(eventId, checklists) {
    const normalizedEventId = String(eventId || "").trim();
    const suggestions = Array.isArray(checklists) ? checklists : [];
    if (!normalizedEventId || !suggestions.length) {
      throw new Error("Generate list suggestions first.");
    }

    const previousLists = cachedEventLists;
    const existingTitles = new Set(getEventListsForEvent(normalizedEventId).map((list) => normalizeLookupValue(list.title)));
    const savedLists = [];
    let skippedCount = 0;

    try {
      requirePlannerAccess();
      setStatus(eventDetailStatusEl, "Adding AI lists...", "pending");
      for (const checklist of suggestions) {
        const title = String(checklist?.title || "").trim();
        const normalizedTitle = normalizeLookupValue(title);
        const items = formatAiChecklistItems(checklist?.items);
        if (!normalizedTitle || !items || existingTitles.has(normalizedTitle)) {
          skippedCount += 1;
          continue;
        }

        existingTitles.add(normalizedTitle);
        const optimisticList = {
          id: createClientId("event_list"),
          eventId: normalizedEventId,
          title,
          type: normalizeEventListType(checklist?.type),
          items,
          notes: checklist?.type ? `AI list type: ${String(checklist.type).trim()}` : "",
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };
        upsertCachedEventList(optimisticList);
        const savedList = await backendRequest("saveEventList", optimisticList);
        savedLists.push(savedList);
      }

      cachedEventLists = sortEventLists(previousLists);
      savedLists.forEach((list) => upsertCachedEventList(list));
      if (!savedLists.length) {
        setStatus(eventDetailStatusEl, "All suggested lists were already linked to this event.", "pending");
        return;
      }

      openEventDetailSection("lists");
      const savedItemCount = countAiChecklistItems(savedLists.map((list) => {
        const matchingChecklist = suggestions.find((checklist) => normalizeLookupValue(checklist?.title) === normalizeLookupValue(list.title));
        return matchingChecklist || { items: parseEventListItems(list.items).map((item) => ({ item: item.label })) };
      }));
      const itemMessage = savedItemCount
        ? ` with ${savedItemCount} item${savedItemCount === 1 ? "" : "s"}`
        : "";
      const skippedMessage = skippedCount ? ` Skipped ${skippedCount} duplicate${skippedCount === 1 ? "" : "s"}.` : "";
      setStatus(eventDetailStatusEl, `Added ${savedLists.length} AI list${savedLists.length === 1 ? "" : "s"}${itemMessage}.${skippedMessage}`, "success");
    } catch (error) {
      cachedEventLists = previousLists;
      rerenderEventListData();
      throw error;
    }
  }

  async function toggleEventListItemChecked(listId, itemIndex) {
    const normalizedListId = String(listId || "").trim();
    const index = Number(itemIndex);
    const eventList = cachedEventLists.find((item) => String(item.id || "").trim() === normalizedListId);
    if (!eventList || !Number.isInteger(index) || index < 0) {
      return;
    }

    const items = parseEventListItems(eventList.items);
    if (!items[index]) {
      return;
    }

    const previousLists = cachedEventLists;
    const serializedItems = serializeEventListItems(items.map((item, currentIndex) => currentIndex === index
      ? { ...item, checked: !item.checked }
      : item));

    try {
      requirePlannerAccess();
      upsertCachedEventList({
        ...eventList,
        items: serializedItems,
        updatedAt: new Date().toISOString()
      });
      const savedList = await backendRequest("saveEventList", {
        id: normalizedListId,
        eventId: String(eventList.eventId || "").trim(),
        title: String(eventList.title || "").trim(),
        type: String(eventList.type || "shopping").trim(),
        items: serializedItems,
        notes: String(eventList.notes || "").trim()
      });
      upsertCachedEventList(savedList);
    } catch (error) {
      cachedEventLists = previousLists;
      rerenderEventListData();
      setStatus(eventDetailStatusEl, error.message || "Unable to update list item.", "error");
    }
  }

  async function toggleEventTodoComplete(todoId) {
    const normalizedTodoId = String(todoId || "").trim();
    const todo = cachedTodos.find((item) => String(item.id || "").trim() === normalizedTodoId);
    if (!todo) {
      return;
    }

    const previousTodos = cachedTodos;
    const nextIsComplete = !todo.isComplete;

    try {
      requirePlannerAccess();
      setStatus(eventDetailStatusEl, nextIsComplete ? `Marking ${todo.title || "task"} complete...` : `Marking ${todo.title || "task"} incomplete...`, "pending");
      upsertCachedTodo({
        ...todo,
        isComplete: nextIsComplete,
        status: nextIsComplete ? "Done" : (String(todo.status || "").trim() === "Done" ? "Assigned" : String(todo.status || "Assigned").trim()),
        completedAt: nextIsComplete ? (todo.completedAt || new Date().toISOString()) : "",
        updatedAt: new Date().toISOString()
      });
      const savedTodo = await backendRequest("saveTodo", {
        id: String(todo.id || "").trim(),
        eventId: String(todo.eventId || "").trim(),
        title: String(todo.title || "").trim(),
        notes: String(todo.notes || "").trim(),
        assignedTo: String(todo.assignedTo || "").trim(),
        startDate: String(todo.startDate || "").trim(),
        dueDate: String(todo.dueDate || "").trim(),
        priority: String(todo.priority || "Medium").trim(),
        status: nextIsComplete ? "Done" : (String(todo.status || "").trim() === "Done" ? "Assigned" : String(todo.status || "Assigned").trim()),
        isComplete: nextIsComplete,
        completedAt: nextIsComplete ? (todo.completedAt || "") : "",
        imageUrl: String(todo.imageUrl || "").trim(),
        smsMessage: String(todo.smsMessage || "").trim(),
        reminderDate: String(todo.reminderDate || "").trim(),
        category: String(todo.category || "").trim(),
        tags: String(todo.tags || "").trim()
      });
      upsertCachedTodo(savedTodo);
      setStatus(eventDetailStatusEl, nextIsComplete ? `${todo.title || "Task"} marked complete.` : `${todo.title || "Task"} marked incomplete.`, "success");
    } catch (error) {
      cachedTodos = previousTodos;
      rerenderTodoData();
      setStatus(eventDetailStatusEl, error.message || "Unable to update task.", "error");
    }
  }

  async function updateEventTodoField(todoId, patch = {}) {
    const normalizedTodoId = String(todoId || "").trim();
    const todo = cachedTodos.find((item) => String(item.id || "").trim() === normalizedTodoId);
    if (!todo) {
      return;
    }

    const previousTodos = cachedTodos;
    const nextTodo = {
      ...todo,
      ...patch,
      updatedAt: new Date().toISOString()
    };

    try {
      requirePlannerAccess();
      upsertCachedTodo(nextTodo);
      const savedTodo = await backendRequest("saveTodo", {
        id: String(nextTodo.id || "").trim(),
        eventId: String(nextTodo.eventId || "").trim(),
        title: String(nextTodo.title || "").trim(),
        notes: String(nextTodo.notes || "").trim(),
        assignedTo: String(nextTodo.assignedTo || "").trim(),
        startDate: String(nextTodo.startDate || "").trim(),
        dueDate: String(nextTodo.dueDate || "").trim(),
        priority: String(nextTodo.priority || "Medium").trim(),
        status: String(nextTodo.status || (nextTodo.isComplete ? "Done" : "Assigned")).trim(),
        isComplete: Boolean(nextTodo.isComplete),
        completedAt: String(nextTodo.completedAt || "").trim(),
        imageUrl: String(nextTodo.imageUrl || "").trim(),
        smsMessage: String(nextTodo.smsMessage || "").trim(),
        reminderDate: String(nextTodo.reminderDate || "").trim(),
        category: String(nextTodo.category || "").trim(),
        tags: String(nextTodo.tags || "").trim()
      });
      upsertCachedTodo(savedTodo);
      setStatus(eventDetailStatusEl, `${nextTodo.title || "Task"} updated.`, "success");
    } catch (error) {
      cachedTodos = previousTodos;
      rerenderTodoData();
      setStatus(eventDetailStatusEl, error.message || "Unable to update task.", "error");
    }
  }

  function openEventWorkspace(eventId) {
    const eventItem = getEventById(eventId);
    if (!eventItem) {
      setStatus(eventDetailStatusEl, "That event could not be found.", "error");
      return;
    }

    selectedEventDetailId = String(eventItem.id || "").trim();
    activeEventDetailTab = "overview";
    window.sessionStorage.setItem(STORAGE_KEYS.eventDetailId, selectedEventDetailId);
    window.sessionStorage.setItem(STORAGE_KEYS.eventDetailTab, activeEventDetailTab);
    openEventDetailAccordionSections.clear();
    setActivePlannerPanel("event-detail");
    renderEventDetail();
    setStatus(eventDetailStatusEl, `Viewing ${eventItem.title}.`, "success");
  }

  function getShotEvent(shot) {
    return cachedEvents.find((event) => event.id === String(shot?.eventId || "").trim()) || null;
  }

  function getShotPriorityRank(priority) {
    switch (String(priority || "").trim().toLowerCase()) {
      case "high":
        return 0;
      case "medium":
        return 1;
      case "low":
        return 2;
      default:
        return 3;
    }
  }

  function getShotPriorityMeta(priority) {
    const normalized = String(priority || "Medium").trim().toLowerCase();
    if (normalized === "high") {
      return { label: "High", className: "shot-card__priority--high" };
    }
    if (normalized === "low") {
      return { label: "Low", className: "shot-card__priority--low" };
    }
    return { label: "Medium", className: "shot-card__priority--medium" };
  }

  function renderShots() {
    if (!cachedShots.length) {
      shotsListEl.innerHTML = '<p class="meta">No shot requests yet. Add photographer instructions tied to specific events here.</p>';
      return;
    }

    const groups = [];
    const seenGroups = new Map();

    cachedShots.forEach((shot) => {
      const shotEvent = getShotEvent(shot);
      const groupKey = String(shot.eventId || "").trim() || "__unassigned__";

      if (!seenGroups.has(groupKey)) {
        const schedule = shotEvent ? formatEventSchedule(shotEvent) : "";
        const nextGroup = {
          key: groupKey,
          title: shotEvent?.title || "Unassigned Event",
          schedule: schedule || (shotEvent ? "Date or time still needs to be added." : "Attach this shot to an event when you can."),
          items: []
        };
        seenGroups.set(groupKey, nextGroup);
        groups.push(nextGroup);
      }

      seenGroups.get(groupKey).items.push(shot);
    });

    shotsListEl.innerHTML = `
      <div class="shot-groups">
        ${groups.map((group) => `
          <details class="shot-group">
            <summary>
              <span class="shot-group__toggle" aria-hidden="true"></span>
              <span class="shot-group__summary-main">
                <h3>${escapeHtml(group.title)}</h3>
                <p class="meta">${escapeHtml(group.schedule)}</p>
              </span>
            </summary>
            <div class="shot-group__list">
              ${group.items.map((shot) => {
                const priority = getShotPriorityMeta(shot.priority);
                return `
                <article class="card shot-card ${shot.isComplete ? "shot-card--complete" : "shot-card--pending"}">
                  <div class="shot-card__header">
                    <button
                      class="button button--light shot-card__check"
                      type="button"
                      data-toggle-shot-complete="${escapeHtml(String(shot.id || ""))}"
                      aria-pressed="${shot.isComplete ? "true" : "false"}"
                      aria-label="${shot.isComplete ? "Mark incomplete" : "Mark complete"}: ${escapeHtml(shot.title || "shot")}">
                      ${shot.isComplete ? "✓" : ""}
                    </button>
                    <div class="shot-card__title">
                      <div class="shot-card__title-row">
                        <span class="shot-card__title-main">
                          <h4>${escapeHtml(shot.title || "Untitled shot")}</h4>
                          <button
                            class="button button--icon button--light event-card__edit shot-card__title-edit"
                            type="button"
                            data-edit-shot="${escapeHtml(String(shot.id || ""))}"
                            aria-label="Edit ${escapeHtml(shot.title || "shot")}">
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                              <path d="M12 20h9"/>
                              <path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"/>
                            </svg>
                          </button>
                          <button
                            class="button button--icon button--light event-detail-shot-delete"
                            type="button"
                            data-delete-shot="${escapeHtml(String(shot.id || ""))}"
                            aria-label="Delete ${escapeHtml(shot.title || "shot")}">
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                              <path d="M3 6h18"></path>
                              <path d="M8 6V4h8v2"></path>
                              <path d="M19 6l-1 14H6L5 6"></path>
                              <path d="M10 11v6"></path>
                              <path d="M14 11v6"></path>
                            </svg>
                          </button>
                        </span>
                        <span class="shot-card__priority ${priority.className}">
                          <span class="shot-card__priority-icon" aria-hidden="true"></span>
                          ${escapeHtml(priority.label)}
                        </span>
                      </div>
                      ${shot.description ? `<p>${escapeHtml(shot.description)}</p>` : ""}
                    </div>
                  </div>
                  <div class="shot-card__meta">
                    ${shot.peopleNeeded ? `<span>${escapeHtml(`People: ${shot.peopleNeeded}`)}</span>` : ""}
                    ${Number(shot.sortOrder || 0) ? `<span>${escapeHtml(`Order: ${shot.sortOrder}`)}</span>` : ""}
                  </div>
                  ${shot.notes ? `<p class="meta">${escapeHtml(shot.notes)}</p>` : ""}
                </article>
              `;
              }).join("")}
            </div>
          </details>
        `).join("")}
      </div>
    `;
  }

  function renderProjects() {
    if (!projectsListEl) return;
    const projects = cachedWorkspaceEvents
      .filter((event) => !String(event.startsAt || "").trim())
      .sort((left, right) => String(left.title || "").localeCompare(String(right.title || "")));

    if (!projects.length) {
      projectsListEl.innerHTML = '<p class="meta">No projects yet. Create one from Add to start organizing its tasks.</p>';
      return;
    }

    projectsListEl.innerHTML = projects.map((project) => {
      const tasks = cachedWorkspaceTasks
        .filter((task) => String(task.eventId || "") === String(project.id || ""))
        .sort((left, right) => Number(left.sortOrder || 0) - Number(right.sortOrder || 0));
      return `
        <details class="projects-accordion">
          <summary>
            <span class="projects-accordion__toggle" aria-hidden="true"></span>
            <span class="projects-accordion__title">${escapeHtml(project.title || "Untitled project")}</span>
            <span class="projects-accordion__actions">
              <button class="button button--icon projects-accordion__add" type="button" data-add-project-task="${escapeHtml(project.id)}" aria-label="Add task to ${escapeHtml(project.title || "project")}" title="Add task">+</button>
              <button class="button button--icon button--light projects-accordion__edit" type="button" data-edit-project="${escapeHtml(project.id)}" aria-label="Edit ${escapeHtml(project.title || "project")}" title="Edit project"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"></path></svg></button>
            </span>
            <span class="meta">${tasks.length} task${tasks.length === 1 ? "" : "s"}</span>
          </summary>
          <div class="projects-accordion__content">
            ${tasks.length ? tasks.map((task) => {

                ${renderWorkspaceTaskCompletionCheckbox(task)}

                <input class="project-task-row__due" type="date" value="${escapeHtml(normalizeWorkspaceTaskDueDate(task.dueAt))}" data-project-task-due data-project-task-id="${escapeHtml(task.id)}" aria-label="Due date for ${escapeHtml(task.title || "task")}">
                <button class="button button--icon button--light project-task-row__edit" type="button" data-edit-project-task="${escapeHtml(task.id)}" data-project-id="${escapeHtml(project.id)}" aria-label="Edit ${escapeHtml(task.title || "task")}" title="Edit"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"></path></svg></button>

  function renderTodos() {
    const todoFiltersEl = todosListEl?.closest("[data-planner-panel=\"todos\"]")?.querySelector(".planner-filter-row");

      selectedTodoAssignedTo = [];

      todosListEl.innerHTML = '<p class="meta">No Version 2 tasks yet. Open an event or planning project to add its tasks.</p>';

    const filteredTodos = getFilteredTodos();
    if (!filteredTodos.length) {
      todosListEl.innerHTML = '<p class="meta">No to-dos match the selected assignee.</p>';
      return;
    }

    if (todoGroupBy === "due") {
      const byDueDate = [...filteredTodos].sort((left, right) => {
        const leftDue = getWorkspaceTaskDueDateValue(left);
        const rightDue = getWorkspaceTaskDueDateValue(right);
        if (!leftDue && rightDue) return 1;
        if (leftDue && !rightDue) return -1;
        return leftDue.localeCompare(rightDue) || String(left.title || "").localeCompare(String(right.title || ""));
      });
      const monthGroups = new Map();
      byDueDate.forEach((todo) => {
        const dueDate = getWorkspaceTaskDueDateValue(todo).slice(0, 10);
        const parsedDate = dueDate ? new Date(`${dueDate}T12:00:00`) : null;
        const hasDueDate = Boolean(parsedDate && !Number.isNaN(parsedDate.getTime()));
        const key = hasDueDate ? `${parsedDate.getFullYear()}-${String(parsedDate.getMonth() + 1).padStart(2, "0")}` : "undated";
        if (!monthGroups.has(key)) {
          monthGroups.set(key, {
            title: hasDueDate
              ? parsedDate.toLocaleDateString(undefined, { month: "long", year: "numeric" })
              : "No due date",
            tasks: []
          });
        }
        monthGroups.get(key).tasks.push({ todo, dueDate, parsedDate, hasDueDate });

      todosListEl.innerHTML = `<div class="todo-due-date-groups">${[...monthGroups.values()].map((group) => {
        const dayGroups = new Map();
        group.tasks.forEach((task) => {
          const dayKey = task.hasDueDate ? task.dueDate : "undated";
          if (!dayGroups.has(dayKey)) dayGroups.set(dayKey, { ...task, tasks: [] });
          dayGroups.get(dayKey).tasks.push(task.todo);

          <section class="todo-due-date-month">

                <div class="todo-due-date-row__tasks event-accordion todo-accordion todo-accordion--by-date">${dayGroup.tasks.map((todo) => renderTodoByDateAccordion(todo)).join("")}</div>

      hydrateWorkspaceTodoSnapshots(todosListEl);
      return;
    }

    const parentType = todoGroupBy === "project" ? "project" : "event";
    const parentTasks = filteredTodos.filter((todo) => {
      const parent = getWorkspaceTaskParent(todo.eventId);
      const isProject = Boolean(parent && !String(parent.startsAt || "").trim());
      return parentType === "project" ? isProject : !isProject;
    });

    if (!parentTasks.length) {
      todosListEl.innerHTML = `<p class="meta">No ${parentType === "project" ? "project" : "event"} tasks match the selected assignee.</p>`;

    todosListEl.innerHTML = `

          const checklistItems = String(checklist?.items || "").split(/\r?\n/).map((item) => item.trim()).filter(Boolean);

                    ${todo.eventId ? `<button class="button button--icon todo-parent-edit" type="button" data-edit-workspace-todo="${escapeHtml(todo.id)}" data-workspace-parent-id="${escapeHtml(todo.eventId)}" aria-label="Edit ${escapeHtml(todo.title || "task")}" title="Edit"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"></path></svg></button>` : ""}

              <div class="guest-card__body">

                  ${hasChecklist ? `

                      <div class="workspace-checklist__items">
