  document.querySelector("[data-reset-todo]").addEventListener("click", () => {
    clearTodoForm();
  });

  document.querySelectorAll("[data-close-todo-modal]").forEach((button) => {
    button.addEventListener("click", () => {
      closeTodoModal();
    });
  });

  document.querySelectorAll("[data-close-table-modal]").forEach((button) => {
    button.addEventListener("click", () => {
      closeTableModal();
    });
  });

  document.querySelectorAll("[data-close-add-guest-modal]").forEach((button) => {
    button.addEventListener("click", () => {
      closeAddGuestModal();
    });
  });

  peopleListEl.addEventListener("click", (event) => {
    const button = event.target.closest("[data-edit-person]");
    if (!button) return;
    const person = cachedPeople.find((item) => item.id === button.dataset.editPerson);
    if (!person) return;
    setActivePlannerPanel("people");
    openPersonModal("Edit Person", person);
    setStatus(personStatusEl, `Editing ${person.name}.`, "success");
  });

  eventsListEl.addEventListener("click", (event) => {
    const workspaceButton = event.target.closest("[data-open-event-workspace]");
    if (workspaceButton) {
      event.preventDefault();
      event.stopPropagation();
      openEventWorkspace(workspaceButton.dataset.openEventWorkspace);
      return;
    }

    const button = event.target.closest("[data-edit-event]");
    if (!button) return;
    event.preventDefault();
    event.stopPropagation();
    const eventItem = cachedEvents.find((item) => item.id === button.dataset.editEvent);
    if (!eventItem) return;
    setActivePlannerPanel("events");
    openEventModal("Edit Event", {
      ...eventItem,
      date: String(eventItem.date || "").trim(),
      startsAt: String(eventItem.startsAt || "").trim(),
      main: eventItem.main ? "true" : "false",
      active: eventItem.active ? "true" : "false"
    });
    setStatus(eventStatusEl, `Editing ${eventItem.title}.`, "success");
  });

  shotsListEl.addEventListener("click", async (event) => {
    const editButton = event.target.closest("[data-edit-shot]");
    if (editButton) {
      const shot = cachedShots.find((item) => item.id === editButton.dataset.editShot);
      if (!shot) return;
      setActivePlannerPanel("shots");
      openShotModal("Edit Shot", {
        ...shot,
        isComplete: shot.isComplete ? "true" : "false"
      });
      setStatus(shotFormStatusEl, `Editing ${shot.title}.`, "success");
      return;
    }

    const toggleButton = event.target.closest("[data-toggle-shot-complete]");
    if (!toggleButton) return;

    const shot = cachedShots.find((item) => item.id === toggleButton.dataset.toggleShotComplete);
    if (!shot) return;

    const previousShots = cachedShots;
    try {
      requirePlannerAccess();
      const nextIsComplete = !shot.isComplete;
      setStatus(shotStatusEl, shot.isComplete ? "Marking shot incomplete..." : "Marking shot complete...", "pending");
      upsertCachedShot({
        ...shot,
        isComplete: nextIsComplete,
        completedAt: nextIsComplete ? (shot.completedAt || new Date().toISOString()) : "",
        updatedAt: new Date().toISOString()
      });
      const savedShot = await rpcRequest("saveShot", {
        id: String(shot.id || "").trim(),
        eventId: String(shot.eventId || "").trim(),
        title: String(shot.title || "").trim(),
        description: String(shot.description || "").trim(),
        peopleNeeded: String(shot.peopleNeeded || "").trim(),
        priority: String(shot.priority || "Medium").trim(),
        sortOrder: Number(shot.sortOrder || 0),
        notes: String(shot.notes || "").trim(),
        isComplete: nextIsComplete,
        completedAt: shot.completedAt || ""
      });
      upsertCachedShot(savedShot);
      setStatus(shotStatusEl, !shot.isComplete ? "Shot marked complete." : "Shot marked incomplete.", "success");
    } catch (error) {
      cachedShots = previousShots;
      rerenderShotData();
      setStatus(shotStatusEl, error.message || "Unable to update shot.", "error");
    }
  });

  todosListEl.addEventListener("click", (event) => {
    const button = event.target.closest("[data-edit-todo]");
    if (!button) return;
    const todo = cachedTodos.find((item) => item.id === button.dataset.editTodo);
    if (!todo) return;
    setActivePlannerPanel("todos");
    openTodoModal("Edit Task", {
      ...todo,
      isComplete: todo.isComplete ? "true" : "false"
    });
    setStatus(todoStatusEl, `Editing ${todo.title}.`, "success");
  });

  bedsListEl.addEventListener("click", (event) => {
    const button = event.target.closest("[data-edit-bed]");
    if (!button) return;
    const bed = cachedBeds.find((item) => item.id === button.dataset.editBed);
    if (!bed) return;
    setActivePlannerPanel("beds");
    openBedModal("Edit Bed", bed);
    setStatus(bedStatusEl, `Editing ${bed.lodging} ${bed.room} ${bed.bedLabel}.`, "success");
  });

  bedsListEl.addEventListener("change", async (event) => {
    const input = event.target.closest("[data-bed-field]");
    if (!input) return;

    try {
      await flushBedInputSave(input);
    } catch (error) {
      setStatus(bedsInlineStatusEl, error.message || "Unable to save bed assignment.", "error");
    }
  });

  bedsListEl.addEventListener("input", (event) => {
    const input = event.target.closest("[data-bed-field]");
    if (!input) return;
    scheduleBedInputSave(input);
  });

  bedsListEl.addEventListener("focusout", async (event) => {
    const input = event.target.closest("[data-bed-field]");
    if (!input) return;

    try {
      await flushBedInputSave(input);
    } catch (error) {
      setStatus(bedsInlineStatusEl, error.message || "Unable to save bed assignment.", "error");
    }
  });

  bedsListEl.addEventListener("keydown", async (event) => {
    const input = event.target.closest("[data-bed-field]");
    if (!input || event.key !== "Enter") return;

    event.preventDefault();
    input.blur();

    try {
      await flushBedInputSave(input);
    } catch (error) {
      setStatus(bedsInlineStatusEl, error.message || "Unable to save bed assignment.", "error");
    }
  });

  tablesListEl.addEventListener("click", async (event) => {
    const openButton = event.target.closest("[data-open-add-guest-modal]");
    if (openButton) {
      const table = cachedTables.find((item) => item.id === openButton.dataset.tableId);
      if (!table) return;
      openAddGuestModal(table, { returnFocusEl: openButton });
      return;
    }

    const reserveButton = event.target.closest("[data-toggle-reserved-seat]");
    if (reserveButton) {
      try {
        requirePlannerAccess();
        setStatus(tableStatusEl, "Saving reserved open spot...", "pending");
        await toggleReservedOpenSeat(reserveButton.dataset.tableId, reserveButton.dataset.seatNumber);
      } catch (error) {
        setStatus(tableStatusEl, error.message || "Unable to save reserved open spot.", "error");
      }
      return;
    }

    const handleButton = event.target.closest("[data-table-guest-handle]");
    if (handleButton) {
      requirePlannerAccess();
      const rowNumber = Number(handleButton.dataset.rowNumber || 0);
      if (activeTableDrag && Number(activeTableDrag.rowNumber || 0) === rowNumber) {
        clearActiveTableDrag();
        setStatus(tableStatusEl, "Move cancelled.", "success");
      } else {
        setActiveTableDrag(rowNumber);
        setStatus(tableStatusEl, "Drag or tap a drop spot to move this guest.", "pending");
      }
      return;
    }

    const dropzone = event.target.closest("[data-table-dropzone]");
    if (dropzone && activeTableDrag) {
      try {
        requirePlannerAccess();
        if (dropzone.dataset.dropEnabled !== "true") {
          return;
        }
        setStatus(tableStatusEl, "Moving guest...", "pending");
        await moveGuestToTablePosition(activeTableDrag.rowNumber, dropzone.dataset.tableName, dropzone.dataset.dropSeat);
        activeTableDrag = null;
        renderRsvps();
        renderGuests();
        renderTables();
        renderSummary();
        setStatus(tableStatusEl, "Guest moved.", "success");
      } catch (error) {
        setStatus(tableStatusEl, error.message || "Unable to move guest.", "error");
        await refreshRsvps();
      }
      return;
    }

    const button = event.target.closest("[data-remove-table-guest]");
    if (!button) return;

    try {
      requirePlannerAccess();
      setStatus(tableStatusEl, "Removing table assignment...", "pending");
      await removeGuestFromTable(button);
      renderRsvps();
      renderGuests();
      renderTables();
      renderSummary();
      setStatus(tableStatusEl, "Guest removed from table.", "success");
    } catch (error) {
      setStatus(tableStatusEl, error.message || "Unable to remove guest from table.", "error");
      await refreshRsvps();
    }
  });

  tablesListEl.addEventListener("dragstart", (event) => {
    const handleButton = event.target.closest("[data-table-guest-handle]");
    if (!handleButton) {
      return;
    }

    requirePlannerAccess();
    setActiveTableDrag(handleButton.dataset.rowNumber);
    if (event.dataTransfer) {
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", String(handleButton.dataset.rowNumber || ""));
    }
  });

  tablesListEl.addEventListener("dragend", () => {
    syncTableDragUi();
  });

  tablesListEl.addEventListener("dragover", (event) => {
    const dropzone = event.target.closest("[data-table-dropzone]");
    if (!dropzone || !activeTableDrag || dropzone.dataset.dropEnabled !== "true") {
      return;
    }

    event.preventDefault();
    if (event.dataTransfer) {
      event.dataTransfer.dropEffect = "move";
    }
  });

  tablesListEl.addEventListener("dragenter", (event) => {
    const dropzone = event.target.closest("[data-table-dropzone]");
    if (!dropzone || !activeTableDrag || dropzone.dataset.dropEnabled !== "true") {
      return;
    }

    dropzone.classList.add("is-active-dropzone");
  });

  tablesListEl.addEventListener("dragleave", (event) => {
    const dropzone = event.target.closest("[data-table-dropzone]");
    if (!dropzone) {
      return;
    }

    dropzone.classList.remove("is-active-dropzone");
  });

  tablesListEl.addEventListener("drop", async (event) => {
    const dropzone = event.target.closest("[data-table-dropzone]");
    if (!dropzone || !activeTableDrag || dropzone.dataset.dropEnabled !== "true") {
      return;
    }

    event.preventDefault();
    dropzone.classList.remove("is-active-dropzone");

    try {
      requirePlannerAccess();
      setStatus(tableStatusEl, "Moving guest...", "pending");
      await moveGuestToTablePosition(activeTableDrag.rowNumber, dropzone.dataset.tableName, dropzone.dataset.dropSeat);
      activeTableDrag = null;
      renderRsvps();
      renderGuests();
      renderTables();
      renderSummary();
      setStatus(tableStatusEl, "Guest moved.", "success");
    } catch (error) {
      setStatus(tableStatusEl, error.message || "Unable to move guest.", "error");
      await refreshRsvps();
    }
  });

  routeLinks.forEach((link) => {
    link.addEventListener("click", (event) => {
      const route = link.dataset.routeLink;
      if (!route) return;
      event.preventDefault();
      navigateTo(route);
    });
  });

  plannerSectionButtons.forEach((button) => {
    button.addEventListener("click", () => {
      setActivePlannerPanel(button.dataset.plannerSection);
      if (plannerSidebarMediaQuery.matches) {
        closePlannerSidebar();
      }
    });
  });

  plannerSidebarMediaQuery.addEventListener("change", (event) => {
    if (!event.matches) {
      plannerSidebarOpen = false;
    }
    syncPlannerSidebar();
  });

  document.addEventListener("click", (event) => {
    if (!plannerSidebarMediaQuery.matches || !plannerSidebarOpen || !viewerProfile.isAdmin) {
      return;
    }

    const target = event.target;
    if (!(target instanceof Element)) {
      return;
    }

    if (target.closest("#plannerSidebar") || target.closest("#plannerMenuToggle")) {
      return;
    }

    closePlannerSidebar();
  });

  window.addEventListener("popstate", () => {
    currentView = getRequestedView();
    renderRoute();
    maybeLoadPlannerData();
  });

  window.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && plannerSidebarMediaQuery.matches && plannerSidebarOpen && viewerProfile.isAdmin) {
      closePlannerSidebar();
      return;
    }

    if (event.key === "Escape" && !personModal.hidden) {
      closePersonModal();
      return;
    }

    if (event.key === "Escape" && !eventModal.hidden) {
      closeEventModal();
      return;
    }

    if (event.key === "Escape" && !shotModal.hidden) {
      closeShotModal();
      return;
    }

    if (event.key === "Escape" && !bedModal.hidden) {
      closeBedModal();
      return;
    }

    if (event.key === "Escape" && !todoModal.hidden) {
      closeTodoModal();
      return;
    }

    if (event.key === "Escape" && !tableModal.hidden) {
      closeTableModal();
      return;
    }

    if (event.key === "Escape" && !addGuestModal.hidden) {
      closeAddGuestModal();
    }
  });

  window.addEventListener("load", async () => {
    refreshViewer();
    renderRoute();
    await maybeLoadPlannerData();
  });
</script>
