  async function saveBedInlineAssignment(bedId, field, value) {
    const bed = cachedBeds.find((item) => item.id === bedId);
    if (!bed || (field !== "thursday" && field !== "friday")) {
      return;
    }

    setStatus(bedsInlineStatusEl, "Saving bed assignment...", "pending");
    return backendRequest("saveBed", {
      id: String(bed.id || "").trim(),
      lodging: String(bed.lodging || "").trim(),
      room: String(bed.room || "").trim(),
      bedLabel: String(bed.bedLabel || "").trim(),
      bedType: String(bed.bedType || "").trim(),
      capacity: Number(bed.capacity || 0),
      thursday: field === "thursday" ? String(value || "").trim() : String(bed.thursday || "").trim(),
      friday: field === "friday" ? String(value || "").trim() : String(bed.friday || "").trim(),
      notes: String(bed.notes || "").trim()
    });
  }

  function getBedCellInputClass(value) {
    const normalized = String(value || "").trim();
    if (!normalized) {
      return "bed-table__cell-input bed-table__cell-input--unassigned";
    }
    if (normalized.startsWith("??")) {
      return "bed-table__cell-input bed-table__cell-input--question";
    }
    return "bed-table__cell-input";
  }

  function getBedCellKey(bedId, field) {
    return `${String(bedId || "").trim()}:${String(field || "").trim()}`;
  }

  function applyBedInputAppearance(input) {
    if (!input) return;
    input.className = getBedCellInputClass(input.value);
  }

  function setCachedBedField(bedId, field, value) {
    const bed = cachedBeds.find((item) => item.id === bedId);
    if (!bed || (field !== "thursday" && field !== "friday")) {
      return;
    }
    bed[field] = String(value || "").trim();
  }

  function clearBedSaveTimer(key) {
    const timer = bedSaveTimers.get(key);
    if (timer) {
      window.clearTimeout(timer);
      bedSaveTimers.delete(key);
    }
  }

  async function commitBedInputValue(input, value) {
    if (!input) return;

    const bedId = String(input.dataset.bedId || "").trim();
    const field = String(input.dataset.bedField || "").trim();
    const key = getBedCellKey(bedId, field);
    const nextValue = String(value || "").trim();
    const previousValue = String(input.dataset.bedValue || "").trim();

    if (!bedId || (field !== "thursday" && field !== "friday") || nextValue === previousValue) {
      applyBedInputAppearance(input);
      return;
    }

    const previousChain = bedSaveChains.get(key) || Promise.resolve();
    const nextChain = previousChain.finally(async () => {
      setStatus(bedsInlineStatusEl, "Saving bed assignment...", "");
      setCachedBedField(bedId, field, nextValue);
      applyBedInputAppearance(input);
      const savedBed = await saveBedInlineAssignment(bedId, field, nextValue);
      upsertCachedBed(savedBed, { render: false });
      input.dataset.bedValue = String(savedBed?.[field] || "").trim();
      input.value = String(savedBed?.[field] || "").trim();
      applyBedInputAppearance(input);
      setStatus(bedsInlineStatusEl, "Bed assignments saved.", "success");
    }).catch((error) => {
      setCachedBedField(bedId, field, previousValue);
      input.value = previousValue;
      applyBedInputAppearance(input);
      throw error;
    });

    bedSaveChains.set(key, nextChain.catch(() => {}));
    return nextChain;
  }

  function scheduleBedInputSave(input) {
    if (!input) return;
    applyBedInputAppearance(input);

    const key = getBedCellKey(input.dataset.bedId, input.dataset.bedField);
    clearBedSaveTimer(key);

    const pendingValue = String(input.value || "");
    const timer = window.setTimeout(async () => {
      bedSaveTimers.delete(key);
      try {
        await commitBedInputValue(input, pendingValue);
      } catch (error) {
        setStatus(bedsInlineStatusEl, error.message || "Unable to save bed assignment.", "error");
      }
    }, BED_SAVE_DEBOUNCE_MS);

    bedSaveTimers.set(key, timer);
  }

  async function flushBedInputSave(input) {
    if (!input) return;
    const key = getBedCellKey(input.dataset.bedId, input.dataset.bedField);
    clearBedSaveTimer(key);
    applyBedInputAppearance(input);
    return commitBedInputValue(input, input.value);
  }

  function getVolunteerRoles(rsvp) {
    const raw = String(rsvp?.volunteerRoles || "").trim();
    if (!raw) return [];
    try {
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed)
        ? Array.from(new Set(parsed.map((value) => String(value || "").trim()).filter(Boolean)))
        : [];
    } catch (_) {
      return Array.from(new Set(raw.split("|").map((value) => value.trim()).filter(Boolean)));
    }
  }

  function getLatestGroupRsvps() {
    const latestByGroup = new Map();
    getRsvpSubmissions()
      .map((rsvp, index) => ({ rsvp, index, timestamp: new Date(rsvp.submittedAt || "").getTime() }))
      .sort((left, right) => {
        const leftTime = Number.isNaN(left.timestamp) ? Number.NEGATIVE_INFINITY : left.timestamp;
        const rightTime = Number.isNaN(right.timestamp) ? Number.NEGATIVE_INFINITY : right.timestamp;
        return rightTime - leftTime || left.index - right.index;
      })
      .forEach(({ rsvp }) => {
        const key = String(rsvp.group || rsvp.name || "Guest").trim() || "Guest";
        if (!latestByGroup.has(key)) latestByGroup.set(key, rsvp);
      });
    return Array.from(latestByGroup.entries()).map(([group, rsvp]) => ({ group, rsvp }));
  }

  function renderVolunteers() {
    if (!volunteersListEl) return;
    const roles = new Map();
    getLatestGroupRsvps().forEach(({ group, rsvp }) => {
      getVolunteerRoles(rsvp).forEach((role) => {
        const volunteers = roles.get(role) || [];
        volunteers.push({ group, name: String(rsvp.name || group).trim() || group });
        roles.set(role, volunteers);
      });
    });

    if (!roles.size) {
      volunteersListEl.innerHTML = '<div class="rsvp-section-header"><h3>Volunteers</h3><span>Volunteer count · 0</span></div><p class="meta">No one has volunteered yet.</p>';
      return;
    }

    const volunteerGroups = new Set();
    roles.forEach((volunteers) => volunteers.forEach((volunteer) => volunteerGroups.add(volunteer.group)));
    const uniqueVolunteerCount = volunteerGroups.size;
    volunteersListEl.innerHTML = `
      <div class="rsvp-section-header"><h3>Volunteers</h3><span>Volunteer count · ${uniqueVolunteerCount}</span></div>
      <div class="guest-accordion">
        ${Array.from(roles.entries()).sort(([left], [right]) => left.localeCompare(right)).map(([role, volunteers]) => `
          <details class="guest-card guest-card--attending" open>
            <summary><span class="accordion-summary__main"><span class="accordion-toggle" aria-hidden="true"></span><span class="accordion-title">${escapeHtml(role)}</span><span class="rsvp-submission-count">${volunteers.length} volunteer${volunteers.length === 1 ? "" : "s"}</span></span></summary>
            <div class="guest-card__body"><ul class="rsvp-member-responses">${volunteers.map((volunteer) => `<li class="rsvp-member-response"><strong>${escapeHtml(volunteer.name)}</strong></li>`).join("")}</ul></div>
          </details>
        `).join("")}
      </div>
    `;
  }

  function renderRsvps() {
    const submissions = getRsvpSubmissions();
    const dashboardRsvps = getDashboardRsvps();

    if (!submissions.length && !dashboardRsvps.length) {
      rsvpListEl.innerHTML = rsvpFeedConnected
        ? '<p class="meta">No RSVPs have been submitted yet. New front-page responses will appear here, while the Guests tab holds the current per-person attendance list.</p>'
        : '<p class="meta">No RSVP feed loaded yet. Add a feed URL in the standalone env or redeploy the planner with one configured.</p>';
      return;
    }

    // The feed normally arrives newest-first, but the RSVP sheet can also be
    // read through older deployments that return its natural (oldest-first)
    // order. Sort here so the visible response is always genuinely the latest.
    const sortedSubmissions = submissions
      .map((rsvp, index) => ({ rsvp, index, timestamp: new Date(rsvp.submittedAt || "").getTime() }))
      .sort((left, right) => {
        const leftTime = Number.isNaN(left.timestamp) ? Number.NEGATIVE_INFINITY : left.timestamp;
        const rightTime = Number.isNaN(right.timestamp) ? Number.NEGATIVE_INFINITY : right.timestamp;
        return rightTime - leftTime || left.index - right.index;
      })
      .map(({ rsvp }) => rsvp);

    const submissionGroups = new Map();
    sortedSubmissions.forEach((rsvp) => {
      const key = String(rsvp.group || rsvp.name || "Guest").trim() || "Guest";
      const group = submissionGroups.get(key) || [];
      group.push(rsvp);
      submissionGroups.set(key, group);
    });

    const latestSubmissions = Array.from(submissionGroups.entries()).map(([group, records]) => ({
      group,
      latest: records[0],
      records
    }));
    const getSubmissionTone = (rsvp) => {
      const response = getRsvpGroup(rsvp.weddingRsvpSummary || rsvp.attending);
      return response === "yes" ? "attending" : response === "no" ? "declined" : "pending";
    };
    const formatSubmissionTime = (rsvp) => rsvp.submittedAt
      ? new Date(rsvp.submittedAt).toLocaleString([], { dateStyle: "medium", timeStyle: "short" })
      : "Not recorded";
    const renderMemberResponses = (value) => String(value || "").split("|")
      .map((entry) => entry.trim()).filter(Boolean)
      .map((entry) => {
        const separator = entry.lastIndexOf(":");
        const name = separator >= 0 ? entry.slice(0, separator).trim() : entry;
        const response = separator >= 0 ? entry.slice(separator + 1).trim() : "Response recorded";
        const responseTone = getRsvpGroup(response);
        return `<li class="rsvp-member-response rsvp-member-response--${escapeHtml(responseTone)}"><strong>${escapeHtml(name)}</strong><span class="rsvp-response rsvp-response--${escapeHtml(responseTone)}">${escapeHtml(response)}</span></li>`;
      }).join("");
    const getSubmissionGuestCount = (rsvp) => {
      const members = String(rsvp.groupMembers || "").split("|").map((entry) => entry.trim()).filter(Boolean);
      const weddingCount = members.filter((entry) => getRsvpGroup(entry.slice(entry.lastIndexOf(":") + 1)) === "yes").length;
      const extras = Number.parseInt(rsvp.plusOneCount || "0", 10) + Number.parseInt(rsvp.childrenCount || "0", 10);
      return members.length ? weddingCount + (Number.isNaN(extras) ? 0 : extras) : String(rsvp.guests || "").trim();
    };
    const totalAttendingGuests = latestSubmissions.reduce((total, { latest }) => {
      const guestCount = Number.parseInt(getSubmissionGuestCount(latest), 10);
      return total + (Number.isNaN(guestCount) ? 0 : guestCount);
    }, 0);
    const totalGuestsAttending = cachedGuests.filter((guest) => getRsvpGroup(getGuestRsvpLabel(guest)) === "yes").length;
    const volunteerCount = latestSubmissions.filter(({ latest }) => getVolunteerRoles(latest).length).length;
    const getEventAttendingCount = (field) => latestSubmissions.reduce((total, { latest }) => {
      if (getRsvpGroup(latest[field]) !== "yes") return total;
      const guestCount = Number.parseInt(getSubmissionGuestCount(latest), 10);
      return total + (Number.isNaN(guestCount) ? 0 : guestCount);
    }, 0);
    const rehearsalDinnerAttending = getEventAttendingCount("rehearsalRsvp");
    const openHouseAttending = getEventAttendingCount("openHouseRsvp");
    const getSubmissionChanges = (current, previous) => {
      const fields = [
        ["Wedding", current.weddingRsvpSummary || current.attending, previous.weddingRsvpSummary || previous.attending],
        ["Rehearsal dinner", current.rehearsalRsvp, previous.rehearsalRsvp],
        ["Open house", current.openHouseRsvp, previous.openHouseRsvp],
        ["Guests attending", getSubmissionGuestCount(current), getSubmissionGuestCount(previous)],
        ["Wedding party", current.groupMembers, previous.groupMembers],
        ["Contact email", current.email, previous.email],
        ["Mobile number", current.mobile, previous.mobile],
        ["Text-message updates", current.smsOptedIn, previous.smsOptedIn],
        ["Volunteer roles", getVolunteerRoles(current).join(", "), getVolunteerRoles(previous).join(", ")],
        ["Note", current.comment, previous.comment],
        ["Plus one", `${current.plusOneCount || "0"}${current.plusOneName ? ` (${current.plusOneName})` : ""}`, `${previous.plusOneCount || "0"}${previous.plusOneName ? ` (${previous.plusOneName})` : ""}`],
        ["Children", `${current.childrenCount || "0"}${current.childrenNote ? ` (${current.childrenNote})` : ""}`, `${previous.childrenCount || "0"}${previous.childrenNote ? ` (${previous.childrenNote})` : ""}`]
      ];
      return fields.filter(([, value, oldValue]) => String(value || "").trim() !== String(oldValue || "").trim());
    };
    const renderSubmissionHistory = (records) => records.length > 1 ? `
      <details class="rsvp-submission-history">
        <summary><span class="accordion-toggle" aria-hidden="true"></span><span>Submission history · ${records.length} responses</span></summary>
        <div class="rsvp-submission-history__content">
          <p class="meta">Newest first. Each entry shows what changed from the response immediately before it.</p>
          <ol>
            ${records.map((rsvp, index) => {
              const changes = index < records.length - 1 ? getSubmissionChanges(rsvp, records[index + 1]) : [];
              const changeMarkup = index === records.length - 1
                ? '<p class="meta">First recorded response.</p>'
                : changes.length
                  ? `<ul>${changes.map(([label, value, oldValue]) => `<li><strong>${escapeHtml(label)}:</strong> ${escapeHtml(oldValue || "None")} → ${escapeHtml(value || "None")}</li>`).join("")}</ul>`
                  : '<p class="meta">No RSVP details changed; this was submitted again.</p>';
              return `<li><strong>${escapeHtml(formatSubmissionTime(rsvp))}</strong>${changeMarkup}</li>`;
            }).join("")}
          </ol>
        </div>
      </details>
    ` : "";
    const renderSubmissionAccordion = (rsvp, records, group) => {
      const guestCount = getSubmissionGuestCount(rsvp);
      const volunteerRoles = getVolunteerRoles(rsvp);
      const detailFields = [
        ["Wedding", rsvp.weddingRsvpSummary || (rsvp.attending ? getRsvpLabel(getRsvpGroup(rsvp.attending)) : "")],
        ["Rehearsal dinner", rsvp.rehearsalRsvp],
        ["Open house", rsvp.openHouseRsvp],
        ["Contact email", rsvp.email],
        ["Mobile number", rsvp.mobile],
        ["Text-message updates", /^(true|yes)$/i.test(rsvp.smsOptedIn) ? "Opted in" : "Not opted in"],
        ["Submitted", formatSubmissionTime(rsvp)]
      ].filter(([, value]) => String(value || "").trim());
      const memberResponses = renderMemberResponses(rsvp.groupMembers);
      return `
        <details class="guest-card guest-card--${getSubmissionTone(rsvp)} rsvp-submission-card">
          <summary>
            <span class="accordion-summary__main">
              <span class="accordion-toggle" aria-hidden="true"></span>
              <span class="accordion-title">${escapeHtml(rsvp.name || rsvp.group || "Guest")}</span>
              <span class="rsvp-submission-count">${guestCount ? `${escapeHtml(guestCount)} guest${guestCount === 1 || guestCount === "1" ? "" : "s"} attending` : "RSVP recorded"}</span>
            </span>
            ${viewerProfile.isAdmin && records.length ? `<button class="button button--icon button--light rsvp-submission-edit-button" type="button" data-edit-rsvp-response="${escapeHtml(group)}" aria-label="Edit response for ${escapeHtml(rsvp.name || rsvp.group || "guest")}" title="Edit response"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"></path></svg></button>` : ""}
          </summary>
          <div class="guest-card__body rsvp-submission-card__body">
            <div class="guest-card__grid">
              ${detailFields.map(([label, value]) => `<div class="guest-card__field"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>`).join("")}
            </div>
            ${volunteerRoles.length ? `<section class="rsvp-submission-roles"><span>Volunteer roles</span><ul>${volunteerRoles.map((role) => `<li>${escapeHtml(role)}</li>`).join("")}</ul></section>` : ""}
            ${memberResponses ? `<section class="rsvp-submission-members"><span>Wedding party responses</span><ul>${memberResponses}</ul></section>` : ""}
            ${rsvp.comment ? `<section class="rsvp-submission-note"><span>Note</span><p>${escapeHtml(rsvp.comment)}</p></section>` : ""}
            ${renderSubmissionHistory(records)}
          </div>
        </details>
      `;
    };
    const submissionMarkup = latestSubmissions.length ? `<div class="rsvp-submission-list">${latestSubmissions
      .map(({ group, latest, records }) => renderSubmissionAccordion(latest, records, group)).join("")}</div>`
      : '<p class="meta">No submitted RSVP records yet.</p>';

    rsvpListEl.innerHTML = `
      <div class="rsvp-section-header">
        <div class="rsvp-section-heading">
          <h3>Group RSVPs</h3>
          <span>Online RSVP count · ${totalAttendingGuests}</span>
          <span>Volunteer count · ${volunteerCount}</span>
        </div>
        <div class="rsvp-section-counts">
          <span>Total attending · ${totalGuestsAttending}</span>
          <span>Rehearsal dinner count · ${rehearsalDinnerAttending}</span>
          <span>Open house count · ${openHouseAttending}</span>
        </div>
      </div>
      ${submissionMarkup}
      ${viewerProfile.isAdmin ? `<section class="modal" id="rsvpEditModal" hidden aria-hidden="true"><div class="modal__backdrop" data-close-rsvp-edit-modal></div><div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="rsvpEditModalTitle"><button class="modal__close" type="button" data-close-rsvp-edit-modal aria-label="Close dialog">X</button><div class="modal__header"><div><h3 id="rsvpEditModalTitle">Edit RSVP response</h3><p class="meta">Saving records a corrected response and keeps the previous submission in its history.</p></div></div><form id="rsvpEditForm"><input name="group" type="hidden"><input name="contactName" type="hidden"><label>Contact email <input name="email" type="email"></label><fieldset class="type-options"><legend>Wedding party</legend><div class="rsvp-edit-members" data-rsvp-edit-members></div></fieldset><div class="split"><label>Rehearsal dinner <select name="rehearsalRsvp"><option value="">No response</option><option value="attending">Attending</option><option value="not-attending">Not attending</option></select></label><label>Open house <select name="openHouseRsvp"><option value="">No response</option><option value="attending">Attending</option><option value="not-attending">Not attending</option></select></label></div><div class="split"><label>Plus ones <input name="plusOneCount" type="number" min="0" step="1"></label><label>Plus-one name <input name="plusOneName"></label></div><div class="split"><label>Children <input name="childrenCount" type="number" min="0" step="1"></label><label>Children note <input name="childrenNote"></label></div><label>Note <textarea name="comment"></textarea></label><div class="toolbar"><button class="button" type="submit">Save corrected response</button><button class="button button--light" type="button" data-close-rsvp-edit-modal>Cancel</button></div><p class="status" id="rsvpEditStatus"></p></form></div></section>` : ""}
    `;
  }

  function addRsvpContactEditorFields(form) {
    if (!form || form.querySelector("[data-rsvp-contact-fields]")) return;
    const emailLabel = form.querySelector('input[name="email"]')?.closest("label");
    if (!emailLabel) return;
    emailLabel.insertAdjacentHTML("afterend", `<div class="split" data-rsvp-contact-fields><label>Mobile number <input name="mobile" type="tel"></label><label class="checkbox-label"><input name="smsOptIn" type="checkbox" value="yes"> This contact opted in to text-message updates</label></div><fieldset class="type-options rsvp-edit-section" data-rsvp-volunteer-fields><legend>Volunteer help</legend><div class="rsvp-volunteer-options">${RSVP_VOLUNTEER_OPTIONS.map((role) => `<label class="checkbox-label"><input type="checkbox" data-rsvp-edit-volunteer value="${escapeHtml(role)}"><span>${escapeHtml(role)}</span></label>`).join("")}</div></fieldset>`);
  }

  function isChurchRsvp(rsvp) {
    const memberNames = new Set(getRsvpEditMembers(rsvp).map((member) => member.name.toLowerCase()));
    return cachedGuests.some((guest) => (
      memberNames.has(getGuestDisplayName(guest).toLowerCase())
      && getTypeTokens(getGuestTypeValue(guest)).some((type) => type.toLowerCase() === "church")
    ));
  }

  function setRsvpVolunteerHelpVisibility(form, rsvp) {
    const volunteerFields = form?.querySelector("[data-rsvp-volunteer-fields]");
    if (!volunteerFields) return;
    const showVolunteerHelp = isChurchRsvp(rsvp);
    volunteerFields.hidden = !showVolunteerHelp;
    volunteerFields.querySelectorAll("[data-rsvp-edit-volunteer]").forEach((input) => {
      input.disabled = !showVolunteerHelp;
    });
  }

  function renderGuests() {
    if (!cachedGuests.length) {
      renderGuestTypeFilter([]);
      guestsListEl.innerHTML = rsvpFeedConnected
        ? '<p class="meta">No guest rows found yet in the `Guests` sheet.</p>'
        : '<p class="meta">No guests feed loaded yet. Connect the spreadsheet feed to display this tab.</p>';
      return;
    }

    const columns = cachedGuests.reduce((allColumns, row) => {
      Object.keys(row).forEach((key) => {
        if (!allColumns.includes(key) && !shouldHideGuestColumn(key)) {
          allColumns.push(key);
        }
      });
      return allColumns;
    }, []);

    const visibleGuests = cachedGuests
      .map((row) => sanitizeGuestRow(row, columns))
      .filter(Boolean);
    const attendingGuestCount = visibleGuests.filter((guest) => guest.statusTone === "attending").length;

    const guestTypes = collectGuestTypes(visibleGuests);
    renderGuestTypeFilter(guestTypes);

    const selectedGuestTypeLookup = new Set(selectedGuestTypes.map((type) => String(type || "").toLowerCase()));
    const filteredGuests = selectedGuestTypeLookup.size
      ? visibleGuests.filter((guest) => getTypeTokens(guest.type).some((type) => selectedGuestTypeLookup.has(type.toLowerCase())))
      : visibleGuests;

    renderTextGuests();

    if (!filteredGuests.length) {
      guestsListEl.innerHTML = selectedGuestTypes.length
        ? `<div class="rsvp-section-header"><h3>Guests</h3><span>Attending RSVP count · ${attendingGuestCount}</span></div><p class="meta">No guest rows match the selected ${selectedGuestTypes.length === 1 ? "type" : "types"}.</p>`
        : `<div class="rsvp-section-header"><h3>Guests</h3><span>Attending RSVP count · ${attendingGuestCount}</span></div><p class="meta">No guest rows found yet in the \`Guests\` sheet.</p>`;
      return;
    }

    guestsListEl.innerHTML = `
      <div class="rsvp-section-header">
        <h3>Guests</h3>
        <span>Attending RSVP count · ${attendingGuestCount}</span>
      </div>
      <div class="guest-accordion">
        ${filteredGuests.map((guest) => {
          return `
          <details class="guest-card guest-card--${escapeHtml(guest.statusTone)}">
            <summary>
              <span class="accordion-summary__main">
                <span class="accordion-toggle" aria-hidden="true"></span>
                <span class="accordion-title">${escapeHtml(guest.title)}</span>
              </span>
            </summary>
            <div class="guest-card__body">
              <div class="guest-card__grid">
                ${guest.fields.map((field) => {
                  const isTypeField = /^type$/i.test(String(field.label || "").trim());
                  return `
                  <div class="guest-card__field${isTypeField ? " guest-card__field--type" : ""}">
                    <div class="guest-card__field-header">
                      <span>${escapeHtml(field.label)}</span>
                      ${isTypeField ? `<button
                        class="button button--light guest-type-edit"
                        type="button"
                        data-edit-guest-type="${escapeHtml(String(guest.rowNumber))}"
                        aria-label="Edit guest type for ${escapeHtml(guest.title)}"
                        title="Edit guest type">
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                          <path d="M12 20h9"></path>
                          <path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"></path>
                        </svg>
                      </button>` : ""}
                    </div>
                    <strong>${escapeHtml(field.value)}</strong>
                  </div>
                `;
                }).join("")}
              </div>
            </div>
          </details>
        `;
        }).join("")}
      </div>
    `;
  }

  function renderTables() {
    if (tablesUnseatedCountEl) {
      const unseatedCount = countUnseatedPeople();
      tablesUnseatedCountEl.textContent = unseatedCount
        ? `${unseatedCount} ${unseatedCount === 1 ? "person" : "people"} not seated`
        : "Everyone is seated";
    }

    if (!cachedTables.length) {
      tablesListEl.innerHTML = '<p class="meta">No tables yet. Add one above to start assigning seats.</p>';
      return;
    }

    const groupedTables = groupTablesForLayout(cachedTables);
    tablesListEl.innerHTML = groupedTables.map((group) => {
      const cards = group.tables.map((table) => {
      const assignedGuests = getAssignedGuestByTableName(String(table.tableName || "").trim());
      const seatCount = getRenderableSeatCountForTable(table, assignedGuests);
      return `
        <article class="card">
          <div class="table-control-row">
            <div class="table-control-row__title">
              <h3>${escapeHtml(table.tableName || "Untitled Table")}</h3>
              <div class="table-control-row__details">
                <p class="meta">${escapeHtml(getTableLayoutLabel(table))}</p>
                ${Number.isFinite(getTableLayoutOrder(table)) ? `<p class="meta">Order ${escapeHtml(String(getTableLayoutOrder(table)))}</p>` : ""}
                ${getTableGuestTypeValue(table) ? `<p class="meta">${escapeHtml(getTableGuestTypeValue(table))}</p>` : ""}
                <p class="meta">${Number(table.count || 0)} seats</p>
                <p class="meta">${assignedGuests.length} assigned</p>
              </div>
            </div>
          </div>
          <div class="table-assignment-list ${assignedGuests.length ? "" : "table-assignment-list--empty"}" data-table-drop-list data-table-name="${escapeHtml(String(table.tableName || "").trim())}">
            ${renderTableSeatGrid(table, assignedGuests, seatCount)}
          </div>
        </article>
      `;
      }).join("");

      return `
        <section class="table-side-group table-side-group--${escapeHtml(group.key)}" aria-labelledby="tables-group-${escapeHtml(group.key)}">
          <div class="table-side-group__header">
            <h4 id="tables-group-${escapeHtml(group.key)}">${escapeHtml(group.label)}</h4>
            <p class="meta">${group.tables.length ? `${group.tables.length} tables` : "No tables yet"}</p>
          </div>
          <div class="table-side-group__list">
            ${cards || '<p class="meta">No tables in this section yet.</p>'}
          </div>
        </section>
      `;
    }).join("");

    syncTableDragUi();
  }

  function shouldHideGuestColumn(column) {
    const normalized = String(column || "").trim().toLowerCase();
    return !normalized || normalized === "table number" || normalized === "table order" || normalized === "__rownumber";
  }

  function sanitizeGuestRow(row, columns) {
    const titleColumn = findGuestTitleColumn(columns);
    const title = String(row[titleColumn] || "").trim();
    const rowNumber = getGuestRowNumber(row);

    if (!title || !rowNumber || /^total:?$/i.test(title) || /^\d+$/.test(title)) {
      return null;
    }

    const fields = columns
      .filter((column) => column !== titleColumn)
      .filter((column) => !/^description$/i.test(String(column || "").trim()))
      .map((column) => ({
        label: column,
        value: String(row[column] || "").trim()
      }))
      .filter((field) => field.value && field.value !== "-");

    if (!fields.length) {
      const rsvp = getGuestRsvpLabel(row);
      return {
        rowNumber,
        title,
        type: getGuestType(row),
        rsvp,
        statusTone: getGuestStatusTone(rsvp),
        fields: []
      };
    }

    const rsvp = getGuestRsvpLabel(row);
    return {
      rowNumber,
      title,
      type: getGuestType(row),
      rsvp,
      statusTone: getGuestStatusTone(rsvp),
      fields
    };
  }

  function getGuestType(row) {
    const match = Object.entries(row).find(([key]) => String(key || "").trim().toLowerCase() === "type");
    return String(match?.[1] || "").trim();
  }

  function getTextEligibleGuests() {
    return cachedGuests
      .filter((guest) => getGuestRowNumber(guest))
      .filter((guest) => isGuestSmsOptedIn(guest))
      .map((guest) => ({
        rowNumber: getGuestRowNumber(guest),
        name: getGuestDisplayName(guest),
        phone: normalizeTextPhone(getGuestPhone(guest))
      }))
      .filter((guest) => guest.phone)
      .sort((left, right) => left.name.localeCompare(right.name));
  }

  function getSelectedTextGuests() {
    return selectedTextGroups.size ? getFilteredTextEligibleGuests() : [];
  }

  function getFilteredTextEligibleGuests() {
    const selectedTypes = new Set(selectedTextGroups);
    return getTextEligibleGuests().filter((guest) => {
      if (dismissedTextGuestRowNumbers.has(guest.rowNumber)) return false;
      if (!selectedTypes.size) return true;
      const row = cachedGuests.find((candidate) => getGuestRowNumber(candidate) === guest.rowNumber);
      return getTypeTokens(getGuestTypeValue(row)).some((type) => selectedTypes.has(type.toLowerCase()));
    });
  }

  function isGuestSmsOptedIn(guest) {
    const consentColumn = Object.keys(guest || {}).find((column) => {
      const normalized = String(column || "").toLowerCase().replace(/[^a-z0-9]/g, "");
      return normalized === "smsoptedin" || normalized === "textconsent" || normalized === "smsconsent";
    });
    return /^(true|yes|optedin)$/i.test(String(consentColumn ? guest[consentColumn] || "" : "").replace(/[ -]/g, ""));
  }

  function normalizeTextPhone(value) {
    const digits = String(value || "").replace(/\D/g, "");
    if (digits.length === 10) return `+1${digits}`;
    if (digits.length >= 11 && digits.length <= 15) return `+${digits}`;
    return "";
  }

  function getTextGuestsForSelectedGroups() {
    const selectedTypes = new Set(selectedTextGroups);
    if (!selectedTypes.size) return [];
    return cachedGuests
      .filter((guest) => getGuestRowNumber(guest))
      .filter((guest) => getTypeTokens(getGuestTypeValue(guest)).some((type) => selectedTypes.has(type.toLowerCase())))
      .filter((guest) => !dismissedTextGuestRowNumbers.has(getGuestRowNumber(guest)))
      .map((guest) => ({
        rowNumber: getGuestRowNumber(guest),
        name: getGuestDisplayName(guest) || "Unnamed guest",
        phone: normalizeTextPhone(getGuestPhone(guest)),
        optedIn: isGuestSmsOptedIn(guest)
      }))
      .sort((left, right) => left.name.localeCompare(right.name));
  }

  function renderTextGuests() {
    if (!textGroupPickerEl || !textGuestListEl) return;
    const groups = collectGuestTypes(cachedGuests.map((guest) => ({ type: getGuestTypeValue(guest) })));
    const availableGroups = new Set(groups.map((group) => group.toLowerCase()));
    selectedTextGroups = new Set([...selectedTextGroups].filter((group) => availableGroups.has(group)));

    textGroupPickerEl.innerHTML = groups.length
      ? groups.map((group) => {
        const key = group.toLowerCase();
        return `<label><input type="checkbox" data-text-group="${escapeHtml(group)}" ${selectedTextGroups.has(key) ? "checked" : ""}> ${escapeHtml(group)}</label>`;
      }).join("")
      : '<p class="meta">Guest groups will appear here once the guest list loads.</p>';

    const selectedGroupNames = groups.filter((group) => selectedTextGroups.has(group.toLowerCase()));

    const guests = getTextGuestsForSelectedGroups();
    textGuestListEl.innerHTML = !selectedGroupNames.length
      ? '<p class="meta">Select a group above to see its guests.</p>'
      : !guests.length
        ? '<p class="meta">No guests are assigned to the selected groups.</p>'
        : guests.map((guest) => {
          const isReady = Boolean(guest.phone && guest.optedIn);
          const phoneCopy = guest.phone || "Needs attention";
          const dismiss = `<button class="text-recipient-card__dismiss" type="button" data-dismiss-text-guest="${escapeHtml(String(guest.rowNumber))}" aria-label="Remove ${escapeHtml(guest.name)} from this message" title="Remove from this message">×</button>`;
          const needsPhone = !guest.phone;
          const edit = needsPhone
            ? `<button class="button button--icon button--light text-recipient-card__edit" type="button" data-edit-text-contact="${escapeHtml(String(guest.rowNumber))}" aria-label="Add a mobile number for ${escapeHtml(guest.name)}" title="Add mobile number"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"></path></svg></button>`
            : "";
          const status = !isReady && !needsPhone ? '<p class="meta">Not opted in for texts.</p>' : "";
          return `<article class="text-recipient-card text-recipient-card--${isReady ? "ready" : "missing"}">
            <div class="text-recipient-card__identity">${dismiss}<div class="text-recipient-card__details"><strong>${escapeHtml(guest.name)}</strong><p>${escapeHtml(phoneCopy)}</p>${status}</div></div>${edit}
          </article>`;
        }).join("");
    renderGuestMessagingSummary();
  }

  function renderGuestMessagingSummary() {
    if (!guestMessagingSummaryEl) return;
    const selectedCount = getSelectedTextGuests().length;
    guestMessagingSummaryEl.textContent = selectedCount
      ? `${selectedCount} opted-in ${selectedCount === 1 ? "guest will" : "guests will"} receive this message.`
      : selectedTextGroups.size
        ? "No opted-in guests with working mobile numbers are available in the selected groups."
        : "Select one or more groups to add recipients.";

  function getTextMessageBody() {
    const message = String(guestMessagingBodyEl?.value || "").trim();
    if (!message) {
      throw new Error("Write a message before opening your phone’s text composer.");
    }
    return message;

  function openSmsComposer(recipients, message) {
    const phones = recipients.map((recipient) => recipient.phone).filter(Boolean);
    if (!phones.length) throw new Error("Choose at least one opted-in guest with a usable mobile number.");
    window.location.href = `sms:${phones.join(",")}?body=${encodeURIComponent(message)}`;

  function getGuestStatusTone(rsvp) {
    const group = getRsvpGroup(rsvp);
    if (group === "yes") return "attending";
    if (group === "no") return "declined";
    return "pending";

        label: "Attending",

          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">

          <circle cx="12" cy="12" r="3"></circle>
        </svg>

  function getNextGuestRsvpValue(rsvp) {
    const group = getRsvpGroup(rsvp);
    if (group === "yes") return "No";
    if (group === "no") return "Maybe";
    return "Yes";
  }

  function updateCachedGuestDetails(rowNumber, updates = {}) {
    const numericRowNumber = Number(rowNumber || 0);
    if (!numericRowNumber) {
      return null;
    }

    const guest = cachedGuests.find((row) => getGuestRowNumber(row) === numericRowNumber);
    if (!guest) {
      return null;
    }

    if (Object.prototype.hasOwnProperty.call(updates, "type")) {
      const typeColumn = findGuestColumn(guest, /^type$/i);
      const nextType = String(updates.type || "").trim();
      if (typeColumn) {
        guest[typeColumn] = nextType;
      } else {
        guest.Type = nextType;
      }
    }

    if (Object.prototype.hasOwnProperty.call(updates, "rsvp")) {
      const rsvpColumn = findGuestColumn(guest, /^rsvp$/i);
      const nextRsvp = String(updates.rsvp || "").trim();
      if (rsvpColumn) {
        guest[rsvpColumn] = nextRsvp;
      } else {
        guest.RSVP = nextRsvp;
      }
    }

    if (Object.prototype.hasOwnProperty.call(updates, "phone")) {
      const phoneColumn = Object.keys(guest).find((column) => /^phone/i.test(String(column || "").trim())) || "phone";
      guest[phoneColumn] = String(updates.phone || "").trim();
    }

    if (Object.prototype.hasOwnProperty.call(updates, "smsOptedIn")) {
      const consentColumn = Object.keys(guest).find((column) => /^sms\s*opted\s*in$/i.test(String(column || "").trim())) || "smsOptedIn";
      guest[consentColumn] = updates.smsOptedIn ? "TRUE" : "FALSE";
    }

    return guest;
  }

  async function saveGuestTypeSelection(rowNumber, typeValue) {
    const numericRowNumber = Number(rowNumber || 0);
    if (!numericRowNumber) {
      throw new Error("Missing guest row number.");
    }

    const guest = cachedGuests.find((row) => getGuestRowNumber(row) === numericRowNumber);
    const nextRsvp = guest ? getGuestRsvpLabel(guest) : "";
    await backendRequest("saveGuestDetails", {
      rowNumber: numericRowNumber,
      type: typeValue,
      rsvp: nextRsvp
    });
    updateCachedGuestDetails(numericRowNumber, { type: typeValue });
  }

  async function toggleGuestRsvp(rowNumber) {
    const numericRowNumber = Number(rowNumber || 0);
    const guest = cachedGuests.find((row) => getGuestRowNumber(row) === numericRowNumber);
    if (!guest) {
      throw new Error("Guest row not found.");
    }

    const nextRsvp = getNextGuestRsvpValue(getGuestRsvpLabel(guest));
    await backendRequest("saveGuestDetails", {
      rowNumber: numericRowNumber,
      type: getGuestTypeValue(guest),
      rsvp: nextRsvp
    });
    updateCachedGuestDetails(numericRowNumber, { rsvp: nextRsvp });
    return nextRsvp;
  }

  function getTypeTokens(value) {
    return String(value || "")
      .split(",")
      .map((token) => token.trim())
      .filter(Boolean);
  }

  function dedupeTokens(tokens) {
    const seen = new Set();
    return (Array.isArray(tokens) ? tokens : [])
      .map((token) => String(token || "").trim())
      .filter(Boolean)
      .filter((token) => {
        const key = token.toLowerCase();
        if (seen.has(key)) {
          return false;
        }
        seen.add(key);
        return true;
      });
  }

  function collectGuestTypes(guests) {
    return Array.from(new Set(
      guests
        .flatMap((guest) => getTypeTokens(guest.type))
    )).sort((a, b) => a.localeCompare(b));
  }

  function getGuestNameOptions() {
    return Array.from(new Set(
      cachedGuests
        .map((guest) => getGuestDisplayName(guest))
        .filter(Boolean)
    )).sort((a, b) => a.localeCompare(b));
  }

  function renderEventAssignedPeopleSuggestions() {
    if (!eventAssignedPeopleSuggestionsEl) {
      return;
    }

    const names = getGuestNameOptions();
    eventAssignedPeopleSuggestionsEl.innerHTML = names
      .map((name) => `<option value="${escapeHtml(name)}"></option>`)
      .join("");
  }

  function resolveIncludedPeopleForEvent(event) {
    const assignedTypes = getEventAssignedToTokens(event);
    const explicitNames = getEventAssignedPeopleTokens(event);
    const includedLookup = new Map();

    cachedGuests.forEach((guest) => {
      const name = getGuestDisplayName(guest);
      if (!name) {
        return;
      }

      const guestTypes = getTypeTokens(getGuestTypeValue(guest));
      const guestTypeLookup = new Set(guestTypes.map((guestType) => String(guestType || "").trim().toLowerCase()).filter(Boolean));
      const matchedTypes = assignedTypes.filter((assignedType) => guestTypeLookup.has(String(assignedType || "").trim().toLowerCase()));

      if (!matchedTypes.length) {
        return;
      }

      includedLookup.set(name.toLowerCase(), {
        name,
        detail: matchedTypes.join(", ")
      });
    });

    explicitNames.forEach((name) => {
      const key = name.toLowerCase();
      const existing = includedLookup.get(key);
      if (existing) {
        return;
      }

      includedLookup.set(key, {
        name,
        detail: "Added by name"
      });
    });

    return Array.from(includedLookup.values()).sort((a, b) => a.name.localeCompare(b.name));
  }

  function renderGuestTypeFilter(types) {
    if (!guestTypeFilterEl) {
      return;
    }

    const normalizedTypes = Array.isArray(types) ? types : [];
    const typeLookup = new Set(normalizedTypes.map((type) => type.toLowerCase()));
    selectedGuestTypes = selectedGuestTypes.filter((type) => typeLookup.has(String(type || "").toLowerCase()));
    updateGuestTypeFilterSummary();

    if (!normalizedTypes.length) {
      guestTypeFilterEl.innerHTML = '<span class="planner-filter-checklist--empty">All types</span>';
      return;
    }

    const selectedLookup = new Set(selectedGuestTypes.map((type) => String(type || "").toLowerCase()));
    guestTypeFilterEl.innerHTML = normalizedTypes.map((type) => `
      <label class="planner-filter-checklist__option">
        <input type="checkbox" value="${escapeHtml(type)}" data-guest-type-filter ${selectedLookup.has(type.toLowerCase()) ? "checked" : ""}>
        <span>${escapeHtml(type)}</span>
      </label>
    `).join("");
  }

  function updateGuestTypeFilterSummary() {
    if (!guestTypeFilterSummaryEl) {
      return;
    }

    if (!selectedGuestTypes.length) {
      guestTypeFilterSummaryEl.textContent = "All types";
      guestTypeFilterSummaryEl.title = "All types";
      return;
    }

    const summaryText = selectedGuestTypes.length <= 2
      ? selectedGuestTypes.join(", ")
      : `${selectedGuestTypes.length} selected`;
    guestTypeFilterSummaryEl.textContent = summaryText;
    guestTypeFilterSummaryEl.title = selectedGuestTypes.join(", ");
  }

  function collectEventDateOptions(events) {
    const normalizedEvents = Array.isArray(events) ? events : [];
    const parsedDates = normalizedEvents
      .filter((event) => !isFalseLike(event?.active))
      .map((event) => ({
        event,
        value: getEventDateFilterValue(event),
        parsed: parseEventDateTime({ date: getEventDateFilterValue(event), startsAt: "00:00" })
      }))
      .filter((item) => item.value && item.parsed);

    if (!parsedDates.length) {
      return [];
    }

    const ceremonyDateValue = parsedDates.find((item) => /ceremony/i.test(String(item.event?.title || "")))?.value || "";
    const mainDateCounts = parsedDates.reduce((counts, item) => {
      if (!isTrueLike(item.event?.main)) {
        return counts;
      }

      counts.set(item.value, (counts.get(item.value) || 0) + 1);
      return counts;
    }, new Map());

    const fallbackDateValue = parsedDates
      .map((item) => item.value)
      .sort((left, right) => right.localeCompare(left))[0];

    const primaryDateValue = ceremonyDateValue
      || [...mainDateCounts.entries()]
        .sort((left, right) => {
          const countDelta = right[1] - left[1];
          if (countDelta !== 0) {
            return countDelta;
          }
          return right[0].localeCompare(left[0]);
        })[0]?.[0]
      || fallbackDateValue;

    const primaryDate = parseEventDateTime({ date: primaryDateValue, startsAt: "00:00" });
    if (!primaryDate) {
      return [];
    }

    const priorCutoff = new Date(primaryDate);
    priorCutoff.setDate(priorCutoff.getDate() - 1);
    const priorCutoffValue = `${priorCutoff.getFullYear()}-${String(priorCutoff.getMonth() + 1).padStart(2, "0")}-${String(priorCutoff.getDate()).padStart(2, "0")}`;

    return [
      { value: primaryDateValue, label: formatEventDateShort(primaryDateValue) },
      { value: `before:${primaryDateValue}`, label: `${formatEventDateShort(priorCutoffValue)} or before` }
    ];
  }

  function collectEventAssignedToOptions(events) {
    const knownTypeLookup = new Set(getGuestTypeOptions().map((type) => String(type || "").trim().toLowerCase()));
    return Array.from(new Set(
      (Array.isArray(events) ? events : [])
        .flatMap((event) => getEventAssignedToTokens(event))
        .filter((token) => {
          const normalized = String(token || "").trim().toLowerCase();
          return normalized && knownTypeLookup.has(normalized);
        })
    )).sort((left, right) => left.localeCompare(right, undefined, { sensitivity: "base" }));
  }

  function renderEventDateFilter(dates) {
    if (!eventDateFilterEl) {
      return;
    }

    const normalizedDates = Array.isArray(dates) ? dates : [];
    if (selectedEventDate && !normalizedDates.some((item) => item.value === selectedEventDate)) {
      selectedEventDate = "";
    }

    eventDateFilterEl.innerHTML = `
      <option value="">All dates</option>
      ${normalizedDates.map((item) => `<option value="${escapeHtml(item.value)}">${escapeHtml(item.label)}</option>`).join("")}
    `;
    eventDateFilterEl.value = selectedEventDate;
    eventDateFilterEl.disabled = normalizedDates.length === 0;
  }

  function renderEventAssignedToFilter(assignees) {
    if (!eventAssignedToFilterEl) {
      return;
    }

    const normalizedAssignees = Array.isArray(assignees) ? assignees : [];
    const assigneeLookup = new Set(normalizedAssignees.map((assignee) => assignee.toLowerCase()));
    selectedEventAssignedTo = selectedEventAssignedTo.filter((assignee) => assigneeLookup.has(String(assignee || "").toLowerCase()));
    updateEventAssignedToFilterSummary();

    if (!normalizedAssignees.length) {
      eventAssignedToFilterEl.innerHTML = '<span class="planner-filter-checklist--empty">All assignees</span>';
      return;
    }

    const selectedLookup = new Set(selectedEventAssignedTo.map((assignee) => String(assignee || "").toLowerCase()));
    eventAssignedToFilterEl.innerHTML = normalizedAssignees.map((assignedTo) => `
      <label class="planner-filter-checklist__option">
        <input type="checkbox" value="${escapeHtml(assignedTo)}" data-event-assigned-to-filter ${selectedLookup.has(assignedTo.toLowerCase()) ? "checked" : ""}>
        <span>${escapeHtml(assignedTo)}</span>
      </label>
    `).join("");
  }

  function updateEventAssignedToFilterSummary() {
    if (!eventAssignedToFilterSummaryEl) {
      return;
    }

    if (!selectedEventAssignedTo.length) {
      eventAssignedToFilterSummaryEl.textContent = "All assignees";
      eventAssignedToFilterSummaryEl.title = "All assignees";
      return;
    }

    const summaryText = selectedEventAssignedTo.length <= 2
      ? selectedEventAssignedTo.join(", ")
      : `${selectedEventAssignedTo.length} selected`;
    eventAssignedToFilterSummaryEl.textContent = summaryText;
    eventAssignedToFilterSummaryEl.title = selectedEventAssignedTo.join(", ");
  }

  function collectTodoAssignedToOptions(todos) {
    const options = new Map();
    (Array.isArray(todos) ? todos : []).forEach((todo) => {
      const ids = Array.isArray(todo?.assignedUserIds) ? todo.assignedUserIds : [todo?.assignedUserId];
      ids.map((id) => String(id || "").trim()).filter(Boolean).forEach((id) => options.set(id, getWorkspaceTaskAssigneeLabel(id)));
    });
    return Array.from(options, ([id, label]) => ({ id, label }))
      .sort((left, right) => left.label.localeCompare(right.label, undefined, { sensitivity: "base" }));
  }

  function renderTodoAssignedToFilter(assignees) {
    if (!todoAssignedToFilterEl) return;

    const normalizedAssignees = Array.isArray(assignees) ? assignees : [];
    const assigneeLookup = new Set(normalizedAssignees.map((assignee) => assignee.id));
    selectedTodoAssignedTo = selectedTodoAssignedTo
      .filter((assignee) => String(assignee || "") === "__unassigned__" || assigneeLookup.has(String(assignee || "")))
      .slice(0, 1);
    todoAssignedToFilterEl.innerHTML = `
      <option value="">All assignees</option>
      <option value="__unassigned__">Unassigned</option>
      ${normalizedAssignees.map((assignee) => `<option value="${escapeHtml(assignee.id)}">${escapeHtml(assignee.label)}</option>`).join("")}
    `;
    todoAssignedToFilterEl.value = selectedTodoAssignedTo[0] || "";
    todoAssignedToFilterEl.disabled = false;
  }

  function syncTodoGroupToggle() {
    todoGroupToggleButtons.forEach((button) => {
      const active = button.dataset.todoGroupBy === todoGroupBy;
      button.classList.toggle("is-active", active);
      button.setAttribute("aria-pressed", active ? "true" : "false");
    });
  }

  function getFilteredTodos() {
    if (!selectedTodoAssignedTo.length) return cachedWorkspaceTasks;
    const selectedLookup = new Set(selectedTodoAssignedTo);
    return cachedWorkspaceTasks.filter((todo) => {
      const ids = Array.isArray(todo?.assignedUserIds) ? todo.assignedUserIds : [todo?.assignedUserId];
      if (selectedLookup.has("__unassigned__")) {
        return !ids.some((id) => String(id || "").trim());
      }
      return ids.some((id) => selectedLookup.has(String(id || "").trim()));
    });
  }

  function getWorkspaceTaskListName(listId) {
    const list = cachedWorkspaceLists.find((item) => String(item.id || "") === String(listId || ""));
    return String(list?.title || "No checklist").trim() || "No checklist";
  }

  function getWorkspaceTaskParent(eventId) {
    return cachedWorkspaceEvents.find((item) => String(item.id || "") === String(eventId || "")) || null;
  }

  function getWorkspaceTaskAssigneeLabel(assignedUserIds) {
    const ids = (Array.isArray(assignedUserIds) ? assignedUserIds : String(assignedUserIds || "").split(/[\n,;]+/))
      .map((id) => String(id || "").trim()).filter(Boolean);
    if (!ids.length) return "Unassigned";
    return ids.map((id) => {
      if (id.startsWith("guest-type:")) return id.slice("guest-type:".length) || "Guest type";
      if (id.startsWith("guest:")) {
        const guestValue = id.slice("guest:".length).trim();
        const guest = getWorkspaceInviteeGuestChoices().find((item) =>
          String(item?.id || "").trim().toLowerCase() === guestValue.toLowerCase()
          || String(item?.name || "").trim().toLowerCase() === guestValue.toLowerCase()
        );
        return guest?.name || guestValue || "Guest";
      }
      const user = cachedWorkspaceUsers.find((item) => String(item.id || "") === id);
      return user?.name || user?.email || id;
    }).join(", ");
  }

  function renderTodoAssigneeOptions(selectedId) {
    const selected = String(selectedId || "");
    const users = cachedWorkspaceUsers.filter((user) => user.active);
    const guestTypes = Array.isArray(cachedWorkspaceInvitees.groups)
      ? cachedWorkspaceInvitees.groups.map((group) => String(group || "").trim()).filter(Boolean)
      : [];
    const availableIds = new Set([
      ...users.map((user) => String(user.id || "")),
      ...guestTypes.map((type) => `guest-type:${type}`)
    ]);
    // Older tasks can be assigned directly to a guest (guest:<name>) or by
    // guest id. Retain that valid selection even when it is not one of the
    // planner-manager choices displayed in this menu.
    const selectedFallback = selected && !availableIds.has(selected)
      ? `<optgroup label="Current assignment"><option value="${escapeHtml(selected)}" selected>${escapeHtml(getWorkspaceTaskAssigneeLabel(selected))}</option></optgroup>`
      : "";
    return `
      <option value="">Unassigned</option>
      ${users.length ? `<optgroup label="Planner members">${users.map((user) => `<option value="${escapeHtml(user.id)}" ${String(user.id) === selected ? "selected" : ""}>${escapeHtml(user.name || user.email)}</option>`).join("")}</optgroup>` : ""}
      ${guestTypes.length ? `<optgroup label="Guest types">${guestTypes.map((type) => {
        const id = `guest-type:${type}`;
        return `<option value="${escapeHtml(id)}" ${id === selected ? "selected" : ""}>${escapeHtml(type)}</option>`;
      }).join("")}</optgroup>` : ""}
      ${selectedFallback}
    `;
  }

  function renderTodoStatusOptions(selectedStatus) {
    const selected = String(selectedStatus || "Not Started");
    return ["Not Started", "In Progress", "Waiting", "Done"].map((status) => (
      `<option value="${escapeHtml(status)}" ${status === selected ? "selected" : ""}>${escapeHtml(status)}</option>`
    )).join("");
  }

  function normalizeWorkspaceTaskDueDate(value) {
    const raw = String(value || "").trim();
    if (!raw) return "";
    const isoMatch = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (isoMatch) return `${isoMatch[1]}-${isoMatch[2]}-${isoMatch[3]}`;
    const parsed = new Date(raw);
    if (Number.isNaN(parsed.getTime())) return "";
    return `${parsed.getFullYear()}-${String(parsed.getMonth() + 1).padStart(2, "0")}-${String(parsed.getDate()).padStart(2, "0")}`;
  }

  function getWorkspaceTaskDueDateValue(task) {
    return normalizeWorkspaceTaskDueDate(task?.dueAt || task?.dueDate || "");
  }

  function formatWorkspaceTaskDueDate(dueAt) {
    const date = String(dueAt || "").slice(0, 10);
    if (!date) return "No due date";
    const parsed = new Date(`${date}T12:00:00`);
    return Number.isNaN(parsed.getTime()) ? date : parsed.toLocaleDateString([], { month: "short", day: "numeric" });
  }

  function getGuestTypeOptions() {
    return collectGuestTypes(
      cachedGuests
        .map((row) => ({ type: getGuestTypeValue(row) }))
        .filter((item) => item.type)
    );
  }

  function collectEventAssignedToFormValue() {
    if (!eventForm) {
      return "";
    }

    const formData = new FormData(eventForm);
    const selectedTypes = formData.getAll("assignedToType");
    const extraTypes = getTypeTokens(formData.get("assignedToExtra"));
    return dedupeTokens([...selectedTypes, ...extraTypes]).join(", ");
  }

  function renderEventAssignedTypeOptions(selectedAssignedTo = "") {
    if (!eventAssignedTypeOptionsEl || !eventForm) {
      return;
    }

    const types = getGuestTypeOptions();
    const selectedTokens = getTypeTokens(selectedAssignedTo);
    const selectedLookup = new Set(selectedTokens.map((token) => token.toLowerCase()));
    const typeLookup = new Set(types.map((type) => type.toLowerCase()));
    const extraField = eventForm.elements.namedItem("assignedToExtra");
    const extraTypes = selectedTokens.filter((token) => !typeLookup.has(token.toLowerCase()));

    if (extraField) {
      extraField.value = extraTypes.join(", ");
    }

    if (!types.length) {
      eventAssignedTypeOptionsEl.innerHTML = '<p class="meta">No guest types loaded yet.</p>';
      return;
    }

    eventAssignedTypeOptionsEl.innerHTML = types.map((type) => `
      <label class="type-option">
        <input type="checkbox" name="assignedToType" value="${escapeHtml(type)}" ${selectedLookup.has(type.toLowerCase()) ? "checked" : ""}>
        <span>${escapeHtml(type)}</span>
      </label>
    `).join("");
  }

  function getFilteredEvents() {
    return cachedEvents.filter((event) => {
      if (selectedEventDate) {
        const eventDateValue = getEventDateFilterValue(event);
        if (selectedEventDate.startsWith("before:")) {
          const cutoff = selectedEventDate.slice("before:".length);
          if (!eventDateValue) {
            return true;
          }
          if (eventDateValue >= cutoff) {
            return false;
          }
        } else if (eventDateValue !== selectedEventDate) {
          return false;
        }
      }

      if (selectedEventAssignedTo.length) {
        const eventAssignees = new Set(getEventAssignedToTokens(event).map((token) => token.toLowerCase()));
        if (!selectedEventAssignedTo.some((assignee) => eventAssignees.has(String(assignee || "").toLowerCase()))) {
          return false;
        }
      }

      return true;
    });
  }

  function renderTableTypeOptions() {
    if (!tableTypeOptionsEl) {
      return;
    }

    const types = getGuestTypeOptions();

    if (!types.length) {
      tableTypeOptionsEl.innerHTML = '<p class="meta">No guest types loaded yet.</p>';
      return;
    }

    tableTypeOptionsEl.innerHTML = types.map((type) => `
      <label class="type-option">
        <input type="checkbox" name="type" value="${escapeHtml(type)}">
        <span>${escapeHtml(type)}</span>
      </label>
    `).join("");
  }

  function findGuestTitleColumn(columns) {
    return columns.find((column) => /name/i.test(column)) || columns[0] || "Guest";
  }

  function findGuestColumn(row, matcher) {
    return Object.keys(row).find((column) => matcher.test(String(column || "").trim()));
  }

  function getGuestDisplayName(row) {
    const nameColumn = findGuestColumn(row, /name/i);
    return String(nameColumn ? row[nameColumn] || "" : "").trim();
  }

  function getGuestRowNumber(row) {
    const raw = row.__rowNumber;
    const parsed = Number(raw || 0);
    return Number.isInteger(parsed) && parsed > 1 ? parsed : 0;
  }

  function getGuestTypeValue(row) {
    const typeColumn = findGuestColumn(row, /^type$/i);
    return String(typeColumn ? row[typeColumn] || "" : "").trim();
  }

  function getGuestEmail(row) {
    const emailColumn = Object.keys(row || {}).find((column) => {
      const normalized = String(column || "").toLowerCase().replace(/[^a-z0-9]/g, "");
      return normalized.includes("email") || normalized === "googleaccount";
    });
    return String(emailColumn ? row[emailColumn] || "" : "").trim();
  }

  function getGuestPhone(row) {
    const phoneColumn = Object.keys(row || {}).find((column) => {
      const normalized = String(column || "").toLowerCase().replace(/[^a-z0-9]/g, "");
      return normalized.includes("phone") || normalized.includes("mobile") || normalized.includes("cell");
    });
    return String(phoneColumn ? row[phoneColumn] || "" : "").trim();
  }

  function findTableColumn(table, matcher) {
    return Object.keys(table || {}).find((column) => matcher.test(String(column || "").trim()));
  }

  function getTableColumnValue(table, matcher) {
    const column = findTableColumn(table, matcher);
    return String(column ? table[column] || "" : "").trim();
  }

  function isTableLayoutSideToken(value) {
    const normalized = String(value || "").trim().toLowerCase();
    return normalized.includes("bar")
      || normalized.includes("food")
      || normalized.includes("head")
      || normalized.includes("center");
  }

  function getTableTypes(table) {
    const rawTypeValue = String(table?.type || getTableColumnValue(table, /^type$/i) || "").trim();
    return isTableLayoutSideToken(rawTypeValue) ? [] : getTypeTokens(rawTypeValue);
  }

  function tableAcceptsAnyGuest(table) {
    return getTableTypes(table).length === 0;
  }

  function getTableGuestTypeValue(table) {
    const typeValue = String(table?.type || getTableColumnValue(table, /^type$/i) || "").trim();
    return isTableLayoutSideToken(typeValue) ? "" : typeValue;
  }

  function getTableLayoutSideValue(table) {
    const raw = String(
      table?.location
      || getTableColumnValue(table, /^location$/i)
      || (isTableLayoutSideToken(table?.type) ? table?.type : "")
      || ""
    ).trim().toLowerCase();
    if (!raw) {
      return "head";
    }
    if (raw.includes("bar")) {
      return "bar";
    }
    if (raw.includes("food")) {
      return "food";
    }
    if (raw.includes("head") || raw.includes("center")) {
      return "head";
    }
    return "head";
  }

  function getTableLayoutOrder(table) {
    const raw = String(table?.order || getTableColumnValue(table, /^order$/i) || "").trim();
    const parsed = Number(raw);
    return Number.isFinite(parsed) && parsed > 0 ? parsed : Infinity;
  }

  function getTableLayoutLabel(table) {
    return String(
      table?.location
      || getTableColumnValue(table, /^location$/i)
      || (isTableLayoutSideToken(table?.type) ? table?.type : "")
      || "Center"
    ).trim() || "Center";
  }

  function sortTablesForLayout(items) {
    return [...items].sort((left, right) => {
      const orderDelta = getTableLayoutOrder(left) - getTableLayoutOrder(right);
      if (orderDelta !== 0) {
        return orderDelta;
      }
      return compareTableNumbers(String(left.tableName || ""), String(right.tableName || ""));
    });
  }

  function groupTablesForLayout(items) {
    const groups = [
      { key: "head", label: "Head", tables: [] },
      { key: "food", label: "Food Side", tables: [] },
      { key: "bar", label: "Bar Side", tables: [] }
    ];
    const groupMap = new Map(groups.map((group) => [group.key, group]));

    items.forEach((table) => {
      const side = getTableLayoutSideValue(table);
      const targetGroup = groupMap.get(side) || groupMap.get("head");
      targetGroup.tables.push(table);
    });

    groups.forEach((group) => {
      group.tables = sortTablesForLayout(group.tables);
    });

    return groups;
  }

  function getGuestTableNumber(row) {
    const tableColumn = findGuestColumn(row, /^table\s*(number|#)?$/i);
    return String(tableColumn ? row[tableColumn] || "" : "").trim();
  }

  function getGuestTableOrder(row) {
    const orderColumn = findGuestColumn(row, /^table\s*order$/i);
    const raw = String(orderColumn ? row[orderColumn] || "" : "").trim();
    const parsed = Number(raw);
    return Number.isFinite(parsed) && parsed > 0 ? parsed : 0;
  }

  function getGuestRsvpLabel(row) {
    const rsvpColumn = findGuestColumn(row, /^rsvp$/i);
    return String(rsvpColumn ? row[rsvpColumn] || "" : "").trim();
  }

  function getGuestPlusOneRsvp(row) {
    const plusOneColumn = findGuestColumn(row, /plus\s*1.*rsvp|rsvp.*plus\s*1|plus\s*one.*rsvp/i);
    return String(plusOneColumn ? row[plusOneColumn] || "" : "").trim();
  }

  function isPlusOneAttending(plusOneRsvp) {
    return getRsvpGroup(plusOneRsvp) === "yes";
  }

  function formatTableGuestName(guest) {
    return String(guest?.name || "").trim() || "Guest";
  }

  function countUnseatedPeople() {
    return cachedGuests
      .map((row) => ({
        rowNumber: getGuestRowNumber(row),
        name: getGuestDisplayName(row),
        attending: getGuestRsvpLabel(row),
        plusOneRsvp: getGuestPlusOneRsvp(row),
        tableNumber: getGuestTableNumber(row)
      }))
      .filter((guest) => guest.rowNumber && guest.name)
      .filter((guest) => getRsvpGroup(guest.attending) === "yes")
      .filter((guest) => !guest.tableNumber)
      .reduce((total, guest) => total + 1 + (isPlusOneAttending(guest.plusOneRsvp) ? 1 : 0), 0);
  }

  function getDashboardRsvps() {
    if (cachedGuests.length) {
      return cachedGuests
        .map((row) => ({
          name: getGuestDisplayName(row),
          attending: getGuestRsvpLabel(row),
          plusOneRsvp: getGuestPlusOneRsvp(row),
          tableNumber: getGuestTableNumber(row),
          type: getGuestTypeValue(row),
          submittedAt: "",
          email: "",
          guests: "",
          comment: ""
        }))
        .filter((item) => item.name && item.attending);
    }

    return cachedRsvps;
  }

  function getRsvpSubmissions() {
    return cachedRsvps.filter((item) => item.name || item.group || item.attending || item.comment);
  }

  function compareTableNumbers(left, right) {
    const leftNumber = Number.parseFloat(String(left).replace(/[^\d.]/g, ""));
    const rightNumber = Number.parseFloat(String(right).replace(/[^\d.]/g, ""));

    if (!Number.isNaN(leftNumber) && !Number.isNaN(rightNumber) && leftNumber !== rightNumber) {
      return leftNumber - rightNumber;
    }

    return String(left).localeCompare(String(right), undefined, { numeric: true, sensitivity: "base" });
  }

  function getCurrentWorkspaceViewerUserId() {
    const profileUserId = String(viewerProfile.userId || "").trim();
    if (profileUserId) return profileUserId;

    const profileEmail = String(viewerProfile.email || "").trim().toLowerCase();
    return String(cachedWorkspaceUsers.find((user) => String(user.email || "").trim().toLowerCase() === profileEmail)?.id || "").trim();
  }

  function isWorkspaceTaskAssignedToViewer(task) {
    const assignedUserId = String(task?.assignedUserId || "").trim().toLowerCase();
    if (!assignedUserId) return false;
    const viewerUserId = getCurrentWorkspaceViewerUserId();
    const workspaceUser = cachedWorkspaceUsers.find((user) => String(user.id || "").trim() === viewerUserId)
      || cachedWorkspaceUsers.find((user) => String(user.email || "").trim().toLowerCase() === String(viewerProfile.email || "").trim().toLowerCase());
    const assignments = [
      viewerUserId,
      workspaceUser?.guestId,
      viewerProfile.name ? `guest:${viewerProfile.name}` : "",
      workspaceUser?.name ? `guest:${workspaceUser.name}` : ""
    ].map((value) => String(value || "").trim().toLowerCase()).filter(Boolean);
    // Tasks may have been saved using the planner-user id, the linked guest
    // id, or the legacy guest:<name> form. Normalize each representation to
    // the same identity before deciding whether the checkbox is usable.
    const assignedUser = cachedWorkspaceUsers.find((user) => (
      String(user.id || "").trim().toLowerCase() === assignedUserId
      || String(user.guestId || "").trim().toLowerCase() === assignedUserId
    ));
    const taskAssignments = [
      assignedUserId,
      assignedUser?.id,
      assignedUser?.guestId,
      assignedUser?.name ? `guest:${assignedUser.name}` : ""
    ].map((value) => String(value || "").trim().toLowerCase()).filter(Boolean);
    return taskAssignments.some((assignment) => assignments.includes(assignment));
  }

  function renderWorkspaceTaskCompletionCheckbox(task) {
    const completed = String(task.status || "").trim().toLowerCase() === "done";
    const canToggle = Boolean(viewerProfile.isAdmin) || isWorkspaceTaskAssignedToViewer(task);
    return `<input class="todo-task-complete" type="checkbox" data-workspace-todo-complete="${escapeHtml(String(task.id || ""))}" aria-label="Mark ${escapeHtml(task.title || "task")} ${completed ? "incomplete" : "complete"}" ${completed ? "checked" : ""} ${canToggle ? "" : "disabled"}>`;
  }

  function isLegacyTaskAssignedToViewer(task) {
    const viewerNames = [
      String(viewerProfile.name || "").trim(),
      getWorkspaceTaskAssigneeLabel(getCurrentWorkspaceViewerUserId())
    ].map((name) => name.toLowerCase()).filter((name) => name && name !== "unassigned");
    const assignees = String(task?.assignedTo || "")
      .split(/[;,\n]/)
      .map((name) => name.trim().toLowerCase())
      .filter(Boolean);
    return viewerNames.some((viewerName) => assignees.includes(viewerName));
  }

    // Once the Workspace contains tasks, it is the source of truth. In

        </div>
        ${tasksMarkup}
        ${openTasks.length > 6 ? `<button class="button button--light planner-home-card__action" type="button" data-home-open-panel="todos" data-home-filter-todos-for-viewer>View all ${openTasks.length} tasks</button>` : ""}

      <article class="planner-home-card planner-home-card--next-event">
        <span class="planner-home-card__label">Next event</span>
        <h3>${nextEventTitle}</h3>

      <article class="planner-home-card planner-home-card--countdown">
        <span class="planner-home-card__label">Countdown</span>
        <h3>Days until January 8</h3>
        ${countdownMarkup}
      </article>
    `;

    startPlannerCountdown(weddingDate, "the wedding");

  function sortByUpdated(items, key) {
    return [...items].sort((left, right) => String(right[key] || "").localeCompare(String(left[key] || "")));
  }

  function sortEvents(items) {
    return [...items].sort((left, right) => {
      const leftDate = parseEventDateTime(left);
      const rightDate = parseEventDateTime(right);
      if (leftDate && rightDate) {
        const datedComparison = leftDate.getTime() - rightDate.getTime();
        if (datedComparison !== 0) {
          return datedComparison;
        }
      } else {
        const leftStamp = `${left.date || ""}T${left.startsAt || ""}`;
        const rightStamp = `${right.date || ""}T${right.startsAt || ""}`;
        const datedComparison = leftStamp.localeCompare(rightStamp);
        if (datedComparison !== 0) {
          return datedComparison;
        }
      }
      return String(left.title || "").localeCompare(String(right.title || ""));
    });
  }

  function sortTodos(items) {
    return [...items].sort((left, right) => {
      const completeDelta = Number(Boolean(left.isComplete)) - Number(Boolean(right.isComplete));
      if (completeDelta !== 0) {
        return completeDelta;
      }

      const dueDelta = String(left.dueDate || "").localeCompare(String(right.dueDate || ""));
      if (dueDelta !== 0) {
        return dueDelta;
      }

      return String(left.title || "").localeCompare(String(right.title || ""));
    });
  }

  function sortEventLists(items) {
    return [...items].sort((left, right) => {
      const eventDelta = String(left.eventId || "").localeCompare(String(right.eventId || ""));
      if (eventDelta !== 0) {
        return eventDelta;
      }

      return String(left.title || "").localeCompare(String(right.title || ""));
    });
  }

  function sortShots(items) {
    const eventOrder = new Map(cachedEvents.map((event, index) => [String(event.id || "").trim(), index]));
    return [...items].sort((left, right) => {
      const leftComplete = Number(Boolean(left.isComplete));
      const rightComplete = Number(Boolean(right.isComplete));
      if (leftComplete !== rightComplete) {
        return leftComplete - rightComplete;
      }

      const leftEventOrder = eventOrder.has(String(left.eventId || "").trim())
        ? eventOrder.get(String(left.eventId || "").trim())
        : Number.MAX_SAFE_INTEGER;
      const rightEventOrder = eventOrder.has(String(right.eventId || "").trim())
        ? eventOrder.get(String(right.eventId || "").trim())
        : Number.MAX_SAFE_INTEGER;
      if (leftEventOrder !== rightEventOrder) {
        return leftEventOrder - rightEventOrder;
      }

      const orderDelta = Number(left.sortOrder || 0) - Number(right.sortOrder || 0);
      if (orderDelta !== 0) {
        return orderDelta;
      }

      const priorityDelta = getShotPriorityRank(left.priority) - getShotPriorityRank(right.priority);
      if (priorityDelta !== 0) {
        return priorityDelta;
      }

      return String(left.title || "").localeCompare(String(right.title || ""));
    });
  }

    renderPeople();

  function formatWorkspaceMonth(value) {
    return value.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  }

  function workspaceDateKey(value) {
    return `${value.getFullYear()}-${String(value.getMonth() + 1).padStart(2, "0")}-${String(value.getDate()).padStart(2, "0")}`;
  }

  function getWorkspaceCalendarHoliday(value) {
    if (value.getMonth() === 11 && value.getDate() === 25) return "Christmas Day";
    if (value.getMonth() !== 10) return "";
    const novemberFirst = new Date(value.getFullYear(), 10, 1);
    const thanksgivingDate = 1 + ((4 - novemberFirst.getDay() + 7) % 7) + 21;
    return value.getDate() === thanksgivingDate ? "Thanksgiving" : "";
  }

  function getWorkspaceCalendarHolidayShortLabel(holiday) {
    return holiday === "Thanksgiving" ? "Thksgvn" : holiday === "Christmas Day" ? "Xmas" : holiday;
  }

  function formatWorkspaceDay(value) {
    return value.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" });
  }

  function parseWorkspaceDate(value) {
    const raw = String(value || "").trim();
    if (!raw) return null;
    const parsed = new Date(raw);
    return Number.isNaN(parsed.getTime()) ? null : parsed;
  }

  function formatWorkspaceEventSchedule(event) {
    const startsAt = parseWorkspaceDate(event?.startsAt);
    if (!startsAt) return "Date and time not set";
    return startsAt.toLocaleString(undefined, {
      weekday: "short",
      month: "short",
      day: "numeric",
      hour: "numeric",
      minute: "2-digit"
    });
  }

  function formatWorkspaceEventTime(event) {
    const startsAt = parseWorkspaceDate(event?.startsAt);
    return startsAt
      ? startsAt.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })
      : "Time not set";
  }

  function formatWorkspaceEventDate(event) {
    const startsAt = parseWorkspaceDate(event?.startsAt);
    return startsAt
      ? startsAt.toLocaleDateString(undefined, { month: "short", day: "numeric" })
      : "Date not set";
  }

  function formatTitleCase(value) {
    return String(value || "").trim().replace(/\S+/g, (word) => {
      if (word === word.toUpperCase() && /[A-Z]/.test(word)) return word;
      return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
    });
  }

  function renderWorkspaceEventDirectory() {
    if (!workspaceEventDirectoryListEl) return;

      return startsAt && (!workspaceCalendarListDateFilter || workspaceDateKey(parseWorkspaceDate(startsAt) || new Date(0)) === workspaceCalendarListDateFilter);
    }).sort((left, right) => {
      const leftTime = parseWorkspaceDate(left.startsAt)?.getTime() || Number.MAX_SAFE_INTEGER;
      const rightTime = parseWorkspaceDate(right.startsAt)?.getTime() || Number.MAX_SAFE_INTEGER;
      return leftTime - rightTime || String(left.title || "").localeCompare(String(right.title || ""));
    });
    const monthGroups = events.reduce((groups, event) => {
      const date = parseWorkspaceDate(event.startsAt);
      if (!date) return groups;
      const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
      if (!groups.has(key)) {
        groups.set(key, {
          title: date.toLocaleDateString(undefined, { month: "long", year: "numeric" }),
          events: []

      }
      groups.get(key).events.push({ event, date });
      return groups;
    }, new Map());

    workspaceEventDirectoryListEl.innerHTML = events.length ? Array.from(monthGroups.values()).map((group) => `

        <div class="workspace-event-directory__month-events">
          ${Array.from(group.events.reduce((days, entry) => {
            const key = workspaceDateKey(entry.date);
            if (!days.has(key)) days.set(key, { date: entry.date, events: [] });
            days.get(key).events.push(entry.event);
            return days;
          }, new Map()).values()).map(({ date, events: dayEvents }) => `
        <div class="workspace-event-directory__row">
          <time class="workspace-event-directory__date" datetime="${escapeHtml(workspaceDateKey(date))}" aria-label="${escapeHtml(date.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" }))}">${date.getDate()}</time>
          <div class="workspace-event-directory__day-events">
          ${dayEvents.map((event) => {
      const eventId = String(event.id || "");
      const tasks = cachedWorkspaceTasks.filter((task) => String(task.eventId || "") === eventId);
      const completedTasks = tasks.filter((task) => ["done", "complete", "completed"].includes(String(task.status || "").trim().toLowerCase()));
      const incompleteTasks = tasks.filter((task) => !["done", "complete", "completed"].includes(String(task.status || "").trim().toLowerCase()));
      const invitationSelection = parseWorkspaceInvitationSelection(event.invitees);
      const selectedGroups = new Set(invitationSelection.groups.map((group) => group.toLowerCase()));
      const selectedIndividuals = new Set(invitationSelection.individuals.map((name) => name.toLowerCase()));
      const invitedGuests = getWorkspaceInviteeGuestChoices().filter((guest) => {
        const guestName = String(guest.name || "").toLowerCase();
        return selectedIndividuals.has(guestName) || (guest.types || []).some((type) => selectedGroups.has(String(type || "").toLowerCase()));
      });
      const inviteeNames = invitedGuests.map((guest) => String(guest.name || "").trim()).filter(Boolean);
      return `
          <details class="workspace-event-directory__item">
          <summary>
            <span class="accordion-summary__main">
              <span class="accordion-toggle" aria-hidden="true"></span>
              <span class="workspace-event-directory__summary-copy">
                <strong>${escapeHtml(event.title || "Untitled event")}</strong>
                <time class="meta workspace-event-directory__time" datetime="${escapeHtml(String(event.startsAt || ""))}">${escapeHtml(formatWorkspaceEventTime(event))}</time>
                ${viewerProfile.isAdmin ? `<button class="button button--icon button--light workspace-event-directory__edit" type="button" data-open-workspace-event="${escapeHtml(event.id)}" aria-label="Edit ${escapeHtml(event.title || "event")}" title="Edit"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"></path></svg></button>` : ""}
              </span>
            </span>
            ${tasks.length ? `<span class="workspace-event-directory__task-count" aria-label="${completedTasks.length} of ${tasks.length} tasks complete">${completedTasks.length} of ${tasks.length}</span>` : ""}
          </summary>
          <div class="workspace-event-directory__details">
            <div class="workspace-event-directory__details-grid">
              ${event.notes ? `<div class="workspace-event-directory__notes"><strong>${escapeHtml(event.notes)}</strong></div>` : ""}
              ${String(event.location || "").trim() ? `<div><strong>${escapeHtml(event.location)}</strong></div>` : ""}
              ${incompleteTasks.length ? `<div class="workspace-event-directory__tasks"><ul>${incompleteTasks.map((task) => `<li>${escapeHtml(task.title || "Untitled task")}</li>`).join("")}</ul></div>` : ""}
              ${inviteeNames.length ? `<div class="workspace-event-directory__invitees"><strong>${escapeHtml(inviteeNames.join(", "))}</strong></div>` : ""}
            </div>
          </div>
          </details>
      `;
          }).join("")}
          </div>
        </div>
      `).join("")}
        </div>
      </section>
    `).join("") : `<p class="meta">${workspaceCalendarListDateFilter ? `No events are scheduled for ${escapeHtml(formatWorkspaceDay(parseWorkspaceDate(workspaceCalendarListDateFilter) || new Date()))}.` : "No events yet. Create your first one from Add."}</p>`;
  }

  function setWorkspaceCalendarView(view) {
    activeWorkspaceCalendarView = ["month", "list"].includes(view) ? view : "list";
    window.sessionStorage.setItem(STORAGE_KEYS.workspaceCalendarView, activeWorkspaceCalendarView);

    if (workspaceCalendarTitleEl && activeWorkspaceCalendarView === "list") {
